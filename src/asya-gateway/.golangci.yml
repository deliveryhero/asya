run:
  timeout: 15m
  tests: true
  modules-download-mode: readonly
  concurrency: 3

output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
  - errcheck
  - gosec
  - staticcheck
  - govet
  - gocyclo
  - goconst
  - misspell
  - nolintlint
  - ineffassign

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  gosec:
    excludes:
    - G404
    - G112
    - G306
    - G304
    - G115
    - G204
    - G706 # slog structured logging — values are key-value pairs, never interpolated

  gocyclo:
    min-complexity: 35

  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
  - path: '_test\.go'
    linters:
    - gocyclo
    - errcheck
    - gosec
    - goconst
  - text: 'string `(true|false)` has \d+ occurrences'
    linters:
    - goconst
  - path: '_test\.go'
    text: "string `.+` has \\d+ occurrences"
    linters:
    - goconst

version: "2"
run:
  concurrency: 3
  modules-download-mode: readonly
  tests: true
linters:
  enable:
  - errcheck
  - goconst
  - gocyclo
  - govet
  - gosec
  - ineffassign
  - misspell
  - nolintlint
  - revive
  - staticcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 35
    gosec:
      excludes:
      - G404
      - G112
      - G306
      - G304
      - G115
      - G204
      - G706
    revive:
      rules:
      - name: error-return
      - name: error-naming
      - name: error-strings
      - name: exported
      - name: increment-decrement
      - name: var-naming
  exclusions:
    generated: lax
    rules:
    - linters:
      - gosec
      text: "G120"
      path: internal/oauth/
    - linters:
      - gosec
      text: "G118"
      path: internal/mcp/registry\.go
    - linters:
      - gosec
      text: "G705"
      path: internal/mesh/events\.go
    - linters:
      - revive
      path: ^(internal/a2a/|internal/queue/|pkg/types/)
    - linters:
      - nolintlint
      path: internal/queue/
    - linters:
      - staticcheck
      text: "QF1011"
      path: cmd/gateway/
    - linters:
      - errcheck
      - goconst
      - gocyclo
      - gosec
      path: _test\.go
    - linters:
      - goconst
      text: string `(true|false)` has \d+ occurrences
    - linters:
      - goconst
      path: _test\.go
      text: string `.+` has \d+ occurrences
    - linters:
      - goconst
      path: (.+)_test\.go
    paths:
    - third_party$
    - builtin$
    - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$

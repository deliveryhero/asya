# Default compiler rules shipped with asya-lab.
#
# User rules in .asya/config.compiler.rules.yaml extend (not replace) these
# defaults. User rules are checked first; these apply when no user rule matches.
#
# The parser auto-detects the scope from Python syntax:
#   with foo():                 -> context manager
#   @foo / def fn(): # asya:   -> decorator / definition-site directive
#   p = foo(p)                  -> call-site
# No need to declare scope in the rule.

# -- Context manager rules --

- match: "asyncio.timeout"
  treat-as: config
  extract:
    delay: spec.resiliency.timeout.actor

- match: "contextlib.suppress"
  treat-as: inline
  imports:
  - "import contextlib"

# -- Decorator rules --

# tenacity.retry — extract direct keyword args into resiliency policy.
# Usage: @retry(max_attempt_number=5, max_delay=60)
- match: "tenacity.retry"
  treat-as: config
  extract:
    max_attempt_number: spec.resiliency.policies.default.maxAttempts
    max_delay: spec.resiliency.policies.default.maxDuration

# timeout_decorator.timeout — extract timeout seconds.
# Usage: @timeout(30)
- match: "timeout_decorator.timeout"
  treat-as: config
  extract:
    seconds: spec.resiliency.timeout.actor

# stamina.retry — extract direct keyword args.
# Usage: @stamina.retry(attempts=3, timeout=60)
- match: "stamina.retry"
  treat-as: config
  extract:
    attempts: spec.resiliency.policies.default.maxAttempts
    timeout: spec.resiliency.policies.default.maxDuration

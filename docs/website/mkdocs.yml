site_name: Asya Docs
site_url: https://asya.sh/docs
site_description: Kubernetes-native async actor framework for orchestrating AI/ML workloads at scale
repo_name: deliveryhero/asya
repo_url: https://github.com/deliveryhero/asya
edit_uri: edit/main/docs/

docs_dir: ..

theme:
  name: shadcn
  custom_dir: .
  favicon: website/img/logo_colored_with_borders.png
  features:
  - navigation.sections
  - navigation.indexes
  - toc.integrate
  - search.suggest
  - search.highlight

extra_css:
- website/stylesheets/extra.css

# extra_javascript:
# - website/js/search-bridge.js

nav:
- Home:
  - Overview: README.md
  - Motivation: motivation.md
  - Architecture: architecture.md

plugins:
- shadcn/search:
    prebuild_index: python
- mermaid2:
    arguments:
      theme: default

markdown_extensions:
- admonition
- toc:
    permalink: "#"
- tables
- pymdownx.highlight:
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:mermaid2.fence_mermaid
- pymdownx.snippets


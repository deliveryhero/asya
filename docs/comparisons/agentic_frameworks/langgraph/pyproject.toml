[project]
name = "langgraph-examples"
version = "0.1.0"
description = "Minimal examples using LangGraph with StateGraph and tool use"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: evaluator
spec:
  actor: evaluator
  transport: sqs
  image: asya-demo:latest
  handler: demo_handlers.evaluator.evaluate
  flavors:
  - vertex-ai
  - llm-resilient
  scaling:
    minReplicaCount: 0
    maxReplicaCount: 3
    queueLength: 1

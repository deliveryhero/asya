apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-text-improver-line-26-if
  namespace: default
  labels:
    asya.sh/flow: text-improver
    asya.sh/flow-role: router
spec:
  actor: router-text-improver-line-26-if
  image: python:3.13-slim
  handler: routers.router_text_improver_line_26_if
  transport: sqs
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_POLISHER
    value: polisher

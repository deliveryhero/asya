apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-text-improver
  namespace: default
  labels:
    asya.sh/flow: text-improver
    asya.sh/flow-role: entrypoint
spec:
  actor: start-text-improver
  image: python:3.13-slim
  handler: routers.start_text_improver
  transport: sqs
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env: []

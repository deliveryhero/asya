name: PR Commit

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
    - name: Check for Semantic Title
      uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Configure which types are allowed (Conventional Commits standard + charts)
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          charts
        requireScope: false

  autolabeler:
    name: Apply labels
    runs-on: ubuntu-latest
    needs: validate-title

    steps:
    - name: Label PR by changed files
      uses: actions/labeler@v7
      with:
        sync-labels: true

    - name: Label PR by conventional commit title
      uses: actions/github-script@v9
      with:
        script: |
          const title = context.payload.pull_request.title;
          const match = title.match(/^([a-z]+)(\(.*\))?(!)?:/);
          if (!match) return;

          const labels = new Set();
          const type = match[1];
          const breaking = match[3] === '!';

          const typeLabels = {
            feat: 'feat', fix: 'fix', docs: 'docs', style: 'style',
            refactor: 'refactor', perf: 'perf', test: 'test',
            build: 'build', ci: 'ci', chore: 'chore', charts: 'charts'
          };
          if (typeLabels[type]) labels.add(typeLabels[type]);
          if (breaking) labels.add('breaking');

          if (labels.size > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [...labels]
            });
          }

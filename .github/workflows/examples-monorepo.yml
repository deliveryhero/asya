name: Examples (Monorepo)

on:
  push:
    branches: [main]
    paths:
    - examples/end-to-end/monorepo/**
  pull_request:
    branches: [main]
    paths:
    - examples/end-to-end/monorepo/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: examples/end-to-end/monorepo

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.1"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Lint
      run: make lint

  compile:
    name: Compile flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.1"
        enable-cache: true
        cache-dependency-glob: |
          examples/end-to-end/monorepo/uv.lock

    - name: Set up Python
      run: uv python install 3.13

    - name: Compile all flows
      run: make compile

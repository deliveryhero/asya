name: Deploy Site

on:
  push:
    branches: [main]
    paths:
    - 'docs/**'
    - 'website/**'
    - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
    - 'docs/**'
    - 'website/**'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'docs/website/requirements.txt'

    - name: Install dependencies
      run: pip install -r docs/website/requirements.txt

    - name: Build MkDocs site
      run: mkdocs build -f docs/website/mkdocs.yml -d ../../site/docs

    - name: Copy landing page
      run: |
        cp -r website/* site/
        echo "asya.sh" > site/CNAME

    - name: Upload artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: site
        path: site/
        retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'docs/website/requirements.txt'

    - name: Install dependencies
      run: pip install -r docs/website/requirements.txt

    - name: Build MkDocs site
      run: mkdocs build -f docs/website/mkdocs.yml -d ../../site/docs

    - name: Copy landing page
      run: |
        cp -r website/* site/
        echo "asya.sh" > site/CNAME

    - name: Preserve Helm charts from gh-pages
      run: |
        git fetch origin gh-pages
        if git show origin/gh-pages:charts/index.yaml > /dev/null 2>&1; then
          echo "[.] Restoring charts/ from gh-pages"
          git checkout origin/gh-pages -- charts/
          mv charts/ site/charts/
          # shellcheck disable=SC2012
          echo "[+] Restored $(ls site/charts/*.tgz 2>/dev/null | wc -l) chart packages"
        else
          echo "[!] No charts/ found on gh-pages, skipping"
        fi

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        cname: asya.sh

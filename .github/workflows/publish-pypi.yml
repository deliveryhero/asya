name: Publish asya-lab to PyPI

on:
  release:
    types: [published]

jobs:
  check:
    name: Detect asya-lab changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Diff src/asya-lab against previous tag
      id: diff
      run: |
        CURRENT_TAG="${{ github.event.release.tag_name }}"
        PREV_TAG=$(git tag -l 'v*.*.*' | sort -V | grep -B1 "^${CURRENT_TAG}$" | head -1)
        if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
          PREV_TAG=""
        fi
        if [ -z "$PREV_TAG" ] || [ -n "$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- src/asya-lab/)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "[.] src/asya-lab/ unchanged since $PREV_TAG — skipping"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Build package
      working-directory: src/asya-lab
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
        sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" asya_lab/__init__.py
        pip install build
        python -m build

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: src/asya-lab/dist/

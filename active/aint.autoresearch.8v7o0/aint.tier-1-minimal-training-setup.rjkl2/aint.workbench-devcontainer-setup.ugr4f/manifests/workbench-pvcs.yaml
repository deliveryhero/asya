apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-work
  namespace: atem
  labels:
    app: workbench
    dh_app: asya
    dh_squad: aimc
    dh_tribe: foodscience
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 50Gi
---
# RWO PVCs — only workbench mounts them. Training actors sync data via S3
# (see ONBOARDING.md). EFS attempted (fs-0935ec28d3fe22f9d) but no EFS CSI
# driver installed on cluster — see secret/eks-stg-setup.md for details.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-storage
  namespace: atem
  labels:
    app: workbench
    dh_app: asya
    dh_squad: aimc
    dh_tribe: foodscience
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flow-storage  # identical copy to workbench-storage since we don't have CSI driver for EFS installed and cannot mount PVC twice simultaneously
  namespace: atem
  labels:
    app: workbench
    dh_app: asya
    dh_squad: aimc
    dh_tribe: foodscience
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-tracking
  namespace: atem
  labels:
    app: workbench
    dh_app: asya
    dh_squad: aimc
    dh_tribe: foodscience
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 20Gi

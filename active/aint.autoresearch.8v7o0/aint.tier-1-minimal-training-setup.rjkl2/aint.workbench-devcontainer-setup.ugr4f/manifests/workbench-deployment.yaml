apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
  namespace: atem
  labels:
    app: workbench
    dh_app: asya
    dh_squad: aimc
    dh_tribe: foodscience
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workbench
  template:
    metadata:
      labels:
        app: workbench
        dh_app: asya
        dh_squad: aimc
        dh_tribe: foodscience
    spec:
      serviceAccountName: default
      priorityClassName: workbench-high
      terminationGracePeriodSeconds: 10
      containers:
        - name: workbench
          image: ubuntu:24.04
          command: ["/bin/bash", "/etc/workbench/init.sh"]
          volumeMounts:
            - name: work
              mountPath: /home/dev
            - name: storage
              mountPath: /storage
            - name: tracking
              mountPath: /tracking
            - name: gcp-creds
              mountPath: /secrets/gcp
              readOnly: true
            - name: init-script
              mountPath: /etc/workbench
              readOnly: true
          env:
            - name: HOME
              value: /home/dev
            - name: PATH
              value: /home/dev/.local/bin:/home/dev/.local/google-cloud-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/gcp/key.json
            - name: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
              value: /secrets/gcp/key.json
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: CLOUD_ML_REGION
              value: europe-west1
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              value: foodsci-img-gen-dev-1407-1448
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: workbench-work
        - name: storage
          persistentVolumeClaim:
            claimName: workbench-storage
        - name: tracking
          persistentVolumeClaim:
            claimName: workbench-tracking
        - name: gcp-creds
          secret:
            secretName: gcp-vertex-ai-key
        - name: init-script
          configMap:
            name: workbench-init
            defaultMode: 0755

apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-init
  namespace: atem
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail

    export DEBIAN_FRONTEND=noninteractive

    echo "[+] workbench init starting"

    # --- System packages (ephemeral, reinstalled on each pod start) ---
    apt-get update -qq
    apt-get install -y -qq openssh-server netcat-openbsd sudo git curl tmux jq unzip build-essential vim > /dev/null 2>&1

    # --- Create 'dev' user with sudo, home on PVC ---
    if ! id dev &>/dev/null; then
      groupadd -g 1000 dev 2>/dev/null || true
      useradd -d /home/dev -s /bin/bash -u 1000 -g 1000 --no-create-home dev 2>/dev/null || \
        useradd -d /home/dev -s /bin/bash --no-create-home dev
    fi
    echo "dev ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/dev
    chmod 440 /etc/sudoers.d/dev
    chown dev:dev /home/dev

    # --- SSH server ---
    mkdir -p /run/sshd
    ssh-keygen -A 2>/dev/null

    if [ -f /home/dev/.ssh/authorized_keys ]; then
      chmod 700 /home/dev/.ssh
      chmod 600 /home/dev/.ssh/authorized_keys
      chown -R dev:dev /home/dev/.ssh
      echo "[+] authorized_keys loaded from PVC"
    else
      echo "[!] no /home/dev/.ssh/authorized_keys found — SSH key auth disabled"
      echo "[!] to fix: kubectl exec into pod, run:"
      echo "[!]   mkdir -p /home/dev/.ssh && echo 'YOUR_KEY' > /home/dev/.ssh/authorized_keys"
    fi

    sed -i 's/#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
    sed -i 's/#PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
    sed -i 's/#PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
    /usr/sbin/sshd
    echo "[+] sshd started"

    # --- Persistent tools (installed to PVC, skipped if already present) ---
    export HOME=/home/dev
    export PATH="/home/dev/.local/bin:$PATH"

    if ! command -v uv &>/dev/null; then
      echo "[+] installing uv"
      su dev -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
    fi

    if ! command -v kubectl &>/dev/null; then
      echo "[+] installing kubectl"
      curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      install kubectl /home/dev/.local/bin/
      rm kubectl
    fi

    if ! command -v helm &>/dev/null; then
      echo "[+] installing helm"
      curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR="/home/dev/.local/bin" bash -s -- --no-sudo
    fi

    if ! command -v claude &>/dev/null; then
      echo "[+] installing node.js + claude code"
      su dev -c 'curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "/home/dev/.local/bin"'
      su dev -c 'export PATH="/home/dev/.local/bin:$PATH" && eval "$(/home/dev/.local/bin/fnm env)" && fnm install --lts && npm install -g @anthropic-ai/claude-code'
      FNM_NODE=$(find /home/dev/.local/share/fnm/node-versions -maxdepth 3 -name bin -type d | head -1)
      if [ -n "$FNM_NODE" ]; then
        ln -sf "$FNM_NODE/claude" /home/dev/.local/bin/claude
        ln -sf "$FNM_NODE/node" /home/dev/.local/bin/node
        ln -sf "$FNM_NODE/npm" /home/dev/.local/bin/npm
      fi
    fi

    if ! command -v git-aint &>/dev/null; then
      echo "[+] installing rustup + git-aint"
      su dev -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path'
      su dev -c 'PATH=/home/dev/.cargo/bin:$PATH cargo install git-aint'
      cp /home/dev/.cargo/bin/git-aint /home/dev/.local/bin/
    fi

    if ! command -v go &>/dev/null; then
      echo "[+] installing go"
      GO_VERSION=$(curl -sL 'https://go.dev/VERSION?m=text' | head -1)
      curl -sL "https://go.dev/dl/${GO_VERSION}.linux-amd64.tar.gz" | tar -C /home/dev/.local -xz
      ln -sf /home/dev/.local/go/bin/go /home/dev/.local/bin/go
      ln -sf /home/dev/.local/go/bin/gofmt /home/dev/.local/bin/gofmt
    fi

    if ! command -v dp-devinfra &>/dev/null; then
      echo "[+] installing dp-devinfra"
      su dev -c 'GOPATH=/home/dev/.local/gopath GOBIN=/home/dev/.local/bin go install github.com/nicholasgasior/dp-devinfra@latest'
    fi

    if [ ! -x /home/dev/.local/google-cloud-sdk/bin/gcloud ]; then
      echo "[+] installing gcloud CLI"
      su dev -c 'curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/home/dev/.local'
    fi

    # --- GCP auth (activate SA if key exists and not already activated) ---
    if [ -f /secrets/gcp/key.json ] && [ -x /home/dev/.local/google-cloud-sdk/bin/gcloud ]; then
      GCLOUD=/home/dev/.local/google-cloud-sdk/bin/gcloud
      if ! su dev -c "$GCLOUD auth list 2>/dev/null | grep -q ACTIVE"; then
        su dev -c "$GCLOUD auth activate-service-account --key-file=/secrets/gcp/key.json" || \
          echo "[!] gcloud auth activate failed (non-fatal)"
      fi
      echo "[+] GCP service account check complete"
    fi

    # --- Claude Code statusline (copy from ConfigMap mount if not on PVC) ---
    if [ ! -f /home/dev/.claude/statusline.sh ]; then
      mkdir -p /home/dev/.claude
      cp /etc/workbench/statusline.sh /home/dev/.claude/statusline.sh
      chmod +x /home/dev/.claude/statusline.sh
      echo "[+] claude statusline installed"
    fi
    if [ ! -f /home/dev/.claude/settings.json ]; then
      cat > /home/dev/.claude/settings.json << 'SETTINGS'
    {"statusLine":{"type":"command","command":"~/.claude/statusline.sh","padding":0}}
    SETTINGS
      echo "[+] claude settings created"
    fi

    # --- tmux ---
    if [ ! -f /home/dev/.tmux.conf ]; then
      cp /etc/workbench/tmux.conf /home/dev/.tmux.conf
      echo "[+] ~/.tmux.conf created"
    fi

    # --- git ---
    if [ ! -f /home/dev/.gitconfig ]; then
      cp /etc/workbench/gitconfig /home/dev/.gitconfig
      echo "[+] ~/.gitconfig created"
    fi

    chown -R dev:dev /home/dev 2>/dev/null || true

    echo "[+] workbench init complete"

    # Keep container alive (handle SIGTERM for clean shutdown)
    trap 'exit 0' SIGTERM
    sleep infinity &
    wait

  statusline.sh: |
    #!/bin/bash
    input=$(cat)

    get_model_name() { echo "$input" | jq -r '.model.display_name'; }
    get_current_dir() { echo "$input" | jq -r '.workspace.current_dir'; }
    get_project_dir() { echo "$input" | jq -r '.workspace.project_dir'; }
    get_version() { echo "$input" | jq -r '.version'; }
    get_cost() { echo "$input" | jq -r '.cost.total_cost_usd | . * 1000 | round / 1000'; }
    get_duration() { echo "$input" | jq -r '.cost.total_duration_ms'; }
    get_lines_added() { echo "$input" | jq -r '.cost.total_lines_added'; }
    get_lines_removed() { echo "$input" | jq -r '.cost.total_lines_removed'; }
    get_input_tokens() { echo "$input" | jq -r '.context_window.total_input_tokens'; }
    get_output_tokens() { echo "$input" | jq -r '.context_window.total_output_tokens'; }
    get_context_window_size() { echo "$input" | jq -r '.context_window.context_window_size'; }
    get_used_percent() { echo "$input" | jq -r '.context_window.used_percentage // 0'; }
    get_remaining_percent() { echo "$input" | jq -r '.context_window.remaining_percentage // 100'; }
    get_worktree_path() {
        local current_dir
        current_dir=$(get_current_dir)

        if [ -d "$current_dir/.git" ] && [ -f "$current_dir/.git" ]; then
            local worktree_path
            worktree_path=$(git -C "$current_dir" rev-parse --show-toplevel 2>/dev/null)
            if [ -n "$worktree_path" ]; then
                echo "$worktree_path" | sed "s|^$HOME|~|"
            fi
        elif [ -d "$current_dir/.git/worktrees" ]; then
            echo "$current_dir" | sed "s|^$HOME|~|"
        else
            local git_dir
            git_dir=$(git -C "$current_dir" rev-parse --show-toplevel 2>/dev/null)
            if [ -n "$git_dir" ]; then
                echo "$git_dir" | sed "s|^$HOME|~|"
            fi
        fi
    }

    echo "[$(get_model_name)] +$(get_lines_added) -$(get_lines_removed) ↑$(get_output_tokens) ↓$(get_input_tokens) | $(get_used_percent)..$(get_remaining_percent)% \$$(get_cost) | $(get_worktree_path)"

  tmux.conf: |
    set -g mouse on
    set -g history-limit 100000
    set-option -g word-separators ' @"=()[]{},'

  gitconfig: |
    [push]
      default = current
    [alias]
      tree = log --graph --oneline --decorate --all
      t = tree
        w = worktree
      commit = commit -s
      ci = commit -s
      co = checkout
      pl = pull
      ps = push
      br = branch
        set-upstream = \
          !git branch \
              --set-upstream-to=origin/`git symbolic-ref --short HEAD`

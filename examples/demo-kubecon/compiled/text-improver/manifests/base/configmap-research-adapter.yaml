apiVersion: v1
kind: ConfigMap
metadata:
  name: text-improver-research-adapter
  labels:
    asya.sh/flow: text-improver
    asya.sh/managed-by: asya-compiler
    asya.sh/adapter-for: research
data:
  adapter_research.py: |
    # fmt: off
    # ruff: noqa
    """Auto-generated adapter for research"""
    from actors import research

    async def adapter_research(payload: dict):
        """Adapter: wraps research() for dict-in/dict-out protocol"""
        _result = await research(payload['topic'])
        payload['context'] = _result
        yield payload

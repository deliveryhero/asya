apiVersion: v1
kind: ConfigMap
metadata:
  name: text-improver-generate-adapter
  labels:
    asya.sh/flow: text-improver
    asya.sh/managed-by: asya-compiler
    asya.sh/adapter-for: generate
data:
  adapter_generate.py: |
    # fmt: off
    # ruff: noqa
    """Auto-generated adapter for generate"""
    from actors import generate

    async def adapter_generate(payload: dict):
        """Adapter: wraps generate() for dict-in/dict-out protocol"""
        _result = await generate(payload['topic'], payload['context'])
        payload['draft'] = _result
        yield payload

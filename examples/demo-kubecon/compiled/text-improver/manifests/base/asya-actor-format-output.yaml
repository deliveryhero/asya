apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-format-output
  labels:
    asya.sh/flow: text-improver
    asya.sh/role: end
spec:
  actor: actor-format-output
  image: demo-kubecon
  handler: adapter_format_output.adapter_format_output
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
  env:
  - name: PYTHONUNBUFFERED
    value: '1'
  - name: ASYA_CODE_HASH
    value: 8de4d549bf2d
  volumes:
  - name: adapter
    configMap:
      name: text-improver-format-output-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_format_output.py
    subPath: adapter_format_output.py
    readOnly: true

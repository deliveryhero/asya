apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-format-output
  labels:
    asya.sh/flow: text-improver
    asya.sh/role: end
spec:
  actor: actor-format-output
  image: demo-kubecon
  handler: actors.format_output.format_output
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
  env:
  - name: PYTHONUNBUFFERED
    value: '1'

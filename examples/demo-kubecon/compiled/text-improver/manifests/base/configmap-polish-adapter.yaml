apiVersion: v1
kind: ConfigMap
metadata:
  name: text-improver-polish-adapter
  labels:
    asya.sh/flow: text-improver
    asya.sh/managed-by: asya-compiler
    asya.sh/adapter-for: polish
data:
  adapter_polish.py: |
    # fmt: off
    # ruff: noqa
    """Auto-generated adapter for polish"""
    from actors import polish

    async def adapter_polish(payload: dict):
        """Adapter: wraps polish() for dict-in/dict-out protocol"""
        _result = await polish(payload['draft'])
        payload['final'] = _result
        yield payload

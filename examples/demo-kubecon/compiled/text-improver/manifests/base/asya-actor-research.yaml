apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-research
  labels:
    asya.sh/flow: text-improver
spec:
  actor: actor-research
  image: demo-kubecon
  handler: adapter_research.adapter_research
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
  env:
  - name: PYTHONUNBUFFERED
    value: '1'
  volumes:
  - name: adapter
    configMap:
      name: text-improver-research-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_research.py
    subPath: adapter_research.py
    readOnly: true

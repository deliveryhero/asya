apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-text-improver-while-loop
  labels:
    asya.sh/flow: text-improver
    asya.sh/generated: 'true'
spec:
  actor: router-text-improver-while-loop
  image: python:3.13-slim
  handler: routers.router_text_improver_while_loop
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: PYTHONUNBUFFERED
    value: '1'
  - name: ASYA_HANDLER_ACTOR_EVALUATE
    value: actors.evaluate.evaluate
  - name: ASYA_HANDLER_ACTOR_FORMAT_OUTPUT
    value: actors.format_output.format_output
  - name: ASYA_HANDLER_ACTOR_GENERATE
    value: actors.generate.generate
  - name: ASYA_HANDLER_ACTOR_POLISH
    value: actors.polish.polish
  - name: ASYA_HANDLER_ACTOR_RESEARCH
    value: actors.research.research
  - name: ASYA_HANDLER_ROUTER_TEXT_IMPROVER_IF_ITERATION_GE_MAX_ITERATIONS
    value: routers.router_text_improver_if_iteration_ge_max_iterations
  - name: ASYA_HANDLER_ROUTER_TEXT_IMPROVER_IF_SCORE_GE_THRESHOLD
    value: routers.router_text_improver_if_score_ge_threshold
  - name: ASYA_HANDLER_ROUTER_TEXT_IMPROVER_SEQ_SET_FEEDBACK
    value: routers.router_text_improver_seq_set_feedback
  - name: ASYA_HANDLER_ROUTER_TEXT_IMPROVER_SEQ_SET_ITERATION
    value: routers.router_text_improver_seq_set_iteration
  - name: ASYA_HANDLER_ROUTER_TEXT_IMPROVER_WHILE_LOOP
    value: routers.router_text_improver_while_loop
  volumes:
  - name: routers
    configMap:
      name: text-improver-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

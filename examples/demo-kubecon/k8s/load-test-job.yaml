apiVersion: batch/v1
kind: Job
metadata:
  name: pubsub-load-test
  namespace: asya-demo
  labels:
    app: load-test
    flow: text-improver
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: load-test
        flow: text-improver
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
      - name: publisher
        image: google/cloud-sdk:slim
        env:
        - name: GCP_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: load-test-config
              key: gcp_project_id
        - name: TOPIC_NAME
          valueFrom:
            configMapKeyRef:
              name: load-test-config
              key: topic_name
        - name: MESSAGE_COUNT
          valueFrom:
            configMapKeyRef:
              name: load-test-config
              key: message_count
              optional: true
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          PROJECT_ID="${GCP_PROJECT_ID}"
          TOPIC="${TOPIC_NAME}"
          COUNT="${MESSAGE_COUNT:-50}"

          echo "[+] Starting Pub/Sub load test"
          echo "[.] Project: ${PROJECT_ID}"
          echo "[.] Topic: ${TOPIC}"
          echo "[.] Messages: ${COUNT}"

          # Sample topics for variety
          TOPICS=(
            "Write a haiku about Kubernetes"
            "Explain cloud-native architecture in 100 words"
            "Create a product description for serverless coffee"
            "Write a tech blog intro about event-driven systems"
            "Draft a tweet thread about microservices vs monoliths"
            "Compose an elevator pitch for container orchestration"
            "Write a motivational quote about distributed systems"
            "Create a README summary for an Actor Mesh framework"
            "Draft release notes for a new API gateway feature"
            "Write a conference abstract about asynchronous messaging"
          )

          SENT=0
          FAILED=0

          for i in $(seq 1 "${COUNT}"); do
            # Pick a random topic
            TOPIC_TEXT="${TOPICS[$((RANDOM % ${#TOPICS[@]}))]}"

            # Generate unique envelope ID
            ENVELOPE_ID="load-test-$(date +%s%N)-${i}"

            # Build Asya envelope in valid JSON format
            ENVELOPE=$(cat <<EOF
          {
            "id": "${ENVELOPE_ID}",
            "route": {
              "prev": [],
              "curr": "start-text-improver",
              "next": []
            },
            "headers": {
              "source": "load-test",
              "test_run": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            "payload": {
              "topic": "${TOPIC_TEXT}",
              "threshold": $((70 + RANDOM % 20)),
              "max_iterations": $((2 + RANDOM % 3))
            }
          }
          EOF
          )

            # Publish to Pub/Sub topic
            if echo "${ENVELOPE}" | gcloud pubsub topics publish "${TOPIC}" \
              --project="${PROJECT_ID}" \
              --message=- \
              >/dev/null 2>&1; then
              SENT=$((SENT + 1))
              if [ $((SENT % 10)) -eq 0 ]; then
                echo "[.] Sent ${SENT}/${COUNT} messages"
              fi
            else
              FAILED=$((FAILED + 1))
              echo "[!] Failed to send message ${i}"
            fi

            # Small delay to avoid rate limits (20 msgs/sec)
            sleep 0.05
          done

          echo "[+] Load test complete"
          echo "[.] Sent: ${SENT}/${COUNT}"
          if [ "${FAILED}" -gt 0 ]; then
            echo "[!] Failed: ${FAILED}/${COUNT}"
            exit 1
          fi
          echo "[+] All messages published successfully"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: load-test-config
  namespace: asya-demo
  labels:
    app: load-test
    flow: text-improver
data:
  gcp_project_id: "foodsci-img-gen-dev-1407-1448"
  topic_name: "asya-demo-start-text-improver"
  message_count: "50"

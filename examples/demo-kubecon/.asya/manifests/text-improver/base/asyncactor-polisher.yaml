apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: polisher
  namespace: asya-demo
  labels:
    asya.sh/flow: text-improver
    asya.sh/flow-role: handler
spec:
  compositionSelector:
    matchLabels:
      asya.sh/transport: pubsub
  actor: polisher
  image: europe-west1-docker.pkg.dev/foodsci-img-gen-dev-1407-1448/asya-demo/asya-demo:latest
  handler: demo_actors.polisher.polisher
  transport: pubsub
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- target:
    kind: AsyncActor
    name: generator
  patch: |
    - op: replace
      path: /spec/handler
      value: demo_actors.generator.generator
- target:
    kind: AsyncActor
    name: evaluator
  patch: |
    - op: replace
      path: /spec/handler
      value: demo_actors.evaluator.evaluator
- target:
    kind: AsyncActor
    name: polisher
  patch: |
    - op: replace
      path: /spec/handler
      value: demo_actors.polisher.polisher

apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: llm-resilient
  labels:
    asya.sh/flavor: llm-resilient
data:
  resiliency:
    actorTimeout: 120s
    policies:
      default:
        maxAttempts: 5
        backoff: exponential
        initialDelay: 1s
        maxInterval: 60s
        jitter: true
      no-retry:
        maxAttempts: 1
    rules:
    - errors: ["ContentPolicyViolation", "InvalidAuth"]
      policy: no-retry

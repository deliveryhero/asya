[project]
name = "demo-tilt"
version = "0.1.0"
description = "Multi-team Tilt demo for Asya build tool evaluation"
requires-python = ">=3.13"
dependencies = ["common-utils", "sentiment-actors", "summarizer", "translator"]

[tool.uv.sources]
common-utils = { path = "libs/common" }
sentiment-actors = { path = "team-a/actors/sentiment" }
summarizer = { path = "team-a/actors/summarizer" }
translator = { path = "team-b/actors/translator" }

[dependency-groups]
dev = [
  "asya-lab @ git+https://github.com/deliveryhero/asya.git#subdirectory=src/asya-lab",
]

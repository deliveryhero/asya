apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-pipeline
  namespace: demo-tilt
  labels:
    asya.sh/flow: pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-pipeline
  image: python:3.13-slim
  handler: routers.start_pipeline
  env:
  - name: PYTHONPATH
    value: /app
  - name: ASYA_HANDLER_ANALYZE
    value: sentiment_actors.handler.analyze
  - name: ASYA_HANDLER_SUMMARIZE
    value: summarizer.handler.summarize
  - name: ASYA_HANDLER_TRANSLATE
    value: translator.handler.translate
  volumes:
  - name: handler
    configMap:
      name: pipeline-routers
  volumeMounts:
  - name: handler
    mountPath: /app
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2

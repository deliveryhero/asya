apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-compiler-pipeline
  namespace: default
  labels:
    asya.sh/flow: compiler-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-compiler-pipeline
  image: python:3.13-slim
  handler: routers.start_compiler_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ANALYZE_SEMANTICS
    value: analyze_semantics
  - name: ASYA_HANDLER_ACTOR_EMIT_CODE
    value: emit_code
  - name: ASYA_HANDLER_ACTOR_OPTIMIZE
    value: optimize
  - name: ASYA_HANDLER_ACTOR_PARSE_SYNTAX
    value: parse_syntax
  - name: ASYA_HANDLER_ACTOR_TOKENIZE
    value: tokenize

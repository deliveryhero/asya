apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-compiler-pipeline
  namespace: default
  labels:
    asya.sh/flow: compiler-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-compiler-pipeline
  image: python:3.13-slim
  handler: routers.start_compiler_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env: []

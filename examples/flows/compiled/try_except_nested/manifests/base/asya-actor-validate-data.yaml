apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-validate-data
  namespace: default
  labels:
    asya.sh/flow: nested-error-handling
spec:
  actor: actor-validate-data
  image: examples.asya.sh/validate-data:latest
  handler: validate_data
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_24_0:
        maxAttempts: 1
        thenRoute:
        - router-nested-error-handling-line-33-except-1
      try_except_line_26_0:
        maxAttempts: 1
        thenRoute:
        - router-nested-error-handling-line-29-except-2
    rules:
    - errors:
      - ConnectionError
      policy: try_except_line_24_0
    - errors:
      - ValueError
      policy: try_except_line_26_0

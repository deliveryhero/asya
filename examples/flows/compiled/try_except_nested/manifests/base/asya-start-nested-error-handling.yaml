apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-nested-error-handling
  namespace: default
  labels:
    asya.sh/flow: nested-error-handling
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-nested-error-handling
  image: python:3.13-slim
  handler: routers.start_nested_error_handling
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CLEANUP
    value: cleanup
  - name: ASYA_HANDLER_ACTOR_FETCH_DATA
    value: fetch_data
  - name: ASYA_HANDLER_ACTOR_HANDLE_CONNECTION_ERROR
    value: handle_connection_error
  - name: ASYA_HANDLER_ACTOR_HANDLE_PARSE_ERROR
    value: handle_parse_error
  - name: ASYA_HANDLER_ACTOR_PARSE_DATA
    value: parse_data
  - name: ASYA_HANDLER_ACTOR_STORE_RESULTS
    value: store_results
  - name: ASYA_HANDLER_ACTOR_TRANSFORM_DATA
    value: transform_data
  - name: ASYA_HANDLER_ACTOR_VALIDATE_DATA
    value: validate_data
  volumes:
  - name: routers
    configMap:
      name: nested-error-handling-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

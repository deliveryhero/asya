apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-cleanup
  namespace: default
  labels:
    asya.sh/flow: nested-error-handling
spec:
  actor: actor-cleanup
  image: examples.asya.sh/cleanup:latest
  handler: cleanup
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-data-pipeline
  namespace: default
  labels:
    asya.sh/flow: data-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-data-pipeline
  image: python:3.13-slim
  handler: routers.start_data_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_HANDLE_RUNTIME_ERROR
    value: handle_runtime_error
  - name: ASYA_HANDLER_HANDLE_TYPE_ERROR
    value: handle_type_error
  - name: ASYA_HANDLER_HANDLE_VALIDATION_ERROR
    value: handle_validation_error
  - name: ASYA_HANDLER_PARSE_INPUT
    value: parse_input
  - name: ASYA_HANDLER_ROUTER_DATA_PIPELINE_LINE_10_SEQ_1
    value: routers.router_data_pipeline_line_10_seq_1
  - name: ASYA_HANDLER_ROUTER_DATA_PIPELINE_LINE_13_SEQ_3
    value: routers.router_data_pipeline_line_13_seq_3
  - name: ASYA_HANDLER_ROUTER_DATA_PIPELINE_LINE_16_SEQ_5
    value: routers.router_data_pipeline_line_16_seq_5
  - name: ASYA_HANDLER_TRANSFORM_DATA
    value: transform_data

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-parse-input
  namespace: default
  labels:
    asya.sh/flow: data-pipeline
spec:
  actor: actor-parse-input
  image: examples.asya.sh/parse-input:latest
  handler: parse_input
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    policies:
      except_valueerror:
        maxAttempts: 1
        thenRoute:
        - router-data-pipeline-except-valueerror
      except_typeerror:
        maxAttempts: 1
        thenRoute:
        - router-data-pipeline-except-typeerror
      except_runtimeerror:
        maxAttempts: 1
        thenRoute:
        - router-data-pipeline-except-runtimeerror
    rules:
    - errors:
      - ValueError
      policy: except_valueerror
    - errors:
      - TypeError
      policy: except_typeerror
    - errors:
      - RuntimeError
      policy: except_runtimeerror

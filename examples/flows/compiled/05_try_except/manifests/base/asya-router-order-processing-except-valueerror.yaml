apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-order-processing-except-valueerror
  namespace: default
  labels:
    asya.sh/flow: order-processing
    asya.sh/generated: 'true'
spec:
  actor: router-order-processing-except-valueerror
  image: python:3.13-slim
  handler: routers.router_order_processing_except_valueerror
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_NOTIFY_REJECTION
    value: notify_rejection
  - name: ASYA_HANDLER_ACTOR_VALIDATE_ORDER
    value: validate_order
  volumes:
  - name: routers
    configMap:
      name: order-processing-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-resilient-pipeline
  namespace: default
  labels:
    asya.sh/flow: resilient-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-resilient-pipeline
  image: python:3.13-slim
  handler: routers.start_resilient_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_FETCH_DATA
    value: decorator_retry.fetch_data
  - name: ASYA_HANDLER_ACTOR_STORE_RESULTS
    value: decorator_retry.store_results
  - name: ASYA_HANDLER_ACTOR_TRANSFORM_DATA
    value: decorator_retry.transform_data
  volumes:
  - name: routers
    configMap:
      name: resilient-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

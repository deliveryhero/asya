apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-transform-data
  namespace: default
  labels:
    asya.sh/flow: resilient-pipeline
spec:
  actor: actor-transform-data
  image: examples.asya.sh/transform-data:latest
  handler: transform_data
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    timeout:
      actor: '30'

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-store-results
  namespace: default
  labels:
    asya.sh/flow: resilient-pipeline
    asya.sh/role: end
spec:
  actor: actor-store-results
  image: examples.asya.sh/store-results:latest
  handler: decorator_retry.store_results
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

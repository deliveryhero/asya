apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-odd
  namespace: default
  labels:
    asya.sh/flow: if-inside-while-flow
spec:
  actor: actor-handler-odd
  image: examples.asya.sh/handler-odd:latest
  handler: handler_odd
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

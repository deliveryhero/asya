apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-if-inside-while-flow
  namespace: default
  labels:
    asya.sh/flow: if-inside-while-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-if-inside-while-flow
  image: python:3.13-slim
  handler: routers.start_if_inside_while_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_IF_INSIDE_WHILE_FLOW_LINE_14_WHILE_1
    value: routers.router_if_inside_while_flow_line_14_while_1
  - name: ASYA_HANDLER_ROUTER_IF_INSIDE_WHILE_FLOW_LINE_16_IF_2
    value: routers.router_if_inside_while_flow_line_16_if_2

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-summarizer
  namespace: default
  labels:
    asya.sh/flow: multi-stage-flow
    asya.sh/role: end
spec:
  actor: actor-summarizer
  image: examples.asya.sh/summarizer:latest
  handler: summarizer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

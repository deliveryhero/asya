apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-review-agent
  namespace: default
  labels:
    asya.sh/flow: multi-stage-flow
spec:
  actor: actor-review-agent
  image: examples.asya.sh/review-agent:latest
  handler: review_agent
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

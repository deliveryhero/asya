apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-if-one-empty-branch-flow-if-skip-processing
  namespace: default
  labels:
    asya.sh/flow: if-one-empty-branch-flow
    asya.sh/generated: 'true'
spec:
  actor: router-if-one-empty-branch-flow-if-skip-processing
  image: python:3.13-slim
  handler: routers.router_if_one_empty_branch_flow_if_skip_processing
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_FINALIZE
    value: if_one_empty_branch.handler_finalize
  - name: ASYA_HANDLER_ACTOR_HANDLER_PROCESS
    value: if_one_empty_branch.handler_process
  - name: ASYA_HANDLER_ACTOR_HANDLER_SETUP
    value: if_one_empty_branch.handler_setup
  - name: ASYA_HANDLER_ROUTER_IF_ONE_EMPTY_BRANCH_FLOW_IF_SKIP_PROCESSING
    value: routers.router_if_one_empty_branch_flow_if_skip_processing
  volumes:
  - name: routers
    configMap:
      name: if-one-empty-branch-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

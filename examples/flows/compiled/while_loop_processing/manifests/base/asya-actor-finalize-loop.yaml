apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-finalize-loop
  namespace: default
  labels:
    asya.sh/flow: loop-flow
    asya.sh/role: end
spec:
  actor: actor-finalize-loop
  image: examples.asya.sh/finalize-loop:latest
  handler: finalize_loop
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

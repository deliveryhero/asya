apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-initialize
  namespace: default
  labels:
    asya.sh/flow: loop-flow
spec:
  actor: actor-initialize
  image: examples.asya.sh/initialize:latest
  handler: initialize
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

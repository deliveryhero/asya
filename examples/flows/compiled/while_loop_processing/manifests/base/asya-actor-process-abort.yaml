apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-process-abort
  namespace: default
  labels:
    asya.sh/flow: loop-flow
spec:
  actor: actor-process-abort
  image: examples.asya.sh/process-abort:latest
  handler: process_abort
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

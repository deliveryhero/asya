apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-call-llm
  namespace: default
  labels:
    asya.sh/flow: llm-pipeline
spec:
  actor: actor-call-llm
  image: examples.asya.sh/call-llm:latest
  handler: call_llm
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    policies:
      except_ratelimiterror:
        maxAttempts: 1
        thenRoute:
        - router-llm-pipeline-except-ratelimiterror
      except_authenticationerror:
        maxAttempts: 1
        thenRoute:
        - router-llm-pipeline-except-authenticationerror
    rules:
    - errors:
      - openai.RateLimitError
      policy: except_ratelimiterror
    - errors:
      - openai.AuthenticationError
      policy: except_authenticationerror

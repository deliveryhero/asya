apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-llm-pipeline-except-ratelimiterror
  namespace: default
  labels:
    asya.sh/flow: llm-pipeline
    asya.sh/generated: 'true'
spec:
  actor: router-llm-pipeline-except-ratelimiterror
  image: python:3.13-slim
  handler: routers.router_llm_pipeline_except_ratelimiterror
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CALL_FALLBACK_LLM
    value: call_fallback_llm
  - name: ASYA_HANDLER_ACTOR_CALL_LLM
    value: call_llm
  - name: ASYA_HANDLER_ACTOR_NOTIFY_ADMIN
    value: notify_admin
  volumes:
  - name: routers
    configMap:
      name: llm-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

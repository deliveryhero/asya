apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-call-fallback-llm
  namespace: default
  labels:
    asya.sh/flow: llm-pipeline
    asya.sh/role: end
spec:
  actor: actor-call-fallback-llm
  image: examples.asya.sh/call-fallback-llm:latest
  handler: call_fallback_llm
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

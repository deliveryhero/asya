apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-while-with-continue-flow
  namespace: default
  labels:
    asya.sh/flow: while-with-continue-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-while-with-continue-flow
  image: python:3.13-slim
  handler: routers.start_while_with_continue_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_WHILE_WITH_CONTINUE_FLOW_LINE_14_WHILE_1
    value: routers.router_while_with_continue_flow_line_14_while_1
  - name: ASYA_HANDLER_ROUTER_WHILE_WITH_CONTINUE_FLOW_LINE_16_IF_2
    value: routers.router_while_with_continue_flow_line_16_if_2

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-while-with-continue-flow
  namespace: default
  labels:
    asya.sh/flow: while-with-continue-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-while-with-continue-flow
  image: python:3.13-slim
  handler: routers.start_while_with_continue_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_FINALIZE
    value: while_with_continue.handler_finalize
  - name: ASYA_HANDLER_ACTOR_HANDLER_INIT
    value: while_with_continue.handler_init
  - name: ASYA_HANDLER_ACTOR_HANDLER_PROCESS
    value: while_with_continue.handler_process
  - name: ASYA_HANDLER_ROUTER_WHILE_WITH_CONTINUE_FLOW_IF_SKIP_ITERATION
    value: routers.router_while_with_continue_flow_if_skip_iteration
  - name: ASYA_HANDLER_ROUTER_WHILE_WITH_CONTINUE_FLOW_SEQ_SET_I
    value: routers.router_while_with_continue_flow_seq_set_i
  - name: ASYA_HANDLER_ROUTER_WHILE_WITH_CONTINUE_FLOW_WHILE_I_LT_MAX_ITERATIONS
    value: routers.router_while_with_continue_flow_while_i_lt_max_iterations
  volumes:
  - name: routers
    configMap:
      name: while-with-continue-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-typed-pydantic-pipeline
  namespace: default
  labels:
    asya.sh/flow: typed-pydantic-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-typed-pydantic-pipeline
  image: python:3.13-slim
  handler: routers.start_typed_pydantic_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_RANKER
    value: typed_pydantic_pipeline.ranker
  - name: ASYA_HANDLER_ACTOR_RESPONDER
    value: typed_pydantic_pipeline.responder
  - name: ASYA_HANDLER_ACTOR_SCORER
    value: typed_pydantic_pipeline.scorer
  volumes:
  - name: routers
    configMap:
      name: typed-pydantic-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

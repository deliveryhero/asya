apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-scorer
  namespace: default
  labels:
    asya.sh/flow: typed-pydantic-pipeline
spec:
  actor: actor-scorer
  image: examples.asya.sh/scorer:latest
  handler: scorer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

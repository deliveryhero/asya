apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-ranker
  namespace: default
  labels:
    asya.sh/flow: typed-pydantic-pipeline
spec:
  actor: actor-ranker
  image: examples.asya.sh/ranker:latest
  handler: ranker
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

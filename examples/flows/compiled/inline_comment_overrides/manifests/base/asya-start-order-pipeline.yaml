apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-order-pipeline
  namespace: default
  labels:
    asya.sh/flow: order-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-order-pipeline
  image: python:3.13-slim
  handler: routers.start_order_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CHARGE_PAYMENT
    value: inline_comment_overrides.charge_payment
  - name: ASYA_HANDLER_ROUTER_ORDER_PIPELINE_IF_FRAUD_SCORE_GT_0.8
    value: routers.router_order_pipeline_if_fraud_score_gt_0.8
  - name: ASYA_HANDLER_ROUTER_ORDER_PIPELINE_SEQ_SET_STATUS
    value: routers.router_order_pipeline_seq_set_status
  - name: ASYA_HANDLER_ACTOR_VALIDATE_ORDER
    value: inline_comment_overrides.validate_order
  volumes:
  - name: routers
    configMap:
      name: order-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

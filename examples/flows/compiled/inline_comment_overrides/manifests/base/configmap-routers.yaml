apiVersion: v1
kind: ConfigMap
metadata:
  name: order-pipeline-routers
  namespace: default
  labels:
    asya.sh/flow: order-pipeline
    asya.sh/managed-by: asya-compiler
data:
  routers.py: "# fmt: off\n# ruff: noqa\n\"\"\"\nAuto-generated by asya flow compiler\n\
    Source: inline_comment_overrides.py\n\nDO NOT EDIT THIS FILE MANUALLY\nRegenerate\
    \ by running: asya flow compile inline_comment_overrides.py\n\"\"\"\n\nfrom _asya_utils\
    \ import actor, flow\n\n@actor\ndef normalize_keys(p: dict) -> dict:\n    \"\"\
    \"Normalize payload keys to lowercase \u2014 runs inline in the router.\"\"\"\n\
    \    return {k.lower(): v for k, v in p.items()}\n\n\n# ======================================================================\n\
    # Generated Routers (for kubernetes deployment)\n# ======================================================================\n\
    \nasync def start_order_pipeline(payload: dict):\n    \"\"\"Entrypoint for flow\
    \ 'order_pipeline'\"\"\"\n    p = payload\n    _next = []\n    p = normalize_keys(p)\n\
    \    _next.append(resolve(\"validate_order\"))\n    _next.append(resolve(\"router_order_pipeline_if_fraud_score_gt_0.8\"\
    ))\n    yield \"SET\", \".route.next[:0]\", _next\n    yield payload\n\nasync\
    \ def router_order_pipeline_seq_set_status(payload: dict):\n    \"\"\"Router for\
    \ control flow and payload mutations\"\"\"\n    p = payload\n    p['status'] =\
    \ 'rejected'\n    yield p\n\nasync def router_order_pipeline_if_fraud_score_gt_0.8(payload:\
    \ dict):\n    \"\"\"Router for control flow and payload mutations\"\"\"\n    p\
    \ = payload\n    _next = []\n    if p.get('fraud_score', 0) > 0.8:\n        yield\
    \ \"SET\", \".route.next\", [resolve(\"router_order_pipeline_seq_set_status\"\
    )]\n        yield p\n        return\n    else:\n        _next.append(resolve(\"\
    charge_payment\"))\n\n    yield \"SET\", \".route.next[:0]\", _next\n    yield\
    \ payload\n\n\n# ======================================================================\n\
    # Handler Resolution\n# ======================================================================\n\
    \nimport os\nimport logging\n\n_HANDLER_TO_ACTOR: dict[str, str] = {}\n_SUFFIX_TO_HANDLERS:\
    \ dict[str, list[str]] = {}\n\nfor _env_var, _handler_name in os.environ.items():\n\
    \    if _env_var.startswith('ASYA_HANDLER_'):\n        _actor_name = _env_var[len('ASYA_HANDLER_'):].lower().replace('_',\
    \ '-')\n        _HANDLER_TO_ACTOR[_handler_name] = _actor_name\n\n        # Index\
    \ all suffixes (e.g., \"a.b.c\" -> [\"c\", \"b.c\", \"a.b.c\"])\n        _parts\
    \ = _handler_name.split('.')\n        for _i in range(len(_parts)):\n        \
    \    _suffix = '.'.join(_parts[_i:])\n            if _suffix not in _SUFFIX_TO_HANDLERS:\n\
    \                _SUFFIX_TO_HANDLERS[_suffix] = []\n            _SUFFIX_TO_HANDLERS[_suffix].append(_handler_name)\n\
    \nlogging.info(f\"Loaded {len(_HANDLER_TO_ACTOR)} handler-to-actor mappings\"\
    )\n\n\ndef resolve(handler_full_name: str) -> str:\n    \"\"\"\n    Resolve handler\
    \ name to actor name using suffix-based matching.\n\n    Looks up handler in environment\
    \ variables:\n    - ASYA_HANDLER_<ACTOR_NAME>=\"full.module.path.ClassName.method\"\
    \n\n    Supports flexible suffix matching - any suffix of the full path can be\
    \ used if unambiguous:\n    - \"method\" (shortest)\n    - \"ClassName.method\"\
    \ (class + method)\n    - \"module.ClassName.method\" (partial path)\n    - \"\
    full.module.path.ClassName.method\" (full path)\n\n    Args:\n        handler_full_name:\
    \ Any suffix of the full handler path\n\n    Returns:\n        Actor name for\
    \ routing (kebab-case, lowercase)\n\n    Raises:\n        ValueError: If handler\
    \ suffix not found or is ambiguous\n\n    Examples:\n        # Environment: ASYA_HANDLER_MY_ACTOR=\"\
    class_instantiation.DataPreprocessor.clean\"\n\n        # All of these work (if\
    \ unambiguous):\n        resolve(\"clean\")  # shortest suffix\n        resolve(\"\
    DataPreprocessor.clean\")  # class + method\n        resolve(\"class_instantiation.DataPreprocessor.clean\"\
    )  # full path\n\n        # Ambiguous suffix\n        # Env: ASYA_HANDLER_A=\"\
    module1.clean\", ASYA_HANDLER_B=\"module2.clean\"\n        resolve(\"clean\")\
    \  # raises ValueError: ambiguous, use longer suffix\n    \"\"\"\n    if handler_full_name\
    \ in _SUFFIX_TO_HANDLERS:\n        candidates = _SUFFIX_TO_HANDLERS[handler_full_name]\n\
    \        if len(candidates) == 1:\n            return _HANDLER_TO_ACTOR[candidates[0]]\n\
    \        else:\n            raise ValueError(\n                f\"Handler suffix\
    \ '{handler_full_name}' is ambiguous. \"\n                f\"Found multiple matches:\
    \ {candidates}. \"\n                f\"Use a longer suffix to disambiguate.\"\n\
    \            )\n\n    raise ValueError(\n        f\"Handler '{handler_full_name}'\
    \ not found in environment variables. \"\n        f'No handler ends with suffix\
    \ \"{handler_full_name}\". '\n        f\"Available handlers: {list(_HANDLER_TO_ACTOR.keys())}\"\
    \n    )\n"

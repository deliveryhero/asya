apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-charge-payment
  namespace: default
  labels:
    asya.sh/flow: order-pipeline
    asya.sh/role: end
spec:
  actor: actor-charge-payment
  image: examples.asya.sh/charge-payment:latest
  handler: charge_payment
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

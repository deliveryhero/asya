apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-while-nested-flow-seq-set-i
  namespace: default
  labels:
    asya.sh/flow: while-nested-flow
    asya.sh/generated: 'true'
spec:
  actor: router-while-nested-flow-seq-set-i
  image: python:3.13-slim
  handler: routers.router_while_nested_flow_seq_set_i
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_FINALIZE
    value: while_nested.handler_finalize
  - name: ASYA_HANDLER_ACTOR_HANDLER_INIT
    value: while_nested.handler_init
  - name: ASYA_HANDLER_ACTOR_HANDLER_INNER
    value: while_nested.handler_inner
  - name: ASYA_HANDLER_ACTOR_HANDLER_OUTER
    value: while_nested.handler_outer
  - name: ASYA_HANDLER_ACTOR_HANDLER_OUTER_END
    value: while_nested.handler_outer_end
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_SEQ_SET_I
    value: routers.router_while_nested_flow_seq_set_i
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_SEQ_SET_I_2
    value: routers.router_while_nested_flow_seq_set_i_2
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_SEQ_SET_J
    value: routers.router_while_nested_flow_seq_set_j
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_SEQ_SET_J_2
    value: routers.router_while_nested_flow_seq_set_j_2
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_WHILE_I_LT_MAX_I
    value: routers.router_while_nested_flow_while_i_lt_max_i
  - name: ASYA_HANDLER_ROUTER_WHILE_NESTED_FLOW_WHILE_J_LT_MAX_J
    value: routers.router_while_nested_flow_while_j_lt_max_j
  volumes:
  - name: routers
    configMap:
      name: while-nested-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

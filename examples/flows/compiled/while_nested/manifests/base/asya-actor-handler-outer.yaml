apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-outer
  namespace: default
  labels:
    asya.sh/flow: while-nested-flow
spec:
  actor: actor-handler-outer
  image: examples.asya.sh/handler-outer:latest
  handler: handler_outer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

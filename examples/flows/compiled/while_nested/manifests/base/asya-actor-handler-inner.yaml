apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-inner
  namespace: default
  labels:
    asya.sh/flow: while-nested-flow
spec:
  actor: actor-handler-inner
  image: examples.asya.sh/handler-inner:latest
  handler: while_nested.handler_inner
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: record-transaction
  namespace: default
  labels:
    asya.sh/flow: payment-flow
spec:
  actor: record-transaction
  image: examples.asya.sh/record-transaction:latest
  handler: record_transaction
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_15_0:
        maxAttempts: 1
        thenRoute:
        - router-payment-flow-line-21-except-2
    rules:
    - errors:
      - ValueError
      policy: try_except_line_15_0

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-c
  namespace: default
  labels:
    asya.sh/flow: sequential-flow
    asya.sh/role: end
spec:
  actor: actor-handler-c
  image: examples.asya.sh/handler-c:latest
  handler: 01_sequential.handler_c
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

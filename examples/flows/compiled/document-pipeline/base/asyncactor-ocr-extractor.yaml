apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: ocr-extractor
  namespace: default
  labels:
    asya.sh/flow: document-pipeline
spec:
  actor: ocr-extractor
  image: examples.asya.sh/ocr-extractor:latest
  handler: ocr_extractor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

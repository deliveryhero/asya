apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-validator
  namespace: default
  labels:
    asya.sh/flow: decorator-callsite-flow
spec:
  actor: actor-validator
  image: examples.asya.sh/validator:latest
  handler: decorator_callsite.validator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-enricher
  namespace: default
  labels:
    asya.sh/flow: decorator-callsite-flow
    asya.sh/role: end
spec:
  actor: actor-enricher
  image: examples.asya.sh/enricher:latest
  handler: decorator_callsite.enricher
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

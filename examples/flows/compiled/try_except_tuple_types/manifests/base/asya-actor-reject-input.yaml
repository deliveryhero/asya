apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-reject-input
  namespace: default
  labels:
    asya.sh/flow: ingestion-pipeline
    asya.sh/role: end
spec:
  actor: actor-reject-input
  image: examples.asya.sh/reject-input:latest
  handler: reject_input
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

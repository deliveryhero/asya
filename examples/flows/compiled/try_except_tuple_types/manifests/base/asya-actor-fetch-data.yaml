apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-fetch-data
  namespace: default
  labels:
    asya.sh/flow: try-except-tuple-types
spec:
  actor: actor-fetch-data
  image: examples.asya.sh/fetch-data:latest
  handler: fetch_data
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    policies:
      except_connectionerror_timeouterror:
        maxAttempts: 1
        thenRoute:
        - router-try-except-tuple-types-except-connectionerror-timeouterror
      except_valueerror_keyerror:
        maxAttempts: 1
        thenRoute:
        - router-try-except-tuple-types-except-valueerror-keyerror
    rules:
    - errors:
      - ConnectionError
      - TimeoutError
      policy: except_connectionerror_timeouterror
    - errors:
      - ValueError
      - KeyError
      policy: except_valueerror_keyerror

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-queue-for-retry
  namespace: default
  labels:
    asya.sh/flow: ingestion-pipeline
    asya.sh/role: end
spec:
  actor: actor-queue-for-retry
  image: examples.asya.sh/queue-for-retry:latest
  handler: queue_for_retry
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-ingestion-pipeline
  namespace: default
  labels:
    asya.sh/flow: ingestion-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-ingestion-pipeline
  image: python:3.13-slim
  handler: routers.start_ingestion_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_FETCH_DATA
    value: fetch_data
  - name: ASYA_HANDLER_ACTOR_PARSE_DATA
    value: parse_data
  - name: ASYA_HANDLER_ACTOR_QUEUE_FOR_RETRY
    value: queue_for_retry
  - name: ASYA_HANDLER_ACTOR_REJECT_INPUT
    value: reject_input

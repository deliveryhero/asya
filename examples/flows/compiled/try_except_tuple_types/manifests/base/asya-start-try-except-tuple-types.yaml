apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-try-except-tuple-types
  namespace: default
  labels:
    asya.sh/flow: try-except-tuple-types
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-try-except-tuple-types
  image: python:3.13-slim
  handler: routers.start_try_except_tuple_types
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_FETCH_DATA
    value: fetch_data
  - name: ASYA_HANDLER_ACTOR_PARSE_DATA
    value: parse_data
  - name: ASYA_HANDLER_ACTOR_QUEUE_FOR_RETRY
    value: queue_for_retry
  - name: ASYA_HANDLER_ACTOR_REJECT_INPUT
    value: reject_input
  volumes:
  - name: routers
    configMap:
      name: try-except-tuple-types-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

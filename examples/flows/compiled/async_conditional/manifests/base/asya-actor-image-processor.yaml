apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-image-processor
  namespace: default
  labels:
    asya.sh/flow: content-pipeline-flow
spec:
  actor: actor-image-processor
  image: examples.asya.sh/image-processor:latest
  handler: image_processor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

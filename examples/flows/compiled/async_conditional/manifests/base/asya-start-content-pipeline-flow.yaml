apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-content-pipeline-flow
  namespace: default
  labels:
    asya.sh/flow: content-pipeline-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-content-pipeline-flow
  image: python:3.13-slim
  handler: routers.start_content_pipeline_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_CONTENT_PIPELINE_FLOW_IF_CONTENT_TYPE_EQ_IMAGE
    value: routers.router_content_pipeline_flow_if_content_type_eq_image
  - name: ASYA_HANDLER_ROUTER_CONTENT_PIPELINE_FLOW_IF_CONTENT_TYPE_EQ_TEXT
    value: routers.router_content_pipeline_flow_if_content_type_eq_text
  volumes:
  - name: routers
    configMap:
      name: content-pipeline-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-quality-check
  namespace: default
  labels:
    asya.sh/flow: content-pipeline-flow
    asya.sh/role: end
spec:
  actor: actor-quality-check
  image: examples.asya.sh/quality-check:latest
  handler: quality_check
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-llm-pipeline-seq-set-status
  namespace: default
  labels:
    asya.sh/flow: llm-pipeline
    asya.sh/generated: 'true'
spec:
  actor: router-llm-pipeline-seq-set-status
  image: python:3.13-slim
  handler: routers.router_llm_pipeline_seq_set_status
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CALL_LLM
    value: call_llm
  - name: ASYA_HANDLER_ACTOR_PARSE_RESPONSE
    value: parse_response
  - name: ASYA_HANDLER_ACTOR_STORE_RESULT
    value: store_result
  - name: ASYA_HANDLER_ACTOR_VALIDATE_INPUT
    value: validate_input

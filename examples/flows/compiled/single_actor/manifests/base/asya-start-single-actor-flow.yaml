apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-single-actor-flow
  namespace: default
  labels:
    asya.sh/flow: single-actor-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-single-actor-flow
  image: python:3.13-slim
  handler: routers.start_single_actor_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: research-agent
  namespace: default
  labels:
    asya.sh/flow: async-research-flow
spec:
  actor: research-agent
  image: examples.asya.sh/research-agent:latest
  handler: research_agent
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

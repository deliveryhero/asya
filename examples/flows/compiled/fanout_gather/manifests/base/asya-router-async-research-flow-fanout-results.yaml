apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-async-research-flow-fanout-results
  namespace: default
  labels:
    asya.sh/flow: async-research-flow
    asya.sh/generated: 'true'
spec:
  actor: router-async-research-flow-fanout-results
  image: python:3.13-slim
  handler: routers.router_async_research_flow_fanout_results
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_FANIN_ASYNC_RESEARCH_FLOW_RESULTS
    value: routers.fanin_async_research_flow_results
  - name: ASYA_HANDLER_ACTOR_RESEARCH_AGENT
    value: fanout_gather.research_agent
  - name: ASYA_HANDLER_ROUTER_ASYNC_RESEARCH_FLOW_FANOUT_RESULTS
    value: routers.router_async_research_flow_fanout_results
  volumes:
  - name: routers
    configMap:
      name: async-research-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

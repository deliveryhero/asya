apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-async-research-flow
  namespace: default
  labels:
    asya.sh/flow: async-research-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-async-research-flow
  image: python:3.13-slim
  handler: routers.start_async_research_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_FANIN_ASYNC_RESEARCH_FLOW_LINE_16
    value: routers.fanin_async_research_flow_line_16
  - name: ASYA_HANDLER_ACTOR_RESEARCH_AGENT
    value: research_agent
  - name: ASYA_HANDLER_ROUTER_ASYNC_RESEARCH_FLOW_LINE_16_FANOUT_1
    value: routers.router_async_research_flow_line_16_fanout_1

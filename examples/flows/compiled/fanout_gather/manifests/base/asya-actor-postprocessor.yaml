apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-postprocessor
  namespace: default
  labels:
    asya.sh/flow: async-research-flow
    asya.sh/role: end
spec:
  actor: actor-postprocessor
  image: examples.asya.sh/postprocessor:latest
  handler: postprocessor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

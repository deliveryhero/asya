apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-default
  namespace: default
  labels:
    asya.sh/flow: complex-combined-flow
spec:
  actor: actor-handler-default
  image: examples.asya.sh/handler-default:latest
  handler: complex_combined.handler_default
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

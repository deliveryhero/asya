apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-error
  namespace: default
  labels:
    asya.sh/flow: complex-combined-flow
    asya.sh/role: end
spec:
  actor: actor-handler-error
  image: examples.asya.sh/handler-error:latest
  handler: complex_combined.handler_error
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

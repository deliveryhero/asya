apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-error
  namespace: default
  labels:
    asya.sh/flow: early-return-flow
    asya.sh/role: end
spec:
  actor: actor-handler-error
  image: examples.asya.sh/handler-error:latest
  handler: if_with_early_return.handler_error
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

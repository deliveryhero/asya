apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-resiliency-retry-patterns
  namespace: default
  labels:
    asya.sh/flow: resiliency-retry-patterns
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-resiliency-retry-patterns
  image: python:3.13-slim
  handler: routers.start_resiliency_retry_patterns
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CALL_LLM
    value: 11_resiliency.call_llm
  - name: ASYA_HANDLER_ACTOR_PARSE_RESPONSE
    value: 11_resiliency.parse_response
  - name: ASYA_HANDLER_ACTOR_STORE_RESULT
    value: 11_resiliency.store_result
  - name: ASYA_HANDLER_ACTOR_VALIDATE_INPUT
    value: 11_resiliency.validate_input
  volumes:
  - name: routers
    configMap:
      name: resiliency-retry-patterns-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

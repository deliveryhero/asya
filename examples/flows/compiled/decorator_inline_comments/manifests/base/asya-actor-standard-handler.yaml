apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-standard-handler
  namespace: default
  labels:
    asya.sh/flow: decorator-inline-comments-flow
    asya.sh/role: end
spec:
  actor: actor-standard-handler
  image: examples.asya.sh/standard-handler:latest
  handler: standard_handler
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

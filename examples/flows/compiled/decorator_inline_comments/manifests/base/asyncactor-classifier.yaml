apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: classifier
  namespace: default
  labels:
    asya.sh/flow: decorator-inline-comments-flow
spec:
  actor: classifier
  image: examples.asya.sh/classifier:latest
  handler: classifier
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

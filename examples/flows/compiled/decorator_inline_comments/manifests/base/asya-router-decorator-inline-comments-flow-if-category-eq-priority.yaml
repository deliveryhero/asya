apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-decorator-inline-comments-flow-if-category-eq-priority
  namespace: default
  labels:
    asya.sh/flow: decorator-inline-comments-flow
    asya.sh/generated: 'true'
spec:
  actor: router-decorator-inline-comments-flow-if-category-eq-priority
  image: python:3.13-slim
  handler: routers.router_decorator_inline_comments_flow_if_category_eq_priority
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CLASSIFIER
    value: decorator_inline_comments.classifier
  - name: ASYA_HANDLER_ACTOR_FAST_HANDLER
    value: decorator_inline_comments.fast_handler
  - name: ASYA_HANDLER_ROUTER_DECORATOR_INLINE_COMMENTS_FLOW_IF_CATEGORY_EQ_PRIORITY
    value: routers.router_decorator_inline_comments_flow_if_category_eq_priority
  - name: ASYA_HANDLER_ACTOR_STANDARD_HANDLER
    value: decorator_inline_comments.standard_handler
  volumes:
  - name: routers
    configMap:
      name: decorator-inline-comments-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

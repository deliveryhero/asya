apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: handler-a
  namespace: default
  labels:
    asya.sh/flow: conditional-nested-flow
spec:
  actor: handler-a
  image: examples.asya.sh/handler-a:latest
  handler: handler_a
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

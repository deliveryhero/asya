apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: handler-c
  namespace: default
  labels:
    asya.sh/flow: conditional-nested-flow
    asya.sh/role: end
spec:
  actor: handler-c
  image: examples.asya.sh/handler-c:latest
  handler: handler_c
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

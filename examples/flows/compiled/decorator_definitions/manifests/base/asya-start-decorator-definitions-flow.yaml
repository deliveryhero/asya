apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-decorator-definitions-flow
  namespace: default
  labels:
    asya.sh/flow: decorator-definitions-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-decorator-definitions-flow
  image: python:3.13-slim
  handler: routers.start_decorator_definitions_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ENRICH
    value: decorator_definitions.enrich
  - name: ASYA_HANDLER_ACTOR_VALIDATE
    value: decorator_definitions.validate
  volumes:
  - name: routers
    configMap:
      name: decorator-definitions-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

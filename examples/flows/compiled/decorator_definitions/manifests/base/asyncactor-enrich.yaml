apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: enrich
  namespace: default
  labels:
    asya.sh/flow: decorator-definitions-flow
    asya.sh/role: end
spec:
  actor: enrich
  image: examples.asya.sh/enrich:latest
  handler: enrich
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

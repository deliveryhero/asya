apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-if-no-else-flow
  namespace: default
  labels:
    asya.sh/flow: if-no-else-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-if-no-else-flow
  image: python:3.13-slim
  handler: routers.start_if_no_else_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_SETUP
    value: handler_setup
  - name: ASYA_HANDLER_ACTOR_HANDLER_TRUE
    value: handler_true
  - name: ASYA_HANDLER_ROUTER_IF_NO_ELSE_FLOW_LINE_13_IF_1
    value: routers.router_if_no_else_flow_line_13_if_1

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-if-no-else-flow-if-condition
  namespace: default
  labels:
    asya.sh/flow: if-no-else-flow
    asya.sh/generated: 'true'
spec:
  actor: router-if-no-else-flow-if-condition
  image: python:3.13-slim
  handler: routers.router_if_no_else_flow_if_condition
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_SETUP
    value: handler_setup
  - name: ASYA_HANDLER_ACTOR_HANDLER_TRUE
    value: handler_true
  - name: ASYA_HANDLER_ROUTER_IF_NO_ELSE_FLOW_IF_CONDITION
    value: routers.router_if_no_else_flow_if_condition

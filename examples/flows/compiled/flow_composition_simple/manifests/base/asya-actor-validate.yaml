apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-validate
  namespace: default
  labels:
    asya.sh/flow: outer-pipeline
spec:
  actor: actor-validate
  image: examples.asya.sh/validate:latest
  handler: validate
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

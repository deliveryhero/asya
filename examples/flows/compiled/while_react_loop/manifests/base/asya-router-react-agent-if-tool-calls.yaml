apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-react-agent-if-tool-calls
  namespace: default
  labels:
    asya.sh/flow: react-agent
    asya.sh/generated: 'true'
spec:
  actor: router-react-agent-if-tool-calls
  image: python:3.13-slim
  handler: routers.router_react_agent_if_tool_calls
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_EXECUTE_TOOL
    value: while_react_loop.execute_tool
  - name: ASYA_HANDLER_ACTOR_LLM_CALL
    value: while_react_loop.llm_call
  - name: ASYA_HANDLER_ROUTER_REACT_AGENT_IF_TOOL_CALLS
    value: routers.router_react_agent_if_tool_calls
  - name: ASYA_HANDLER_ROUTER_REACT_AGENT_WHILE_LOOP
    value: routers.router_react_agent_while_loop
  volumes:
  - name: routers
    configMap:
      name: react-agent-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

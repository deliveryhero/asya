apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-execute-tool
  namespace: default
  labels:
    asya.sh/flow: react-agent
spec:
  actor: actor-execute-tool
  image: examples.asya.sh/execute-tool:latest
  handler: while_react_loop.execute_tool
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

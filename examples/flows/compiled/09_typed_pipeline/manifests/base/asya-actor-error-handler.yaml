apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-error-handler
  namespace: default
  labels:
    asya.sh/flow: typeddict-pipeline
    asya.sh/role: end
spec:
  actor: actor-error-handler
  image: examples.asya.sh/error-handler:latest
  handler: 09_typed_pipeline.error_handler
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

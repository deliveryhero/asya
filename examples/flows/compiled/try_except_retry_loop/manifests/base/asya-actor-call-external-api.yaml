apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-call-external-api
  namespace: default
  labels:
    asya.sh/flow: retry-pipeline
spec:
  actor: actor-call-external-api
  image: examples.asya.sh/call-external-api:latest
  handler: call_external_api
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    policies:
      except_connectionerror:
        maxAttempts: 1
        thenRoute:
        - router-retry-pipeline-except-connectionerror
      except_valueerror:
        maxAttempts: 1
        thenRoute:
        - router-retry-pipeline-except-valueerror
    rules:
    - errors:
      - ConnectionError
      policy: except_connectionerror
    - errors:
      - ValueError
      policy: except_valueerror

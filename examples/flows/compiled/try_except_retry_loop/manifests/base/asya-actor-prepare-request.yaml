apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-prepare-request
  namespace: default
  labels:
    asya.sh/flow: retry-pipeline
spec:
  actor: actor-prepare-request
  image: examples.asya.sh/prepare-request:latest
  handler: prepare_request
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

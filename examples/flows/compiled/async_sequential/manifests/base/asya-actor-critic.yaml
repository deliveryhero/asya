apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-critic
  namespace: default
  labels:
    asya.sh/flow: llm-auditor-flow
spec:
  actor: actor-critic
  image: examples.asya.sh/critic:latest
  handler: critic
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

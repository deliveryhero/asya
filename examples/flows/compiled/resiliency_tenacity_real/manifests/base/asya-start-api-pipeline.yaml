apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-api-pipeline
  namespace: default
  labels:
    asya.sh/flow: api-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-api-pipeline
  image: python:3.13-slim
  handler: routers.start_api_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_FETCH_FROM_API
    value: fetch_from_api
  - name: ASYA_HANDLER_ACTOR_PROCESS_RESPONSE
    value: process_response
  - name: ASYA_HANDLER_ACTOR_STORE_RESULTS
    value: store_results

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-resilient-pipeline
  namespace: default
  labels:
    asya.sh/flow: resilient-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-resilient-pipeline
  image: python:3.13-slim
  handler: routers.start_resilient_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLE_KNOWN_ERROR
    value: handle_known_error
  - name: ASYA_HANDLER_ACTOR_HANDLE_UNKNOWN_ERROR
    value: handle_unknown_error
  - name: ASYA_HANDLER_ACTOR_RISKY_OPERATION
    value: risky_operation

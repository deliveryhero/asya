apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-try-except-catch-all
  namespace: default
  labels:
    asya.sh/flow: try-except-catch-all
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-try-except-catch-all
  image: python:3.13-slim
  handler: routers.start_try_except_catch_all
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLE_KNOWN_ERROR
    value: try_except_catch_all.handle_known_error
  - name: ASYA_HANDLER_ACTOR_HANDLE_UNKNOWN_ERROR
    value: try_except_catch_all.handle_unknown_error
  - name: ASYA_HANDLER_ACTOR_RISKY_OPERATION
    value: try_except_catch_all.risky_operation
  volumes:
  - name: routers
    configMap:
      name: try-except-catch-all-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

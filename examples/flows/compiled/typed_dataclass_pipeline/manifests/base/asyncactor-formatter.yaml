apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: formatter
  namespace: default
  labels:
    asya.sh/flow: typed-dataclass-pipeline
    asya.sh/role: end
spec:
  actor: formatter
  image: examples.asya.sh/formatter:latest
  handler: formatter
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-typed-dataclass-pipeline
  namespace: default
  labels:
    asya.sh/flow: typed-dataclass-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-typed-dataclass-pipeline
  image: python:3.13-slim
  handler: routers.start_typed_dataclass_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CLASSIFIER
    value: typed_dataclass_pipeline.classifier
  - name: ASYA_HANDLER_ACTOR_ENRICHER
    value: typed_dataclass_pipeline.enricher
  - name: ASYA_HANDLER_ACTOR_EXTRACTOR
    value: typed_dataclass_pipeline.extractor
  - name: ASYA_HANDLER_ACTOR_FORMATTER
    value: typed_dataclass_pipeline.formatter
  volumes:
  - name: routers
    configMap:
      name: typed-dataclass-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

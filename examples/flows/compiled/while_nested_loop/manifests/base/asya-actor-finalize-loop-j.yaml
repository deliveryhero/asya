apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-finalize-loop-j
  namespace: default
  labels:
    asya.sh/flow: nested-loop-flow
    asya.sh/role: end
spec:
  actor: actor-finalize-loop-j
  image: examples.asya.sh/finalize-loop-j:latest
  handler: while_nested_loop.finalize_loop_j
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

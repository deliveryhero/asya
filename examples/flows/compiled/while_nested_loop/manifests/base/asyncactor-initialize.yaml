apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: initialize
  namespace: default
  labels:
    asya.sh/flow: nested-loop-flow
spec:
  actor: initialize
  image: examples.asya.sh/initialize:latest
  handler: initialize
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

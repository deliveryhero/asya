apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-while-true-flow
  namespace: default
  labels:
    asya.sh/flow: while-true-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-while-true-flow
  image: python:3.13-slim
  handler: routers.start_while_true_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_HANDLER_FINALIZE
    value: while_true_simple.handler_finalize
  - name: ASYA_HANDLER_ACTOR_HANDLER_INIT
    value: while_true_simple.handler_init
  - name: ASYA_HANDLER_ACTOR_HANDLER_PROCESS
    value: while_true_simple.handler_process
  - name: ASYA_HANDLER_ROUTER_WHILE_TRUE_FLOW_IF_DONE
    value: routers.router_while_true_flow_if_done
  - name: ASYA_HANDLER_ROUTER_WHILE_TRUE_FLOW_WHILE_LOOP
    value: routers.router_while_true_flow_while_loop
  volumes:
  - name: routers
    configMap:
      name: while-true-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-typeddict-pipeline-if-not-valid
  namespace: default
  labels:
    asya.sh/flow: typeddict-pipeline
    asya.sh/generated: 'true'
spec:
  actor: router-typeddict-pipeline-if-not-valid
  image: python:3.13-slim
  handler: routers.router_typeddict_pipeline_if_not_valid
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ERROR_HANDLER
    value: error_handler
  - name: ASYA_HANDLER_ACTOR_PARSER
    value: parser
  - name: ASYA_HANDLER_ROUTER_TYPEDDICT_PIPELINE_IF_NOT_VALID
    value: routers.router_typeddict_pipeline_if_not_valid
  - name: ASYA_HANDLER_ACTOR_SINK_ADAPTER
    value: sink_adapter
  - name: ASYA_HANDLER_ACTOR_TRANSFORMER
    value: transformer
  - name: ASYA_HANDLER_ACTOR_VALIDATOR
    value: validator

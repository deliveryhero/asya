apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-parser
  namespace: default
  labels:
    asya.sh/flow: typeddict-pipeline
spec:
  actor: actor-parser
  image: examples.asya.sh/parser:latest
  handler: parser
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

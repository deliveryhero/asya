apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-typeddict-pipeline
  namespace: default
  labels:
    asya.sh/flow: typeddict-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-typeddict-pipeline
  image: python:3.13-slim
  handler: routers.start_typeddict_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ERROR_HANDLER
    value: error_handler
  - name: ASYA_HANDLER_PARSER
    value: parser
  - name: ASYA_HANDLER_ROUTER_TYPEDDICT_PIPELINE_LINE_76_IF_1
    value: routers.router_typeddict_pipeline_line_76_if_1
  - name: ASYA_HANDLER_SINK_ADAPTER
    value: sink_adapter
  - name: ASYA_HANDLER_TRANSFORMER
    value: transformer
  - name: ASYA_HANDLER_VALIDATOR
    value: validator

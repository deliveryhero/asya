apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-tokenize
  namespace: default
  labels:
    asya.sh/flow: text-analysis-flow
spec:
  actor: actor-tokenize
  image: examples.asya.sh/tokenize:latest
  handler: text_analysis_flow.tokenize
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

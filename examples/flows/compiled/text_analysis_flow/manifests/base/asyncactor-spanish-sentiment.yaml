apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: spanish-sentiment
  namespace: default
  labels:
    asya.sh/flow: text-analysis-flow
spec:
  actor: spanish-sentiment
  image: examples.asya.sh/spanish-sentiment:latest
  handler: spanish_sentiment
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

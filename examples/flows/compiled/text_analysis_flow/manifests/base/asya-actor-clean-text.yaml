apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-clean-text
  namespace: default
  labels:
    asya.sh/flow: text-analysis-flow
spec:
  actor: actor-clean-text
  image: examples.asya.sh/clean-text:latest
  handler: clean_text
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-extract-entities
  namespace: default
  labels:
    asya.sh/flow: text-analysis-flow
spec:
  actor: actor-extract-entities
  image: examples.asya.sh/extract-entities:latest
  handler: extract_entities
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

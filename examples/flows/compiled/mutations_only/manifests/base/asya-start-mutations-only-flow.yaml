apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-mutations-only-flow
  namespace: default
  labels:
    asya.sh/flow: mutations-only-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-mutations-only-flow
  image: python:3.13-slim
  handler: routers.start_mutations_only_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_MUTATIONS_ONLY_FLOW_SEQ_SET_STEP
    value: routers.router_mutations_only_flow_seq_set_step

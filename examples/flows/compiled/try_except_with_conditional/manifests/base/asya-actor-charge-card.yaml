apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-charge-card
  namespace: default
  labels:
    asya.sh/flow: payment-flow
spec:
  actor: actor-charge-card
  image: examples.asya.sh/charge-card:latest
  handler: charge_card
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_16_0:
        maxAttempts: 1
        thenRoute:
        - router-payment-flow-line-22-except-1
    rules:
    - errors:
      - ValueError
      policy: try_except_line_16_0

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-validate-payment
  namespace: default
  labels:
    asya.sh/flow: payment-flow
spec:
  actor: actor-validate-payment
  image: examples.asya.sh/validate-payment:latest
  handler: validate_payment
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

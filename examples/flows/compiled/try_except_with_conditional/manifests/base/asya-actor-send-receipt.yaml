apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-send-receipt
  namespace: default
  labels:
    asya.sh/flow: payment-flow
    asya.sh/role: end
spec:
  actor: actor-send-receipt
  image: examples.asya.sh/send-receipt:latest
  handler: send_receipt
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

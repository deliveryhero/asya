apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-ocr-extractor
  namespace: default
  labels:
    asya.sh/flow: document-pipeline
spec:
  actor: actor-ocr-extractor
  image: examples.asya.sh/ocr-extractor:latest
  handler: ocr_extractor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    timeout:
      actor: 30

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-language-detector
  namespace: default
  labels:
    asya.sh/flow: document-pipeline
spec:
  actor: actor-language-detector
  image: examples.asya.sh/language-detector:latest
  handler: language_detector
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    timeout:
      actor: 30

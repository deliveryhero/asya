apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-document-pipeline-if-language-ne-en
  namespace: default
  labels:
    asya.sh/flow: document-pipeline
    asya.sh/generated: 'true'
spec:
  actor: router-document-pipeline-if-language-ne-en
  image: python:3.13-slim
  handler: routers.router_document_pipeline_if_language_ne_en
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_LANGUAGE_DETECTOR
    value: language_detector
  - name: ASYA_HANDLER_ACTOR_OCR_EXTRACTOR
    value: ocr_extractor
  - name: ASYA_HANDLER_ROUTER_DOCUMENT_PIPELINE_IF_LANGUAGE_NE_EN
    value: routers.router_document_pipeline_if_language_ne_en
  - name: ASYA_HANDLER_ROUTER_DOCUMENT_PIPELINE_SEQ_SET_STATUS
    value: routers.router_document_pipeline_seq_set_status
  - name: ASYA_HANDLER_ACTOR_SENTIMENT_ANALYZER
    value: sentiment_analyzer
  - name: ASYA_HANDLER_ACTOR_TRANSLATOR
    value: translator

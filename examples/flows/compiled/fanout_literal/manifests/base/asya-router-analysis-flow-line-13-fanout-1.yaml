apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-analysis-flow-line-13-fanout-1
  namespace: default
  labels:
    asya.sh/flow: analysis-flow
    asya.sh/generated: 'true'
spec:
  actor: router-analysis-flow-line-13-fanout-1
  image: python:3.13-slim
  handler: routers.router_analysis_flow_line_13_fanout_1
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ENTITY_RECOGNIZER
    value: entity_recognizer
  - name: ASYA_HANDLER_FANIN_ANALYSIS_FLOW_LINE_13
    value: routers.fanin_analysis_flow_line_13
  - name: ASYA_HANDLER_ACTOR_MERGE_ANALYSIS
    value: merge_analysis
  - name: ASYA_HANDLER_ROUTER_ANALYSIS_FLOW_LINE_13_FANOUT_1
    value: routers.router_analysis_flow_line_13_fanout_1
  - name: ASYA_HANDLER_ACTOR_SENTIMENT_ANALYZER
    value: sentiment_analyzer
  - name: ASYA_HANDLER_ACTOR_TOPIC_EXTRACTOR
    value: topic_extractor

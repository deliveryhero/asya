apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-resource-pipeline
  namespace: default
  labels:
    asya.sh/flow: resource-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-resource-pipeline
  image: python:3.13-slim
  handler: routers.start_resource_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ACQUIRE_RESOURCE
    value: acquire_resource
  - name: ASYA_HANDLER_ACTOR_FINALIZE
    value: finalize
  - name: ASYA_HANDLER_ACTOR_HANDLE_FAILURE
    value: handle_failure
  - name: ASYA_HANDLER_ACTOR_PROCESS_WITH_RESOURCE
    value: process_with_resource
  - name: ASYA_HANDLER_ACTOR_RELEASE_RESOURCE
    value: release_resource
  - name: ASYA_HANDLER_ROUTER_RESOURCE_PIPELINE_LINE_11_SEQ_1
    value: routers.router_resource_pipeline_line_11_seq_1

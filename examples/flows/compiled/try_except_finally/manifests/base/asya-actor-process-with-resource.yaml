apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-process-with-resource
  namespace: default
  labels:
    asya.sh/flow: resource-pipeline
spec:
  actor: actor-process-with-resource
  image: examples.asya.sh/process-with-resource:latest
  handler: process_with_resource
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_7_0:
        maxAttempts: 1
        thenRoute:
        - router-resource-pipeline-line-10-except-2
    rules:
    - errors:
      - RuntimeError
      policy: try_except_line_7_0

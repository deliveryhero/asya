apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-research-flow-fanout-results
  namespace: default
  labels:
    asya.sh/flow: research-flow
    asya.sh/generated: 'true'
spec:
  actor: router-research-flow-fanout-results
  image: python:3.13-slim
  handler: routers.router_research_flow_fanout_results
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_FANIN_RESEARCH_FLOW_RESULTS
    value: routers.fanin_research_flow_results
  - name: ASYA_HANDLER_ACTOR_POST_PROCESSOR
    value: fanout_comprehension.post_processor
  - name: ASYA_HANDLER_ACTOR_PREPROCESSOR
    value: fanout_comprehension.preprocessor
  - name: ASYA_HANDLER_ACTOR_RESEARCH_AGENT
    value: fanout_comprehension.research_agent
  - name: ASYA_HANDLER_ROUTER_RESEARCH_FLOW_FANOUT_RESULTS
    value: routers.router_research_flow_fanout_results
  volumes:
  - name: routers
    configMap:
      name: research-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

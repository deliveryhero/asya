apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-research-agent
  namespace: default
  labels:
    asya.sh/flow: research-flow
spec:
  actor: actor-research-agent
  image: examples.asya.sh/research-agent:latest
  handler: fanout_comprehension.research_agent
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

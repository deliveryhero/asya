apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-post-processor
  namespace: default
  labels:
    asya.sh/flow: research-flow
    asya.sh/role: end
spec:
  actor: actor-post-processor
  image: examples.asya.sh/post-processor:latest
  handler: post_processor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

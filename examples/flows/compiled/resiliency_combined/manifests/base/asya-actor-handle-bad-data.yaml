apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handle-bad-data
  namespace: default
  labels:
    asya.sh/flow: resiliency-combined
spec:
  actor: actor-handle-bad-data
  image: examples.asya.sh/handle-bad-data:latest
  handler: resiliency_combined.handle_bad_data
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  resiliency:
    timeout:
      actor: 60

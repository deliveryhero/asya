apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-research-agent-if-tool-name-eq-calculator
  namespace: default
  labels:
    asya.sh/flow: research-agent
    asya.sh/generated: 'true'
spec:
  actor: router-research-agent-if-tool-name-eq-calculator
  image: python:3.13-slim
  handler: routers.router_research_agent_if_tool_name_eq_calculator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_RESEARCH_AGENT_IF_TOOL_NAME_EQ_CALCULATOR
    value: routers.router_research_agent_if_tool_name_eq_calculator
  - name: ASYA_HANDLER_ROUTER_RESEARCH_AGENT_IF_TOOL_NAME_EQ_CODE_EXEC
    value: routers.router_research_agent_if_tool_name_eq_code_exec
  - name: ASYA_HANDLER_ROUTER_RESEARCH_AGENT_IF_TOOL_NAME_EQ_SEARCH
    value: routers.router_research_agent_if_tool_name_eq_search
  - name: ASYA_HANDLER_ROUTER_RESEARCH_AGENT_WHILE_LOOP
    value: routers.router_research_agent_while_loop

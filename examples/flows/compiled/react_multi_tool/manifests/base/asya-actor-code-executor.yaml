apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-code-executor
  namespace: default
  labels:
    asya.sh/flow: research-agent
spec:
  actor: actor-code-executor
  image: examples.asya.sh/code-executor:latest
  handler: code_executor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

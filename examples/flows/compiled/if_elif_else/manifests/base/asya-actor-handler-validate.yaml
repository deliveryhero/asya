apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-validate
  namespace: default
  labels:
    asya.sh/flow: if-elif-else-flow
spec:
  actor: actor-handler-validate
  image: examples.asya.sh/handler-validate:latest
  handler: handler_validate
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-ingestion-pipeline
  namespace: default
  labels:
    asya.sh/flow: ingestion-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-ingestion-pipeline
  image: python:3.13-slim
  handler: routers.start_ingestion_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_DATA_FETCHER
    value: data_fetcher
  - name: ASYA_HANDLER_ACTOR_DATA_PARSER
    value: data_parser
  - name: ASYA_HANDLER_ACTOR_DATA_VALIDATOR
    value: data_validator
  - name: ASYA_HANDLER_ACTOR_DATA_WRITER
    value: data_writer
  volumes:
  - name: routers
    configMap:
      name: ingestion-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

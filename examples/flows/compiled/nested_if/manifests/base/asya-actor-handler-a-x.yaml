apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-a-x
  namespace: default
  labels:
    asya.sh/flow: nested-if-flow
spec:
  actor: actor-handler-a-x
  image: examples.asya.sh/handler-a-x:latest
  handler: handler_a_x
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

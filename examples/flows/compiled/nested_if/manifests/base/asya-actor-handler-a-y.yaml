apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handler-a-y
  namespace: default
  labels:
    asya.sh/flow: nested-if-flow
spec:
  actor: actor-handler-a-y
  image: examples.asya.sh/handler-a-y:latest
  handler: nested_if.handler_a_y
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-fast-analyzer
  namespace: default
  labels:
    asya.sh/flow: adaptive-flow
spec:
  actor: actor-fast-analyzer
  image: examples.asya.sh/fast-analyzer:latest
  handler: fast_analyzer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

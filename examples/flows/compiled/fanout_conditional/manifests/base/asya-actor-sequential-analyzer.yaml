apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-sequential-analyzer
  namespace: default
  labels:
    asya.sh/flow: adaptive-flow
spec:
  actor: actor-sequential-analyzer
  image: examples.asya.sh/sequential-analyzer:latest
  handler: fanout_conditional.sequential_analyzer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-initial-review
  namespace: default
  labels:
    asya.sh/flow: review-pipeline-flow
spec:
  actor: actor-initial-review
  image: examples.asya.sh/initial-review:latest
  handler: initial_review
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

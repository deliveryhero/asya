apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-main-flow
  namespace: default
  labels:
    asya.sh/flow: main-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-main-flow
  image: python:3.13-slim
  handler: routers.start_main_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ENRICH
    value: bare_script_with_composition.enrich
  - name: ASYA_HANDLER_ACTOR_FORMAT_OUTPUT
    value: bare_script_with_composition.format_output
  - name: ASYA_HANDLER_ACTOR_VALIDATE
    value: bare_script_with_composition.validate
  volumes:
  - name: routers
    configMap:
      name: main-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

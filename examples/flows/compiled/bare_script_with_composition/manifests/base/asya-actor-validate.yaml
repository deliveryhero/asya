apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-validate
  namespace: default
  labels:
    asya.sh/flow: main-flow
spec:
  actor: actor-validate
  image: examples.asya.sh/validate:latest
  handler: bare_script_with_composition.validate
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

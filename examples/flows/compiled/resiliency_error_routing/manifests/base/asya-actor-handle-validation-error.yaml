apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-handle-validation-error
  namespace: default
  labels:
    asya.sh/flow: failover-pipeline
spec:
  actor: actor-handle-validation-error
  image: examples.asya.sh/handle-validation-error:latest
  handler: handle_validation_error
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

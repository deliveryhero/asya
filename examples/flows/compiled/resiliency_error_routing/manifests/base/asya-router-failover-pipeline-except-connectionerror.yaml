apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-failover-pipeline-except-connectionerror
  namespace: default
  labels:
    asya.sh/flow: failover-pipeline
    asya.sh/generated: 'true'
spec:
  actor: router-failover-pipeline-except-connectionerror
  image: python:3.13-slim
  handler: routers.router_failover_pipeline_except_connectionerror
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CALL_FALLBACK
    value: resiliency_error_routing.call_fallback
  - name: ASYA_HANDLER_ACTOR_CALL_PRIMARY
    value: resiliency_error_routing.call_primary
  - name: ASYA_HANDLER_ACTOR_FINALIZE
    value: resiliency_error_routing.finalize
  - name: ASYA_HANDLER_ACTOR_HANDLE_VALIDATION_ERROR
    value: resiliency_error_routing.handle_validation_error
  volumes:
  - name: routers
    configMap:
      name: failover-pipeline-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

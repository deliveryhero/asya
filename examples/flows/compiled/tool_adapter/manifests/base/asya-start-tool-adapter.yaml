apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-tool-adapter
  namespace: default
  labels:
    asya.sh/flow: tool-adapter
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-tool-adapter
  image: python:3.13-slim
  handler: routers.start_tool_adapter
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_COMPOSE_RESPONSE
    value: compose_response
  - name: ASYA_HANDLER_ACTOR_FORMAT_GREETING
    value: format_greeting
  - name: ASYA_HANDLER_ACTOR_GET_WEATHER
    value: get_weather
  - name: ASYA_HANDLER_ACTOR_VALIDATE_INPUT
    value: validate_input
  volumes:
  - name: routers
    configMap:
      name: tool-adapter-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

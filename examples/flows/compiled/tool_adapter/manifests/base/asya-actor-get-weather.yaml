apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-get-weather
  namespace: default
  labels:
    asya.sh/flow: tool-adapter
spec:
  actor: actor-get-weather
  image: examples.asya.sh/get-weather:latest
  handler: get_weather
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

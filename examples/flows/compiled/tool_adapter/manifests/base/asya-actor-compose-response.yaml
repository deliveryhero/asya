apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-compose-response
  namespace: default
  labels:
    asya.sh/flow: tool-adapter
    asya.sh/role: end
spec:
  actor: actor-compose-response
  image: examples.asya.sh/compose-response:latest
  handler: compose_response
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

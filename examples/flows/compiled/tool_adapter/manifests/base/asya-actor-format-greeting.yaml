apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-format-greeting
  namespace: default
  labels:
    asya.sh/flow: tool-adapter
spec:
  actor: actor-format-greeting
  image: examples.asya.sh/format-greeting:latest
  handler: format_greeting
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

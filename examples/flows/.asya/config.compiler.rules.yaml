# Compiler rules: classify Python symbols during flow compilation.
#
# Classification (treat-as):
#   actor  - message boundary, separate K8s deployment
#   inline - run code inside router verbatim
#   unfold - expand function body into current flow
#   flow   - sub-flow, compile recursively
#   config - infrastructure metadata, strip and extract
#
# Extraction (extract:):
#   Map decorator/context-manager parameter names to AsyncActor spec paths.
#   The compiler extracts values from Python source and injects them into manifests.
#
# Matching is exact (no wildcards). The parser auto-detects scope from syntax.
# Built-in rules for asyncio.timeout and tenacity.retry ship with asya-lab.

# Map _asya_utils.retry stub to the tenacity.retry rule
- match: "_asya_utils.retry"
  treat-as: config
  extract:
    max_attempt_number: spec.resiliency.policies.default.maxAttempts
    initial_delay: spec.resiliency.policies.default.initialDelay
    errors: spec.resiliency.rules

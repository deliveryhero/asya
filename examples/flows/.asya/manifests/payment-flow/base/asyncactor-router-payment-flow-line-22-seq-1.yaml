apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-payment-flow-line-22-seq-1
  namespace: default
  labels:
    asya.sh/flow: payment-flow
    asya.sh/generated: 'true'
spec:
  actor: router-payment-flow-line-22-seq-1
  image: python:3.13-slim
  handler: routers.router_payment_flow_line_22_seq_1
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_AUDIT_LOG
    value: audit_log
  - name: ASYA_HANDLER_CHARGE_CARD
    value: charge_card
  - name: ASYA_HANDLER_NOTIFY_PAYMENT_FAILURE
    value: notify_payment_failure
  - name: ASYA_HANDLER_PROCESS_BANK_TRANSFER
    value: process_bank_transfer
  - name: ASYA_HANDLER_RECORD_TRANSACTION
    value: record_transaction
  - name: ASYA_HANDLER_ROUTER_PAYMENT_FLOW_LINE_16_IF_3
    value: routers.router_payment_flow_line_16_if_3
  - name: ASYA_HANDLER_ROUTER_PAYMENT_FLOW_LINE_22_SEQ_1
    value: routers.router_payment_flow_line_22_seq_1
  - name: ASYA_HANDLER_SEND_RECEIPT
    value: send_receipt
  - name: ASYA_HANDLER_VALIDATE_PAYMENT
    value: validate_payment

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: call-llm
  namespace: default
  labels:
    asya.sh/flow: llm-pipeline
spec:
  actor: call-llm
  image: examples.asya.sh/call-llm:latest
  handler: call_llm
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_13_0:
        maxAttempts: 1
        thenRoute:
        - router-llm-pipeline-line-15-except-2
      try_except_line_13_1:
        maxAttempts: 1
        thenRoute:
        - router-llm-pipeline-line-18-except-4
    rules:
    - errors:
      - openai.RateLimitError
      policy: try_except_line_13_0
    - errors:
      - openai.AuthenticationError
      policy: try_except_line_13_1

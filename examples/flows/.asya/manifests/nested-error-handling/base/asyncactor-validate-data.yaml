apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: validate-data
  namespace: default
  labels:
    asya.sh/flow: nested-error-handling
spec:
  actor: validate-data
  image: examples.asya.sh/validate-data:latest
  handler: validate_data
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []
  resiliency:
    policies:
      try_except_line_23_0:
        maxAttempts: 1
        thenRoute:
        - router-nested-error-handling-line-32-except-2
      try_except_line_25_0:
        maxAttempts: 1
        thenRoute:
        - router-nested-error-handling-line-28-except-4
    rules:
    - errors:
      - ConnectionError
      policy: try_except_line_23_0
    - errors:
      - ValueError
      policy: try_except_line_25_0

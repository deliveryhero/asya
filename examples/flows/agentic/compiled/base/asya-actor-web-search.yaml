apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-web-search
  namespace: default
  labels:
    asya.sh/flow: tool-calling-agent
spec:
  actor: actor-web-search
  image: examples.asya.sh/web-search:latest
  handler: adapter_web_search.adapter_web_search
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  volumes:
  - name: adapter
    configMap:
      name: tool-calling-agent-web-search-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_web_search.py
    subPath: adapter_web_search.py
    readOnly: true

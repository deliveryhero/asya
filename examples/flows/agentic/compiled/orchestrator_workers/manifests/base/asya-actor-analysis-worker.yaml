apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-analysis-worker
  namespace: default
  labels:
    asya.sh/flow: orchestrator-workers
spec:
  actor: actor-analysis-worker
  image: examples.asya.sh/analysis-worker:latest
  handler: orchestrator_workers.analysis_worker
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-orchestrator
  namespace: default
  labels:
    asya.sh/flow: orchestrator-workers
spec:
  actor: actor-orchestrator
  image: examples.asya.sh/orchestrator:latest
  handler: orchestrator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

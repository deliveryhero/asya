apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-writing-worker
  namespace: default
  labels:
    asya.sh/flow: orchestrator-workers
spec:
  actor: actor-writing-worker
  image: examples.asya.sh/writing-worker:latest
  handler: writing_worker
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: re-planner
  namespace: default
  labels:
    asya.sh/flow: plan-and-execute
spec:
  actor: re-planner
  image: examples.asya.sh/re-planner:latest
  handler: re_planner
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

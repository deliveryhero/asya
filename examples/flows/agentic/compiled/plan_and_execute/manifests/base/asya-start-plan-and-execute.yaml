apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-plan-and-execute
  namespace: default
  labels:
    asya.sh/flow: plan-and-execute
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-plan-and-execute
  image: python:3.13-slim
  handler: routers.start_plan_and_execute
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_EXECUTOR
    value: executor
  - name: ASYA_HANDLER_ACTOR_PLANNER
    value: planner
  - name: ASYA_HANDLER_ACTOR_RE_PLANNER
    value: re_planner
  - name: ASYA_HANDLER_ROUTER_PLAN_AND_EXECUTE_LINE_53_WHILE_2
    value: routers.router_plan_and_execute_line_53_while_2
  - name: ASYA_HANDLER_ROUTER_PLAN_AND_EXECUTE_LINE_58_IF_3
    value: routers.router_plan_and_execute_line_58_if_3
  - name: ASYA_HANDLER_ROUTER_PLAN_AND_EXECUTE_LINE_61_SEQ_1
    value: routers.router_plan_and_execute_line_61_seq_1
  - name: ASYA_HANDLER_ACTOR_SYNTHESIZER
    value: synthesizer

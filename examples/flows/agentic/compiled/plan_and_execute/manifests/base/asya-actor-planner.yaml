apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-planner
  namespace: default
  labels:
    asya.sh/flow: plan-and-execute
spec:
  actor: actor-planner
  image: examples.asya.sh/planner:latest
  handler: plan_and_execute.planner
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

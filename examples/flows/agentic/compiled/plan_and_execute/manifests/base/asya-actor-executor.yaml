apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-executor
  namespace: default
  labels:
    asya.sh/flow: plan-and-execute
spec:
  actor: actor-executor
  image: examples.asya.sh/executor:latest
  handler: plan_and_execute.executor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

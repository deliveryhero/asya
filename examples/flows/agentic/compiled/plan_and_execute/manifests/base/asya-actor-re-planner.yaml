apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-re-planner
  namespace: default
  labels:
    asya.sh/flow: plan-and-execute
spec:
  actor: actor-re-planner
  image: examples.asya.sh/re-planner:latest
  handler: plan_and_execute.re_planner
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

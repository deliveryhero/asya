apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-editor
  namespace: default
  labels:
    asya.sh/flow: hierarchical-delegation
spec:
  actor: actor-editor
  image: examples.asya.sh/editor:latest
  handler: editor
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

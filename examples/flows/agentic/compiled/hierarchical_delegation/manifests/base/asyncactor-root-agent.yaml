apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: root-agent
  namespace: default
  labels:
    asya.sh/flow: hierarchical-delegation
spec:
  actor: root-agent
  image: examples.asya.sh/root-agent:latest
  handler: root_agent
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

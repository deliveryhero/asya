apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: sql-specialist
  namespace: default
  labels:
    asya.sh/flow: hierarchical-delegation
spec:
  actor: sql-specialist
  image: examples.asya.sh/sql-specialist:latest
  handler: sql_specialist
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-writer
  namespace: default
  labels:
    asya.sh/flow: hierarchical-delegation
spec:
  actor: actor-writer
  image: examples.asya.sh/writer:latest
  handler: hierarchical_delegation.writer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: api-specialist
  namespace: default
  labels:
    asya.sh/flow: hierarchical-delegation
spec:
  actor: api-specialist
  image: examples.asya.sh/api-specialist:latest
  handler: api_specialist
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: classify
  namespace: default
  labels:
    asya.sh/flow: actor-override-flow
spec:
  actor: classify
  image: examples.asya.sh/classify:latest
  handler: classify
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-actor-override-flow-if-needs-tool
  namespace: default
  labels:
    asya.sh/flow: actor-override-flow
    asya.sh/generated: 'true'
spec:
  actor: router-actor-override-flow-if-needs-tool
  image: python:3.13-slim
  handler: routers.router_actor_override_flow_if_needs_tool
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CLASSIFY
    value: actor_override_routing.classify
  - name: ASYA_HANDLER_ACTOR_FORMAT_OUTPUT
    value: actor_override_routing.format_output
  - name: ASYA_HANDLER_ROUTER_ACTOR_OVERRIDE_FLOW_IF_NEEDS_TOOL
    value: routers.router_actor_override_flow_if_needs_tool
  - name: ASYA_HANDLER_ACTOR_TOOL_EXECUTOR
    value: actor_override_routing.tool_executor
  volumes:
  - name: routers
    configMap:
      name: actor-override-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

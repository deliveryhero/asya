apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-query-analyzer
  namespace: default
  labels:
    asya.sh/flow: rag-pipeline
spec:
  actor: actor-query-analyzer
  image: examples.asya.sh/query-analyzer:latest
  handler: query_analyzer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

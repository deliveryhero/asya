apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-fact-checker
  namespace: default
  labels:
    asya.sh/flow: rag-pipeline
    asya.sh/role: end
spec:
  actor: actor-fact-checker
  image: examples.asya.sh/fact-checker:latest
  handler: rag_pipeline.fact_checker
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

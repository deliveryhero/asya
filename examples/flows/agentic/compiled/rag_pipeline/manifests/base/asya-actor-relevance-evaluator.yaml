apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-relevance-evaluator
  namespace: default
  labels:
    asya.sh/flow: rag-pipeline
spec:
  actor: actor-relevance-evaluator
  image: examples.asya.sh/relevance-evaluator:latest
  handler: rag_pipeline.relevance_evaluator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

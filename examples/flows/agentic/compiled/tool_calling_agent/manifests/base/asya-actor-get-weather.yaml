apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-get-weather
  namespace: default
  labels:
    asya.sh/flow: tool-calling-agent
spec:
  actor: actor-get-weather
  image: examples.asya.sh/get-weather:latest
  handler: adapter_get_weather.adapter_get_weather
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  volumes:
  - name: adapter
    configMap:
      name: tool-calling-agent-get-weather-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_get_weather.py
    subPath: adapter_get_weather.py
    readOnly: true

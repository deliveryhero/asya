apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-llm-reason
  namespace: default
  labels:
    asya.sh/flow: tool-calling-agent
spec:
  actor: actor-llm-reason
  image: examples.asya.sh/llm-reason:latest
  handler: llm_reason
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

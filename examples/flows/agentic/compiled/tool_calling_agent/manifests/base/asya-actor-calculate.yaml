apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-calculate
  namespace: default
  labels:
    asya.sh/flow: tool-calling-agent
spec:
  actor: actor-calculate
  image: examples.asya.sh/calculate:latest
  handler: adapter_calculate.adapter_calculate
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  volumes:
  - name: adapter
    configMap:
      name: tool-calling-agent-calculate-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_calculate.py
    subPath: adapter_calculate.py
    readOnly: true

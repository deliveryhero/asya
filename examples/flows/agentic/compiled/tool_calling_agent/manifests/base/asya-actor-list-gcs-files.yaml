apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-list-gcs-files
  namespace: default
  labels:
    asya.sh/flow: tool-calling-agent
spec:
  actor: actor-list-gcs-files
  image: examples.asya.sh/list-gcs-files:latest
  handler: adapter_list_gcs_files.adapter_list_gcs_files
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []
  volumes:
  - name: adapter
    configMap:
      name: tool-calling-agent-list-gcs-files-adapter
  volumeMounts:
  - name: adapter
    mountPath: /opt/asya/adapter_list_gcs_files.py
    subPath: adapter_list_gcs_files.py
    readOnly: true

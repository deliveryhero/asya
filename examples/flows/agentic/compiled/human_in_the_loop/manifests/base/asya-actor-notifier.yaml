apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-notifier
  namespace: default
  labels:
    asya.sh/flow: human-in-the-loop
    asya.sh/role: end
spec:
  actor: actor-notifier
  image: examples.asya.sh/notifier:latest
  handler: notifier
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

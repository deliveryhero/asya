apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: debater-a
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
spec:
  actor: debater-a
  image: examples.asya.sh/debater-a:latest
  handler: debater_a
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

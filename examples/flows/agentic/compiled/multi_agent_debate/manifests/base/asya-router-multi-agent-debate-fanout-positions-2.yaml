apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-multi-agent-debate-fanout-positions-2
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
    asya.sh/generated: 'true'
spec:
  actor: router-multi-agent-debate-fanout-positions-2
  image: python:3.13-slim
  handler: routers.router_multi_agent_debate_fanout_positions_2
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CONVERGENCE_CHECKER
    value: convergence_checker
  - name: ASYA_HANDLER_ACTOR_DEBATER_A
    value: debater_a
  - name: ASYA_HANDLER_ACTOR_DEBATER_B
    value: debater_b
  - name: ASYA_HANDLER_ACTOR_DEBATER_C
    value: debater_c
  - name: ASYA_HANDLER_FANIN_MULTI_AGENT_DEBATE_POSITIONS
    value: routers.fanin_multi_agent_debate_positions
  - name: ASYA_HANDLER_FANIN_MULTI_AGENT_DEBATE_POSITIONS_2
    value: routers.fanin_multi_agent_debate_positions_2
  - name: ASYA_HANDLER_ACTOR_FINAL_JUDGE
    value: final_judge
  - name: ASYA_HANDLER_ACTOR_REVISE_A
    value: revise_a
  - name: ASYA_HANDLER_ACTOR_REVISE_B
    value: revise_b
  - name: ASYA_HANDLER_ACTOR_REVISE_C
    value: revise_c
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_FANOUT_POSITIONS
    value: routers.router_multi_agent_debate_fanout_positions
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_FANOUT_POSITIONS_2
    value: routers.router_multi_agent_debate_fanout_positions_2
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_IF_CONVERGED
    value: routers.router_multi_agent_debate_if_converged
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_IF_ROUND_GE_3
    value: routers.router_multi_agent_debate_if_round_ge_3
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_SEQ_SET_ROUND
    value: routers.router_multi_agent_debate_seq_set_round
  - name: ASYA_HANDLER_ROUTER_MULTI_AGENT_DEBATE_WHILE_LOOP
    value: routers.router_multi_agent_debate_while_loop

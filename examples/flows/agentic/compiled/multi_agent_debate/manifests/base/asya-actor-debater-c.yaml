apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-debater-c
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
spec:
  actor: actor-debater-c
  image: examples.asya.sh/debater-c:latest
  handler: multi_agent_debate.debater_c
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

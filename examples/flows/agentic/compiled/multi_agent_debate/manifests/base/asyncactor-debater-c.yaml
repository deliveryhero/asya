apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: debater-c
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
spec:
  actor: debater-c
  image: examples.asya.sh/debater-c:latest
  handler: debater_c
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-revise-a
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
spec:
  actor: actor-revise-a
  image: examples.asya.sh/revise-a:latest
  handler: revise_a
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

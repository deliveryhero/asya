apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: final-judge
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
    asya.sh/role: end
spec:
  actor: final-judge
  image: examples.asya.sh/final-judge:latest
  handler: final_judge
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

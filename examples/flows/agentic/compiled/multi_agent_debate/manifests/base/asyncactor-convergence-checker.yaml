apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: convergence-checker
  namespace: default
  labels:
    asya.sh/flow: multi-agent-debate
spec:
  actor: convergence-checker
  image: examples.asya.sh/convergence-checker:latest
  handler: convergence_checker
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

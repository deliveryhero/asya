apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-reducer
  namespace: default
  labels:
    asya.sh/flow: map-reduce
    asya.sh/role: end
spec:
  actor: actor-reducer
  image: examples.asya.sh/reducer:latest
  handler: map_reduce.reducer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

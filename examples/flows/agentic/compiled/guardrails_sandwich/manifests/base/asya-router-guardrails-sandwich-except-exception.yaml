apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-guardrails-sandwich-except-exception
  namespace: default
  labels:
    asya.sh/flow: guardrails-sandwich
    asya.sh/generated: 'true'
spec:
  actor: router-guardrails-sandwich-except-exception
  image: python:3.13-slim
  handler: routers.router_guardrails_sandwich_except_exception
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_CORE_AGENT
    value: core_agent
  - name: ASYA_HANDLER_ACTOR_INPUT_VALIDATOR
    value: input_validator
  - name: ASYA_HANDLER_ACTOR_OUTPUT_VALIDATOR
    value: output_validator
  - name: ASYA_HANDLER_ACTOR_SAFE_FALLBACK
    value: safe_fallback

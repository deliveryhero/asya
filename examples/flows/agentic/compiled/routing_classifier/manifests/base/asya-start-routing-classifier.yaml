apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-routing-classifier
  namespace: default
  labels:
    asya.sh/flow: routing-classifier
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-routing-classifier
  image: python:3.13-slim
  handler: routers.start_routing_classifier
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_ACCOUNT_AGENT
    value: account_agent
  - name: ASYA_HANDLER_ACTOR_BILLING_AGENT
    value: billing_agent
  - name: ASYA_HANDLER_ACTOR_CLASSIFIER
    value: classifier
  - name: ASYA_HANDLER_ACTOR_FORMAT_REPLY
    value: format_reply
  - name: ASYA_HANDLER_ACTOR_GENERAL_AGENT
    value: general_agent
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_46_IF_3
    value: routers.router_routing_classifier_line_46_if_3
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_48_IF_2
    value: routers.router_routing_classifier_line_48_if_2
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_50_IF_1
    value: routers.router_routing_classifier_line_50_if_1
  - name: ASYA_HANDLER_ACTOR_TECHNICAL_AGENT
    value: technical_agent

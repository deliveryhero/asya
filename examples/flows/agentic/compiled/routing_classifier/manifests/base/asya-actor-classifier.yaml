apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-classifier
  namespace: default
  labels:
    asya.sh/flow: routing-classifier
spec:
  actor: actor-classifier
  image: examples.asya.sh/classifier:latest
  handler: routing_classifier.classifier
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: format-reply
  namespace: default
  labels:
    asya.sh/flow: routing-classifier
    asya.sh/role: end
spec:
  actor: format-reply
  image: examples.asya.sh/format-reply:latest
  handler: format_reply
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

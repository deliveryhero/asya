apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-routing-classifier-line-50-if-1
  namespace: default
  labels:
    asya.sh/flow: routing-classifier
    asya.sh/generated: 'true'
spec:
  actor: router-routing-classifier-line-50-if-1
  image: python:3.13-slim
  handler: routers.router_routing_classifier_line_50_if_1
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACCOUNT_AGENT
    value: account_agent
  - name: ASYA_HANDLER_BILLING_AGENT
    value: billing_agent
  - name: ASYA_HANDLER_CLASSIFIER
    value: classifier
  - name: ASYA_HANDLER_FORMAT_REPLY
    value: format_reply
  - name: ASYA_HANDLER_GENERAL_AGENT
    value: general_agent
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_46_IF_3
    value: routers.router_routing_classifier_line_46_if_3
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_48_IF_2
    value: routers.router_routing_classifier_line_48_if_2
  - name: ASYA_HANDLER_ROUTER_ROUTING_CLASSIFIER_LINE_50_IF_1
    value: routers.router_routing_classifier_line_50_if_1
  - name: ASYA_HANDLER_TECHNICAL_AGENT
    value: technical_agent

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: billing-agent
  namespace: default
  labels:
    asya.sh/flow: routing-classifier
spec:
  actor: billing-agent
  image: examples.asya.sh/billing-agent:latest
  handler: billing_agent
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

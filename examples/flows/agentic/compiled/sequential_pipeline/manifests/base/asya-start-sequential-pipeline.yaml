apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-sequential-pipeline
  namespace: default
  labels:
    asya.sh/flow: sequential-pipeline
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-sequential-pipeline
  image: python:3.13-slim
  handler: routers.start_sequential_pipeline
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_DATA_ANALYST
    value: data_analyst
  - name: ASYA_HANDLER_ACTOR_EXECUTION_PLANNER
    value: execution_planner
  - name: ASYA_HANDLER_ACTOR_RISK_EVALUATOR
    value: risk_evaluator
  - name: ASYA_HANDLER_ACTOR_TRADING_ANALYST
    value: trading_analyst

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-execution-planner
  namespace: default
  labels:
    asya.sh/flow: sequential-pipeline
spec:
  actor: actor-execution-planner
  image: examples.asya.sh/execution-planner:latest
  handler: sequential_pipeline.execution_planner
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

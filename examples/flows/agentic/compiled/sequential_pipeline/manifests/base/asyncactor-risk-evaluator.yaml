apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: risk-evaluator
  namespace: default
  labels:
    asya.sh/flow: sequential-pipeline
    asya.sh/role: end
spec:
  actor: risk-evaluator
  image: examples.asya.sh/risk-evaluator:latest
  handler: risk_evaluator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

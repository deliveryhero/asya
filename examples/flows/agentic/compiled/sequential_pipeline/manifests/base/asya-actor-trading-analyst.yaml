apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-trading-analyst
  namespace: default
  labels:
    asya.sh/flow: sequential-pipeline
spec:
  actor: actor-trading-analyst
  image: examples.asya.sh/trading-analyst:latest
  handler: trading_analyst
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-researcher
  namespace: default
  labels:
    asya.sh/flow: research-and-refine
spec:
  actor: actor-researcher
  image: examples.asya.sh/researcher:latest
  handler: research_and_refine.researcher
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

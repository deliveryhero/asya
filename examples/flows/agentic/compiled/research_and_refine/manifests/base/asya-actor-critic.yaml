apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-critic
  namespace: default
  labels:
    asya.sh/flow: research-and-refine
spec:
  actor: actor-critic
  image: examples.asya.sh/critic:latest
  handler: research_and_refine.critic
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-aggregator
  namespace: default
  labels:
    asya.sh/flow: parallel-sectioning
    asya.sh/role: end
spec:
  actor: actor-aggregator
  image: examples.asya.sh/aggregator:latest
  handler: parallel_sectioning.aggregator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

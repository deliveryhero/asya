apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-evaluator-optimizer
  namespace: default
  labels:
    asya.sh/flow: evaluator-optimizer
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-evaluator-optimizer
  image: python:3.13-slim
  handler: routers.start_evaluator_optimizer
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_EVALUATOR
    value: evaluator_optimizer.evaluator
  - name: ASYA_HANDLER_ACTOR_GENERATOR
    value: evaluator_optimizer.generator
  - name: ASYA_HANDLER_ACTOR_POLISHER
    value: evaluator_optimizer.polisher
  - name: ASYA_HANDLER_ROUTER_EVALUATOR_OPTIMIZER_IF_ITERATION_GE_MAX_ITERATIONS
    value: routers.router_evaluator_optimizer_if_iteration_ge_max_iterations
  - name: ASYA_HANDLER_ROUTER_EVALUATOR_OPTIMIZER_IF_SCORE_GE_SCORE_THRESHOLD
    value: routers.router_evaluator_optimizer_if_score_ge_score_threshold
  - name: ASYA_HANDLER_ROUTER_EVALUATOR_OPTIMIZER_SEQ_SET_ITERATION
    value: routers.router_evaluator_optimizer_seq_set_iteration
  - name: ASYA_HANDLER_ROUTER_EVALUATOR_OPTIMIZER_WHILE_LOOP
    value: routers.router_evaluator_optimizer_while_loop
  volumes:
  - name: routers
    configMap:
      name: evaluator-optimizer-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

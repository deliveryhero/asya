apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-generator
  namespace: default
  labels:
    asya.sh/flow: evaluator-optimizer
spec:
  actor: actor-generator
  image: examples.asya.sh/generator:latest
  handler: generator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-polisher
  namespace: default
  labels:
    asya.sh/flow: evaluator-optimizer
    asya.sh/role: end
spec:
  actor: actor-polisher
  image: examples.asya.sh/polisher:latest
  handler: polisher
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-calculator
  namespace: default
  labels:
    asya.sh/flow: react-tool-loop
spec:
  actor: actor-calculator
  image: examples.asya.sh/calculator:latest
  handler: react_tool_loop.calculator
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

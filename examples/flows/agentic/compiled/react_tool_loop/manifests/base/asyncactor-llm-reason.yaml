apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: llm-reason
  namespace: default
  labels:
    asya.sh/flow: react-tool-loop
spec:
  actor: llm-reason
  image: examples.asya.sh/llm-reason:latest
  handler: llm_reason
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: '5'
  env: []

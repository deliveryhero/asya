apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-format-response
  namespace: default
  labels:
    asya.sh/flow: react-tool-loop
    asya.sh/role: end
spec:
  actor: actor-format-response
  image: examples.asya.sh/format-response:latest
  handler: format_response
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

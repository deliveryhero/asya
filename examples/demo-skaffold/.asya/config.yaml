templates:
  namespace: default
  router_image: "python:3.13-slim"
  max_replicas: 5

compiler:
  code: "./compiled/${arg:flow_name}/code"
  artifacts: "./compiled/${arg:flow_name}/artifacts"
  manifests: "./compiled/${arg:flow_name}/manifests"
  templates: ".asya/templates"

contexts:
  dev:
    namespace: asya-demo
    gateway: http://localhost:18080
default_context: dev

- module: "summarize"
  image: "europe-west1-docker.pkg.dev/foodsci-img-gen-dev-1407-1448/asya-demo/skaffold-summarizer:v0.5.5-27-gfd384607"
- module: "translate"
  image: "europe-west1-docker.pkg.dev/foodsci-img-gen-dev-1407-1448/asya-demo/skaffold-translator:v0.5.5-27-gfd384607"

compiler:
  routers: "./compiled"
  manifests: ".asya/manifests"
  templates: ".asya/templates"

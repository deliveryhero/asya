apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-summarize
  namespace: default
  labels:
    asya.sh/flow: text-flow
    asya.sh/role: end
spec:
  actor: actor-summarize
  image: src-team-a-proper-package
  handler: nlp.summarizer.summarize
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env:
  - name: PYTHONUNBUFFERED
    value: '1'

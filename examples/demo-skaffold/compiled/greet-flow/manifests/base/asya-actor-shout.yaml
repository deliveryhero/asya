apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: actor-shout
  namespace: default
  labels:
    asya.sh/flow: greet-flow
    asya.sh/role: end
spec:
  actor: actor-shout
  image: src-team-b-bare-scripts
  handler: shouter.shout
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 5
  env: []

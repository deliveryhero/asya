apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-greet-flow-seq-p-shout-p
  namespace: default
  labels:
    asya.sh/flow: greet-flow
    asya.sh/generated: 'true'
spec:
  actor: router-greet-flow-seq-p-shout-p
  image: python:3.13-slim
  handler: routers.router_greet_flow_seq_p_shout_p
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ACTOR_GREET
    value: greeter.greet
  - name: ASYA_HANDLER_ROUTER_GREET_FLOW_SEQ_P_SHOUT_P
    value: routers.router_greet_flow_seq_p_shout_p
  volumes:
  - name: routers
    configMap:
      name: greet-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

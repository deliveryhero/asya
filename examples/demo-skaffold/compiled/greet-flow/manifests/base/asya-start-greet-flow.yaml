apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-greet-flow
  namespace: default
  labels:
    asya.sh/flow: greet-flow
    asya.sh/role: start
    asya.sh/generated: 'true'
spec:
  actor: start-greet-flow
  image: python:3.13-slim
  handler: routers.start_greet_flow
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_GREET_FLOW_LINE_13_SEQ_1
    value: routers.router_greet_flow_line_13_seq_1

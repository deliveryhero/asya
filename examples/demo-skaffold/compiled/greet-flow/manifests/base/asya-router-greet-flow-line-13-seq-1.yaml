apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-greet-flow-line-13-seq-1
  namespace: default
  labels:
    asya.sh/flow: greet-flow
    asya.sh/generated: 'true'
spec:
  actor: router-greet-flow-line-13-seq-1
  image: python:3.13-slim
  handler: routers.router_greet_flow_line_13_seq_1
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 2
  env:
  - name: ASYA_HANDLER_ROUTER_GREET_FLOW_LINE_13_SEQ_1
    value: routers.router_greet_flow_line_13_seq_1
  volumes:
  - name: routers
    configMap:
      name: greet-flow-routers
  volumeMounts:
  - name: routers
    mountPath: /opt/asya/routers.py
    subPath: routers.py
    readOnly: true

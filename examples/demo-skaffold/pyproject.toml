[project]
name = "demo-skaffold"
version = "0.1.0"
description = "Multi-team Skaffold demo for Asya build tool evaluation"
requires-python = ">=3.13"
dependencies = [
    "asya-lab",
    "nlp",
    "team-b",
]

[tool.uv.sources]
nlp = { path = "src/team-a/packages/nlp" }
team-b = { path = "src/other-repo/team-b" }
asya-lab = { path = "../../src/asya-lab", editable = true }

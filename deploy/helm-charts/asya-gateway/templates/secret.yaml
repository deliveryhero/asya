{{- if and .Values.database.host (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asya-gateway.fullname" . }}-db
  labels:
    {{- include "asya-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- end }}

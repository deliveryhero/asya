{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asya-gateway.fullname" . }}-mcp-tools
  labels:
    {{- include "asya-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
    asya.sh/config-type: mcp-tools
data:
  tools.yaml: |
    tools:
    {{- if .Values.mcpTools }}
    {{- .Values.mcpTools | toYaml | nindent 4 }}
    {{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "asya-gateway.meshApi.fullname" . }}
  labels:
    {{- include "asya-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: mesh-api
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.meshApi.port }}
    targetPort: mesh-ext
    protocol: TCP
    name: http
    {{- if and .Values.service.meshApi.nodePort (eq .Values.service.type "NodePort") }}
    nodePort: {{ .Values.service.meshApi.nodePort }}
    {{- end }}
  selector:
    {{- include "asya-gateway.selectorLabels" . | nindent 4 }}

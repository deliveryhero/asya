{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asya-gateway.fullname" . }}-a2a-agents
  labels:
    {{- include "asya-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
    asya.sh/config-type: a2a-agents
data:
  agents.yaml: |
    agents:
    {{- if .Values.a2aAgents }}
    {{- .Values.a2aAgents | toYaml | nindent 4 }}
    {{- end }}
{{- end }}

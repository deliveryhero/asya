replicaCount: 1

# --- Container images ---
meshApi:
  image:
    repository: ghcr.io/deliveryhero/asya-mesh-api
    tag: "" # defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcp:
  enabled: false
  image:
    repository: ghcr.io/deliveryhero/asya-mcp-adapter
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

a2a:
  enabled: false
  image:
    repository: ghcr.io/deliveryhero/asya-a2a-adapter
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# --- State proxy sidecars ---
stateProxy:
  mesh:
    image:
      repository: ghcr.io/deliveryhero/asya-state-proxy-pg-kv
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    socketDir: /var/run/asya-state-proxy-mesh
    indexes: "status"
  envelopes:
    enabled: false
    image:
      repository: ghcr.io/deliveryhero/asya-state-proxy-s3-buffered-lww
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    socketDir: /var/run/asya-state-proxy-envelopes
    config:
      bucket: ""
      region: us-east-1
      endpoint: ""

# --- Database (for state-proxy-pg-kv) ---
database:
  host: ""
  port: 5432
  name: asya_gateway
  username: asya
  password: ""
  existingSecret: ""
  existingSecretKey: password
  sslMode: disable # use "require" in production

# --- Transport (mesh-api needs queue publish) ---
transports:
  rabbitmq:
    enabled: false
    config:
      url: "amqp://guest:guest@rabbitmq:5672/"
      exchange: "asya"
      poolSize: 20
  sqs:
    enabled: false
    config:
      endpoint: ""
      region: "us-east-1"
      visibilityTimeout: 300
      waitTimeSeconds: 20
  pubsub:
    enabled: false
    config:
      projectId: ""
      endpoint: ""

# --- Ingress ---
ingress:
  enabled: false
  className: nginx
  host: ""
  internalHost: ""
  annotations: {}
  tls: []
  internalAnnotations: {}

# --- Services ---
service:
  type: ClusterIP
  meshApi:
    port: 8080
  meshApiInternal:
    port: 8081
    type: ClusterIP
  mcp:
    port: 8082
  a2a:
    port: 8083

# --- MCP tool definitions (mounted as ConfigMap) ---
mcpTools: []
# - name: train_model
#   description: "Train a model"
#   actor: start-my-flow
#   timeout: 3600
#   inputSchema:
#     type: object
#     properties:
#       lr: {type: number}
#     required: [lr]
#   progress: true

# --- A2A agent definitions (mounted as ConfigMap) ---
a2aAgents: []
# - name: autoresearch
#   description: "Autonomous ML agent"
#   actor: start-autoresearch
#   timeout: 14400
#   streaming: true
#   skills:
#     - id: experiment
#       name: Run experiment
#       description: "Execute experiments"
#   inputModes: [text/plain, application/json]
#   outputModes: [text/plain, application/json]

# --- Pod configuration ---
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# --- Tracing ---
tracing:
  endpoint: ""

# --- Helm test configuration ---
tests:
  image: alpine/k8s:1.28.3
  imagePullPolicy: IfNotPresent

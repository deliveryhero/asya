replicaCount: 1

image:
  repository: ghcr.io/deliveryhero/asya-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
  - host: asya-gateway.local
    paths:
    - path: /
      pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Gateway configuration
config:
  port: "8080"

# Transport configuration
# Choose exactly one transport to enable; all others should be disabled
transports:
  rabbitmq:
    enabled: false
    config:
      url: "amqp://guest:guest@rabbitmq:5672/"
      exchange: "asya"
      poolSize: 20

  sqs:
    enabled: false
    config:
      endpoint: "" # Leave empty for AWS SQS; set to http://sqs:4566 for LocalStack
      region: "us-east-1"
      visibilityTimeout: 300
      waitTimeSeconds: 20

  pubsub:
    enabled: false
    config:
      projectId: ""
      endpoint: ""

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    database: asya_gateway
    username: asya
    password: asya-password # Change in production!
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 128Mi

# Database migration job
migration:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  backoffLimit: 5

# Flow registry: flows are registered via ConfigMaps in /etc/asya/flows/.
# The gateway reads all *.yaml files and hot-reloads on changes.
#
# Two ways to register flows:
#   1. Helm-managed (seed at deploy time):
#      exposedFlows:
#      - name: my-flow
#        entrypoint: start-my-flow
#        description: "My flow"
#        mcp: {}
#
#   2. Per-flow ConfigMaps (deployed by `asya k apply`):
#      flowConfigMaps:
#      - asya-flow-text-flow-config
#      - asya-flow-greet-flow-config
#
# Per-flow CMs are created by `asya expose` and deployed alongside actors.
# The gateway mounts them via projected volume into the same directory.
exposedFlows: []
flowConfigMaps: []
flowsExposerGroup: "asya-flow-exposers"

# External database (if postgresql.enabled=false)
# Leave host empty to use in-memory store (no persistence)
externalDatabase:
  host: "" # Set to hostname for external PostgreSQL, or leave empty for in-memory store
  port: 5432
  database: asya_gateway
  username: asya
  password: "" # Password for external database (only used if existingSecret is not set)
  existingSecret: "" # Name of existing secret containing database password (recommended)
  existingSecretKey: password # Key in existingSecret that contains the password

# Test image configuration (for Helm test pods)
# Override to use a pre-loaded image in Kind clusters
tests:
  image: alpine/k8s:1.28.3
  imagePullPolicy: IfNotPresent

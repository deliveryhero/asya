{{- if .Values.sampleGatewayDb.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: asya-gateway-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.sampleGatewayDb.postgresql.service.type }}
  ports:
  - port: {{ .Values.sampleGatewayDb.postgresql.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app: postgresql
{{- end }}

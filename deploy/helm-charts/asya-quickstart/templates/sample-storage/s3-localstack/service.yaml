{{- if and .Values.sampleStorage.s3Localstack.enabled (eq .Values.global.storage "s3") }}
apiVersion: v1
kind: Service
metadata:
  name: localstack-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app: localstack-s3
    app.kubernetes.io/name: localstack-s3
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-storage
spec:
  type: {{ .Values.sampleStorage.s3Localstack.service.type }}
  ports:
  - port: {{ .Values.sampleStorage.s3Localstack.service.port }}
    targetPort: edge
    protocol: TCP
    name: edge
  selector:
    app: localstack-s3
{{- end }}

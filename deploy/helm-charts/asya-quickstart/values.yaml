# Asya Quickstart - Full demo package showing Asya🎭 in action
# This chart deploys a complete Asya environment with sample infrastructure
#
# QUICKSTART (LOCAL): Uses sample infrastructure (LocalStack, sample PostgreSQL)
# PRODUCTION: Disable sample infrastructure, configure external services below

# Global settings
global:
  # Transport type: sqs, rabbitmq, or any other supported transport
  transport: sqs

  # Storage type: s3, minio
  storage: s3

  # Profile: local (with sample infra) or production (cloud services)
  # - local: Enables sample infrastructure deployments
  # - production: User must configure external services (see comments below)
  profile: local

# Note: All components are installed in the release namespace
# For production, consider installing operator separately in asya-system
# and the quickstart (gateway + actors) in a dedicated namespace

# Component toggles
operator:
  enabled: true

crew:
  enabled: true

gateway:
  enabled: true

# Test hello-world actor
helloActor:
  enabled: true
  name: hello
  image:
    repository: python
    tag: "3.13-slim"
  handler: "hello_handler.process"
  handlerMode: "payload"
  scaling:
    minReplicas: 0
    maxReplicas: 10
    queueLength: 5
    pollingInterval: 30
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Sample infrastructure for demos/testing
# WARNING: Sample infrastructure is for demos only, use cloud services in production
#
# To use external/managed services:
# 1. Set sampleTransports.*.enabled: false (disable sample deployments)
# 2. Set sampleStorages.*.enabled: false (disable sample deployments)
# 3. Set postgresql.enabled: false (disable sample PostgreSQL)
# 4. Configure external endpoints in asya-operator.transports.*.config
# 5. Configure external endpoints in asya-crew.storage.*
# 6. Configure external database in asya-gateway.externalDatabase
#
sampleTransports:
  # LocalStack for SQS (demo only)
  # For production: Set enabled: false and configure asya-operator.transports.sqs.config below
  sqsLocalstack:
    enabled: true
    image:
      repository: localstack/localstack
      tag: "3.1"
    service:
      type: ClusterIP
      port: 4566
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # RabbitMQ (demo only)
  # For production: Set enabled: false and configure asya-operator.transports.rabbitmq.config below
  rabbitmq:
    enabled: false
    image:
      repository: rabbitmq
      tag: "3.13-management"
    service:
      type: ClusterIP
      amqpPort: 5672
      managementPort: 15672
    auth:
      username: guest
      password: guest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

sampleStorages:
  # LocalStack for S3 (demo only)
  # For production: Set enabled: false and configure asya-crew.storage.s3 below
  s3Localstack:
    enabled: true
    image:
      repository: localstack/localstack
      tag: "3.1"
    service:
      type: ClusterIP
      port: 4566
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # MinIO (demo only)
  # For production: Set enabled: false and configure asya-crew.storage.minio below
  minio:
    enabled: false
    image:
      repository: minio/minio
      tag: "latest"
    service:
      type: ClusterIP
      apiPort: 9000
      consolePort: 9001
    auth:
      rootUser: minioadmin
      rootPassword: minioadmin
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# PostgreSQL for gateway (required infrastructure)
# Sample deployment for demos - for production, set enabled: false
# and configure asya-gateway.externalDatabase below
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  service:
    type: ClusterIP
    port: 5432
  auth:
    database: asya_gateway
    username: asya
    password: asya-db-password
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Operator configuration (passed to asya-operator chart)
asya-operator:
  replicaCount: 1
  image:
    repository: ghcr.io/deliveryhero/asya-operator
    tag: "latest"
  logLevel: info
  controller:
    maxConcurrentReconciles: 50
    queueHealthCheckInterval: "5m"
  sidecar:
    image: ghcr.io/deliveryhero/asya-sidecar
    tag: "latest"
  # Transport configurations (will be configured based on global.transport)
  # Note: These should be enabled/disabled based on global.transport in practice
  transports:
    # RabbitMQ transport configuration
    # For external RabbitMQ: Update host/port/credentials, disable sampleTransports.rabbitmq
    rabbitmq:
      enabled: false
      type: rabbitmq
      config:
        host: rabbitmq # Change to external RabbitMQ host for production
        port: 5672
        username: guest
        passwordSecretRef:
          name: rabbitmq-secret
          key: password
    # SQS transport configuration
    # For AWS SQS: Set endpoint: "", update accountId, disable sampleTransports.sqsLocalstack
    sqs:
      enabled: false
      type: sqs
      config:
        region: us-east-1
        accountId: "000000000000" # Change to real AWS account ID for production
        endpoint: http://localstack-sqs:4566 # Set to "" for AWS SQS
        visibilityTimeout: 300
        waitTimeSeconds: 20

# Crew configuration (passed to asya-crew chart)
asya-crew:
  image:
    repository: ghcr.io/deliveryhero/asya-crew
    tag: "latest"
  # Storage configurations (will be configured based on global.storage)
  storage:
    # S3 storage configuration
    # For AWS S3: Set endpoint: "", update credentials, disable sampleStorages.s3Localstack
    s3:
      endpoint: http://localstack-s3:4566 # Set to "" for AWS S3
      bucket: asya-results
      region: us-east-1
      accessKeyId: test # Use IAM roles or real credentials for production
      secretAccessKey: test # Use IAM roles or real credentials for production
      forcePathStyle: true # Set to false for AWS S3
    # MinIO storage configuration
    # For external MinIO: Update endpoint/credentials, disable sampleStorages.minio
    minio:
      endpoint: http://minio:9000 # Change to external MinIO endpoint for production
      bucket: asya-results
      accessKeyId: minioadmin # Change to real credentials for production
      secretAccessKey: minioadmin # Change to real credentials for production
      forcePathStyle: true

# Gateway configuration (passed to asya-gateway chart)
asya-gateway:
  replicaCount: 1
  image:
    repository: ghcr.io/deliveryhero/asya-gateway
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  config:
    port: "8080"
    rabbitmqURL: ""
    sqsEndpoint: ""
    sqsRegion: ""
  # Gateway routes configuration
  routes:
    createConfigMap: true
    defaults:
      progress: true
      timeout: 30
    tools:
    - name: hello
      description: "Test hello-world actor"
      parameters:
        name:
          type: string
          required: true
          description: "Name to greet"
      route: ["hello"]
  # PostgreSQL connection
  # Uses bundled PostgreSQL by default (asya-gateway-postgresql service)
  # For external PostgreSQL: Set postgresql.enabled: false and configure externalDatabase below
  postgresql:
    enabled: false # Gateway chart's own PostgreSQL (kept disabled, using quickstart's PostgreSQL)
  externalDatabase:
    host: asya-gateway-postgresql # Change to external PostgreSQL host for production
    port: 5432
    database: asya_gateway
    username: asya
    password: asya-db-password # Use Kubernetes secrets for production

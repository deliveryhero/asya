# Asya Quickstart - Full demo package showing Asya in action
# This chart deploys a complete Asya environment with sample infrastructure
#
# QUICKSTART (LOCAL): Uses sample infrastructure (LocalStack, sample PostgreSQL)
# PRODUCTION: Disable sample infrastructure, configure external services below

# Global settings
global:
  # Transport type: sqs, rabbitmq, or any other supported transport
  transport: sqs

  # Storage type: s3, minio
  storage: s3

  # Profile: local (with sample infra) or production (cloud services)
  # - local: Enables sample infrastructure deployments
  # - production: User must configure external services (see comments below)
  profile: local

# Namespace configuration
# By default, all components deploy to the release namespace
# Override these to separate concerns across namespaces
#
# Example with namespace separation:
#   kubectl create namespace monitoring
#   kubectl create namespace asya-infra
#   helm install asya . -n asya-demo --create-namespace \
#     --set namespaces.monitoring=monitoring \
#     --set namespaces.infra=asya-infra \
#     --set kube-prometheus-stack.namespaceOverride=monitoring
#
# This deploys:
#   - asya-demo: Gateway, Crew, Actors
#   - monitoring: Prometheus, Grafana, dashboards, PodMonitors
#   - asya-infra: LocalStack SQS, S3, MinIO, PostgreSQL
namespaces:
  # Namespace for monitoring resources (dashboard ConfigMap, PodMonitor)
  # Note: To deploy Prometheus/Grafana here, also set kube-prometheus-stack.namespaceOverride
  monitoring: ""
  # Namespace for sample infrastructure (LocalStack, MinIO, PostgreSQL)
  infra: ""

# Component toggles
enableAsyaCrew: false
enableAsyaGateway: false

# Test hello-world actor
helloActor:
  enabled: false
  name: hello
  image:
    repository: python
    tag: "3.13-slim"
  handler: "hello_handler.process"
  scaling:
    minReplicaCount: 0
    maxReplicaCount: 10
    queueLength: 5
    pollingInterval: 30
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Sample infrastructure for demos/testing
# WARNING: Sample infrastructure is for demos only, use cloud services in production
#
# To use external/managed services:
# 1. Set sampleTransport.*.enabled: false (disable sample deployments)
# 2. Set sampleStorage.*.enabled: false (disable sample deployments)
# 3. Set sampleGatewayDb.postgresql.enabled: false (disable sample PostgreSQL)
# 4. Configure external endpoints in asya-crossplane.awsProviderConfig
# 5. Configure external endpoints in asya-crew.storage.*
# 6. Configure external database in asya-gateway.externalDatabase
#
sampleTransport:
  # LocalStack for SQS (demo only)
  # For production: Set enabled: false and configure asya-crossplane.awsProviderConfig below
  sqsLocalstack:
    enabled: true
    image:
      repository: localstack/localstack
      tag: "3.1"
    service:
      type: ClusterIP
      port: 4566
    auth:
      accessKeyId: "test"
      secretAccessKey: "test"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # RabbitMQ (demo only)
  # For production: Set enabled: false and configure transport settings below
  rabbitmq:
    enabled: false
    image:
      repository: rabbitmq
      tag: "3.13-management"
    service:
      type: ClusterIP
      amqpPort: 5672
      managementPort: 15672
    auth:
      username: guest
      password: guest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

sampleStorage:
  # LocalStack for S3 (demo only)
  # For production: Set enabled: false and configure asya-crew.storage.s3 below
  s3Localstack:
    enabled: true
    image:
      repository: localstack/localstack
      tag: "3.1"
    service:
      type: ClusterIP
      port: 4566
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # MinIO (demo only)
  # For production: Set enabled: false and configure asya-crew.storage.minio below
  minio:
    enabled: false
    image:
      repository: minio/minio
      tag: "latest"
    service:
      type: ClusterIP
      apiPort: 9000
      consolePort: 9001
    auth:
      rootUser: minioadmin
      rootPassword: minioadmin
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

sampleMonitoring:
  # Prometheus + Grafana stack (demo/development only)
  # For production: Set enabled: false and use your existing monitoring infrastructure
  # When enabled, deploys kube-prometheus-stack with pre-configured Asya dashboards
  enabled: false

sampleTracing:
  # Grafana Tempo tracing backend (demo/development only)
  # For production: Set enabled: false and use your existing tracing infrastructure
  # When enabled, deploys Tempo with OTLP receivers for trace ingestion
  enabled: false

sampleLogging:
  # Loki + Promtail log aggregation (demo/development only)
  # For production: Set enabled: false and use your existing logging infrastructure
  # When enabled, deploys Loki single-binary + Promtail DaemonSet
  enabled: false

sampleGatewayDb:
  # PostgreSQL for gateway (sample deployment)
  # For production: Set enabled: false and configure asya-gateway.externalDatabase below
  postgresql:
    enabled: false
    image:
      repository: postgres
      tag: "15-alpine"
    service:
      type: ClusterIP
      port: 5432
    auth:
      database: asya_gateway
      username: asya
      password: asya-db-password
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Asya-Crossplane configuration (passed to asya-crossplane chart)
# Manages AsyncActor CRDs, Compositions, and Crossplane providers
asya-crossplane:
  providers:
    aws:
      enabled: true
  providerConfigs:
    install: false # Set to true after Crossplane providers are healthy (two-step install)
  awsProviderConfig:
    name: localstack
    credentialsSource: Secret
    secretRef:
      namespace: "" # empty = use release namespace (where playground and crossplane are deployed)
      name: aws-creds
      key: credentials
    endpoint:
      # localstackEnabled auto-computes http://localstack-sqs.{release_namespace}:4566
      localstackEnabled: true
      hostnameImmutable: true
    skipCredentialsValidation: true
    skipMetadataApiCheck: true
    skipRequestingAccountId: true
    skipRegionValidation: true
    s3UsePathStyle: true
  awsRegion: us-east-1
  awsAccountId: "000000000000"
  actorNamespace: "" # defaults to release namespace
  functions:
    flavorsEnabled: false # function-asya-flavors not yet published; disable for quickstart
  irsa:
    enabled: false
  keda:
    authProvider: secret
    secretRef:
      name: aws-creds
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  sidecar:
    sqsLocalstackEnabled: true

# Crew configuration (passed to asya-crew chart)
# Uncomment and modify values below to override chart defaults
asya-crew:
  # Tracing configuration
  # When sampleTracing.enabled: true, set this to point to Tempo's OTLP gRPC endpoint
  # Format: {release-name}-tempo:4317 (no http:// — gRPC uses bare host:port)
  # Example: If release name is 'asya', use 'asya-tempo:4317'
  tracing:
    endpoint: "" # Set to "{release-name}-tempo:4317" when sampleTracing.enabled: true

  # image:
  #   repository: ghcr.io/deliveryhero/asya-crew
  #   tag: "latest"

  x-sink:
    sidecar:
      env:
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_REGION
        value: "us-east-1"

  x-sump:
    sidecar:
      env:
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_REGION
        value: "us-east-1"

  # DLQ Worker - processes transport-level Dead Letter Queue messages
  # Enabled by default in stdout mode (no S3 persistence)
  # Set config.queueURL to activate the deployment
  dlq-worker:
    enabled: true
    config:
      # Set this to the DLQ queue URL when DLQ redrive policies are configured
      # Example for LocalStack: http://localstack-sqs:4566/000000000000/asya-{namespace}-x-dlq
      queueURL: ""
      transport: sqs
      region: us-east-1
      # stdout mode by default (no S3 bucket configured)
      s3Bucket: ""
      s3Endpoint: ""
    env:
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

  # Storage configurations (ACTIVELY USED - configure for your environment)
  # These will be enabled/disabled based on global.storage
  storage:
    # S3 storage configuration
    # For AWS S3: Set endpoint: "", update credentials, disable sampleStorage.s3Localstack
    s3:
      endpoint: http://s3-localstack:4566
      bucket: asya-results
      region: us-east-1
      accessKeyId: test
      secretAccessKey: test
      forcePathStyle: true

    # MinIO storage configuration
    # For external MinIO: Update endpoint/credentials, disable sampleStorage.minio
    minio:
      endpoint: http://minio:9000
      bucket: asya-results
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      forcePathStyle: true

# Gateway configuration (passed to asya-gateway chart)
# Uncomment and modify values below to override chart defaults
asya-gateway:
  # Tracing configuration
  # When sampleTracing.enabled: true, set this to point to Tempo's OTLP gRPC endpoint
  # Format: {release-name}-tempo:4317 (no http:// — gRPC uses bare host:port)
  # Example: If release name is 'asya', use 'asya-tempo:4317'
  tracing:
    endpoint: "" # Set to "{release-name}-tempo:4317" when sampleTracing.enabled: true

  # replicaCount: 1
  # image:
  #   repository: ghcr.io/deliveryhero/asya-gateway
  #   tag: "latest"
  # service:
  #   type: ClusterIP
  #   port: 80
  # config:
  #   port: "8080"
  #   rabbitmqURL: ""
  #   sqsEndpoint: ""
  #   sqsRegion: ""

  # PostgreSQL connection (ACTIVELY USED - configure database)
  # Uses bundled PostgreSQL by default (asya-gateway-postgresql service)
  # For external PostgreSQL: Set sampleGatewayDb.postgresql.enabled: false and configure externalDatabase below
  externalDatabase:
    host: asya-gateway-postgresql
    port: 5432
    database: asya_gateway
    username: asya
    password: asya-db-password

# Grafana Tempo configuration (passed to tempo chart)
# Only used when sampleTracing.enabled: true
# Configured for single-binary mode with local storage and OTLP receivers
tempo:
  # Use single replica for local development
  replicas: 1

  # Reduce resource usage for local development
  tempo:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Minimal retention for demos
    retention: 24h

    # Enable metrics generator to correlate traces with metrics
    # NOTE: remoteWriteUrl must match kube-prometheus-stack.fullnameOverride
    # (currently "asya-monitoring") suffixed with "-prometheus"
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://asya-monitoring-prometheus:9090/api/v1/write"
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
          enable_messaging_system_latency_histogram: true
          enable_virtual_node_label: true
        span_metrics:
          enable_target_info: true

    overrides:
      defaults:
        metrics_generator:
          processors:
          - service-graphs
          - span-metrics

    # OTLP receivers are enabled by default
    # Receivers listen on:
    #   - 4317: OTLP gRPC
    #   - 4318: OTLP HTTP
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_binary:
            endpoint: 0.0.0.0:6832
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_http:
            endpoint: 0.0.0.0:14268
      opencensus: {}
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    # Local storage backend for demos
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces

  # Use local storage
  persistence:
    enabled: false

# Prometheus + Grafana configuration (passed to kube-prometheus-stack chart)
# Only used when sampleMonitoring.enabled: true
# Minimal configuration optimized for local development
#
# To deploy monitoring in a separate namespace, set:
#   kube-prometheus-stack.namespaceOverride: monitoring
# Note: The namespace must exist before install
kube-prometheus-stack:
  # Override namespace for monitoring stack (default: release namespace)
  # Set to "monitoring" to deploy in dedicated namespace
  namespaceOverride: ""
  # Shorten default names (default: kube-prometheus-stack)
  fullnameOverride: asya-monitoring
  cleanPrometheusOperatorObjectNames: true

  # Prometheus configuration
  prometheus:
    prometheusSpec:
      # Scrape all ServiceMonitors in all namespaces
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      # Reduce resource usage for local development
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Minimal retention for demos
      retention: 24h
      retentionSize: 1GB

  # Grafana configuration
  grafana:
    # Admin credentials for local development
    adminPassword: asya-admin
    # Sidecar for auto-discovering dashboards and datasources from ConfigMaps
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL
    # Reduce resource usage
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Disable components not needed for Asya demos
  alertmanager:
    enabled: false
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

# Loki configuration (passed to loki chart)
# Only used when sampleLogging.enabled: true
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    useTestSchema: true
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
    persistence:
      size: 5Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false
  test:
    enabled: false
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# Promtail configuration (passed to promtail chart)
# Only used when sampleLogging.enabled: true
# NOTE: Update promtail.config.clients[0].url if using a non-default release name
promtail:
  config:
    clients:
    - url: http://asya-loki:3100/loki/api/v1/push

# Testing actors with chaos/failure modes
# These actors simulate various production scenarios for testing autoscaling and resilience
testingActors:
  enabled: false
  image:
    repository: python
    tag: "3.13-slim"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  scaling:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
    pollingInterval: 15
    queueLength: 5
  slow:
    minDelay: "0.1"
    maxDelay: "2.0"
  flaky:
    errorRate: "0.2"
  cpu:
    iterations: "500000"
  fanout:
    count: "3"


# k6 Load Testing (CNCF-native, uses standard grafana/k6 image)
k6LoadTests:
  enabled: false

  image:
    repository: grafana/k6
    tag: "0.54.0"

  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  prometheusUrl: "http://asya-kube-prometheus-stack-prometheus:9090/api/v1/write"

  sqs:
    enabled: true
    endpoint: "http://localstack-sqs:4566"
    awsRegion: "us-east-1"
    awsAccessKeyId: "testlocalstackkey123"
    awsSecretAccessKey: "testlocalstacksecret123456"

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

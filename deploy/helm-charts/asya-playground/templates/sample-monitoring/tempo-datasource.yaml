{{- if and .Values.sampleTracing.enabled .Values.sampleMonitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
    {{- include "asya-playground.labels" . | nindent 4 }}
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      url: http://{{ .Release.Name }}-tempo:3200
      access: proxy
      isDefault: false
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus
        tracesToLogs:
          datasourceUid: ""
{{- end }}

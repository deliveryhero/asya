{{- if and .Values.sampleLogging.enabled .Values.sampleMonitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
    {{- include "asya-playground.labels" . | nindent 4 }}
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      url: http://{{ .Release.Name }}-loki:3100
      access: proxy
      isDefault: false
{{- end }}

{{- if and .Values.sampleTransports.rabbitmq.enabled (eq .Values.global.transport "rabbitmq") }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ .Values.sampleTransports.rabbitmq.auth.password | quote }}
{{- end }}

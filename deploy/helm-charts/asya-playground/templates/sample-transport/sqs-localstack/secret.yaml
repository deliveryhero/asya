{{- if and .Values.sampleTransport.sqsLocalstack.enabled (eq .Values.global.transport "sqs") }}
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: {{ .Release.Namespace }}
  labels:
    app: localstack-sqs
    app.kubernetes.io/name: aws-creds
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-transport
type: Opaque
stringData:
  # INI format for Crossplane AWS ProviderConfig secretRef
  credentials: |
    [default]
    aws_access_key_id = {{ .Values.sampleTransport.sqsLocalstack.auth.accessKeyId }}
    aws_secret_access_key = {{ .Values.sampleTransport.sqsLocalstack.auth.secretAccessKey }}
  # Key-value format for KEDA TriggerAuthentication secretTargetRef
  AWS_ACCESS_KEY_ID: {{ .Values.sampleTransport.sqsLocalstack.auth.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.sampleTransport.sqsLocalstack.auth.secretAccessKey | quote }}
{{- end }}

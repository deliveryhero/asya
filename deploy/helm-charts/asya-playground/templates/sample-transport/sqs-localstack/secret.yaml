{{- if and .Values.sampleTransport.sqsLocalstack.enabled (eq .Values.global.transport "sqs") }}
apiVersion: v1
kind: Secret
metadata:
  name: sqs-credentials
  namespace: {{ include "asya-playground.namespace.infra" . }}
  labels:
    app: localstack-sqs
    app.kubernetes.io/name: sqs-credentials
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-transport
type: Opaque
stringData:
  access-key-id: {{ .Values.sampleTransport.sqsLocalstack.auth.accessKeyId | default "test" | quote }}
  secret-access-key: {{ .Values.sampleTransport.sqsLocalstack.auth.secretAccessKey | default "test" | quote }}
{{- end }}

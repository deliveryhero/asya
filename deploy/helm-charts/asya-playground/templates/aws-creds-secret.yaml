{{- if .Values.sampleAwsCreds.enabled }}
# Sample AWS credentials for LocalStack (quickstart only)
# Contains all three formats needed by Crossplane ProviderConfig and KEDA TriggerAuthentication
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sampleAwsCreds.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  # INI format for Crossplane AWS ProviderConfig secretRef
  credentials: |
    [default]
    aws_access_key_id = {{ .Values.sampleAwsCreds.accessKeyId }}
    aws_secret_access_key = {{ .Values.sampleAwsCreds.secretAccessKey }}
  # Key-value format for KEDA TriggerAuthentication secretTargetRef
  AWS_ACCESS_KEY_ID: {{ .Values.sampleAwsCreds.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.sampleAwsCreds.secretAccessKey | quote }}
{{- end }}

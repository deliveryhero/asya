{{- if .Values.testingActors.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: asya-load-generator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: {{ .Values.loadGenerator.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.loadGenerator.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: locust
        image: {{ .Values.loadGenerator.image.repository }}:{{ .Values.loadGenerator.image.tag }}
        command:
        - sh
        - -c
        - |
          set -e
          echo "[+] Installing dependencies..."
          pip install --no-cache-dir -r /config/requirements.txt

          echo "[+] Starting Locust load test..."
          locust \
            --headless \
            --users {{ .Values.loadGenerator.users }} \
            --spawn-rate {{ .Values.loadGenerator.spawnRate }} \
            --run-time {{ .Values.loadGenerator.runTime }} \
            --locustfile /config/locustfile.py \
            --host http://dummy \
            --html /tmp/report.html \
            --csv /tmp/stats

          echo "[+] Load test complete!"
          echo "[+] Statistics:"
          cat /tmp/stats_stats.csv || true

          echo "[+] Keeping container alive for log inspection ({{ .Values.loadGenerator.keepAliveSeconds }}s)..."
          sleep {{ .Values.loadGenerator.keepAliveSeconds }}
        env:
        - name: SQS_ENDPOINT
          value: {{ .Values.loadGenerator.sqsEndpoint | quote }}
        - name: AWS_REGION
          value: {{ .Values.loadGenerator.awsRegion | quote }}
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.loadGenerator.awsAccessKeyId | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.loadGenerator.awsSecretAccessKey | quote }}
        - name: ASYA_NAMESPACE
          value: {{ .Release.Namespace }}
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          {{- toYaml .Values.loadGenerator.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: load-generator-scripts
{{- end }}

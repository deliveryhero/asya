{{- if .Values.testingActors.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: load-generator-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  locustfile.py: |
    """Locust-based load generator for Asya actors with various patterns"""
    import json
    import os
    import random
    import time
    import uuid
    from typing import Any, Dict

    import boto3
    from locust import User, task, between, events
    from locust.exception import StopUser


    class AsyaMessageSender(User):
        """Base class for sending messages to Asya actors via SQS"""
        wait_time = between(0.1, 2.0)
        abstract = True

        def __init__(self, *args, **kwargs):
            super().__init__(*args, **kwargs)
            self.sqs_client = boto3.client(
                "sqs",
                endpoint_url=os.getenv("SQS_ENDPOINT", "http://localstack-sqs:4566"),
                region_name=os.getenv("AWS_REGION", "us-east-1"),
                aws_access_key_id=os.getenv("AWS_ACCESS_KEY_ID", "test"),
                aws_secret_access_key=os.getenv("AWS_SECRET_ACCESS_KEY", "test"),
            )
            self.namespace = os.getenv("ASYA_NAMESPACE", "asya-demo")
            self.queue_cache = {}

        def get_queue_url(self, actor_name: str) -> str:
            """Get or cache queue URL for an actor"""
            queue_name = f"asya-{self.namespace}-{actor_name}"
            if queue_name not in self.queue_cache:
                response = self.sqs_client.get_queue_url(QueueName=queue_name)
                self.queue_cache[queue_name] = response["QueueUrl"]
            return self.queue_cache[queue_name]

        def send_message(
            self,
            actor: str,
            payload: Dict[str, Any],
            route: list = None,
            name: str = None,
        ):
            """Send a message to an actor queue"""
            envelope_id = str(uuid.uuid4())
            envelope = {
                "id": envelope_id,
                "route": {"actors": route or [actor], "current": 0},
                "payload": payload,
            }

            start_time = time.time()
            try:
                queue_url = self.get_queue_url(actor)
                self.sqs_client.send_message(
                    QueueUrl=queue_url, MessageBody=json.dumps(envelope)
                )
                elapsed = (time.time() - start_time) * 1000
                events.request.fire(
                    request_type="SQS",
                    name=name or f"send_to_{actor}",
                    response_time=elapsed,
                    response_length=len(json.dumps(envelope)),
                    exception=None,
                    context={},
                )
            except Exception as e:
                elapsed = (time.time() - start_time) * 1000
                events.request.fire(
                    request_type="SQS",
                    name=name or f"send_to_{actor}",
                    response_time=elapsed,
                    response_length=0,
                    exception=e,
                    context={},
                )


    class SteadyLoadUser(AsyaMessageSender):
        """Steady constant load to all actors"""
        weight = 3

        @task(3)
        def send_to_slow(self):
            self.send_message("chaos-slow", {"test": "steady", "value": random.randint(1, 100)})

        @task(2)
        def send_to_flaky(self):
            self.send_message("chaos-flaky", {"test": "steady", "value": random.randint(1, 100)})

        @task(1)
        def send_to_cpu(self):
            self.send_message("chaos-cpu", {"test": "steady", "value": random.randint(1, 100)})


    class BurstLoadUser(AsyaMessageSender):
        """Burst pattern - rapid fire then pause"""
        weight = 2
        wait_time = between(5, 10)

        @task
        def burst_messages(self):
            burst_size = random.randint(10, 50)
            actor = random.choice(["chaos-slow", "chaos-flaky", "chaos-cpu"])

            for i in range(burst_size):
                self.send_message(
                    actor,
                    {"test": "burst", "item": i, "total": burst_size},
                    name=f"burst_to_{actor}",
                )


    class PipelineUser(AsyaMessageSender):
        """Send messages through multi-actor pipelines"""
        weight = 2

        @task
        def simple_pipeline(self):
            route = ["chaos-slow", "chaos-cpu"]
            self.send_message(
                "chaos-slow",
                {"test": "pipeline", "pipeline_id": str(uuid.uuid4())},
                route=route,
                name="pipeline_slow_cpu",
            )

        @task
        def complex_pipeline(self):
            route = ["chaos-slow", "chaos-flaky", "chaos-cpu"]
            self.send_message(
                "chaos-slow",
                {"test": "pipeline", "pipeline_id": str(uuid.uuid4())},
                route=route,
                name="pipeline_slow_flaky_cpu",
            )


    class FanoutUser(AsyaMessageSender):
        """Test fanout patterns"""
        weight = 1
        wait_time = between(2, 5)

        @task
        def fanout_test(self):
            self.send_message(
                "chaos-fanout",
                {"test": "fanout", "fanout_id": str(uuid.uuid4())},
            )


    class PriorityUser(AsyaMessageSender):
        """Send messages with different priorities"""
        weight = 1

        @task(3)
        def normal_priority(self):
            self.send_message(
                random.choice(["chaos-slow", "chaos-cpu"]),
                {"test": "priority", "priority": "normal"},
                name="priority_normal",
            )

        @task(1)
        def high_priority(self):
            self.send_message(
                random.choice(["chaos-slow", "chaos-cpu"]),
                {"test": "priority", "priority": "high"},
                name="priority_high",
            )

  requirements.txt: |
    locust>=2.20.0
    boto3>=1.34.0
{{- end }}

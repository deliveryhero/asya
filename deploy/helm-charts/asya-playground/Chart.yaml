apiVersion: v2
name: asya-playground
description: Demo package for local development and testing with Asya. NOT for production use.
type: application
# versions are replaced by automatically .github/workflows/release.yml
version: 0.0.0
appVersion: "0.0.0"
keywords:
- asya
- actor
- operator
- gateway
- demo
- quickstart
maintainers:
- name: Asya Team

# Remote dependencies (from published Helm repository)
dependencies:
- name: asya-operator
  version: ">=0.4.0"
  repository: "https://asya.sh/charts"
- name: asya-crew
  version: ">=0.4.0"
  repository: "https://asya.sh/charts"
  condition: crew.enabled
- name: asya-gateway
  version: ">=0.4.0"
  repository: "https://asya.sh/charts"
  condition: gateway.enabled

apiVersion: v2
name: asya-playground
description: Full demo package showing Asya🎭 in action with sample actors, flows, and load testing
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
- asya
- actor
- operator
- gateway
- demo
- quickstart
maintainers:
- name: Asya Team

dependencies:
- name: asya-operator
  version: ">=0.1.0"
  repository: "https://asya.sh/charts"
- name: asya-crew
  version: ">=0.4.0"
  repository: "https://asya.sh/charts"
  condition: asya-crew.enabled
- name: asya-gateway
  version: ">=0.1.0"
  repository: "https://asya.sh/charts"
  condition: asya-gateway.enabled

apiVersion: v2
name: asya-playground
description: Demo package for local development and testing with Asya. NOT for production use.
type: application
# versions are replaced automatically by .github/workflows/release.yml
version: 0.0.0
appVersion: "0.0.0"
keywords:
- asya
- actor
- crossplane
- gateway
- demo
- quickstart
maintainers:
- name: Asya Team

# Remote dependencies (from published Helm repositories)
# Prerequisites (install separately before this chart):
#   - Crossplane operator: helm install crossplane crossplane-stable/crossplane -n crossplane-system
#   - KEDA: helm install keda kedacore/keda -n keda
dependencies:
- name: asya-crossplane
  version: ">=0.1.0"
  repository: "file://../asya-crossplane"
- name: asya-crew
  version: ">=0.0.0"
  repository: "file://../asya-crew"
  condition: enableAsyaCrew
- name: asya-gateway
  version: ">=0.0.0"
  repository: "file://../asya-gateway"
  condition: enableAsyaGateway
# Optional: Prometheus + Grafana monitoring stack
- name: kube-prometheus-stack
  version: ">=65.0.0"
  repository: "https://prometheus-community.github.io/helm-charts"
  condition: sampleMonitoring.enabled

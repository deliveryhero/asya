# asya-playground values for GKE + GCP Pub/Sub
# Transport: native GCP Pub/Sub (no LocalStack)
# Auth: GKE Workload Identity for Crossplane + actor pods; JSON key for KEDA
#
# Required overrides at install time (via --set or -f):
#   asya-crossplane.gcpProviderConfig.projectId=<project>
#   asya-crossplane.sidecar.gcpProjectId=<project>
#   asya-gateway.transports.pubsub.config.projectId=<project>

global:
  transport: pubsub
  profile: production

# Disable all sample in-cluster transport/storage infrastructure
sampleTransport:
  sqsLocalstack:
    enabled: false
  rabbitmq:
    enabled: false

sampleStorage:
  s3Localstack:
    enabled: false
  minio:
    enabled: false

enableAsyaCrew: true
enableAsyaGateway: true

# Monitoring: enable for observability dashboards
sampleMonitoring:
  enabled: true

# Lightweight in-cluster PostgreSQL for gateway — no Cloud SQL needed for a demo
sampleGatewayDb:
  postgresql:
    enabled: true

# ---------------------------------------------------------------------------
# Crossplane: GCP Pub/Sub provider, Workload Identity, no AWS provider
# ---------------------------------------------------------------------------
asya-crossplane:
  # Step 1: set to false; bump to true after providers are Healthy (Phase 7)
  providerConfigs:
    install: false

  providers:
    aws:
      enabled: false
    gcp:
      enabled: true
      pubsubVersion: "v2.5.0"

  gcpProviderConfig:
    name: default
    projectId: "" # override at install time
    # Secret = JSON key in crossplane-system/gcp-creds
    credentialsSource: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: credentials.json

  sidecar:
    gcpProjectId: "" # override at install time
    gcpCredsSecret: "asya-actor-creds"
    # Base URL (no /mesh suffix) — sidecar reporter appends /health, /mesh, /mesh/{id}/final
    gatewayURL: "http://asya-gateway-mesh.asya-demo.svc.cluster.local"

  functions:
    flavorsEnabled: true

  irsa:
    enabled: false

  # KEDA uses a JSON key Secret (GCP Pub/Sub TriggerAuthentication does not yet
  # support Workload Identity natively via TriggerAuthentication resource)
  keda:
    authProvider: secret

  pubsub:
    keda:
      secretRef:
        name: gcp-keda-secret
        credentialsKey: credentials.json

# ---------------------------------------------------------------------------
# Crew: pubsub transport, use asya-actor KSA (bound via Workload Identity)
# ---------------------------------------------------------------------------
asya-crew:
  x-sink: {}
  x-sump: {}

  dlq-worker:
    enabled: false

# ---------------------------------------------------------------------------
# Gateway: LoadBalancer, in-cluster PostgreSQL, Pub/Sub transport
# ---------------------------------------------------------------------------
asya-gateway:
  replicaCount: 1
  service:
    type: LoadBalancer

  transports:
    pubsub:
      enabled: true
      config:
        projectId: "" # override at install time

  externalDatabase:
    host: asya-demo-asya-gateway-postgresql
    port: 5432
    database: asya_gateway
    username: asya
    existingSecret: asya-gateway-postgresql
    existingSecretKey: password

# ---------------------------------------------------------------------------
# Monitoring: Prometheus + Grafana
# ---------------------------------------------------------------------------
kube-prometheus-stack:
  fullnameOverride: asya-monitoring
  cleanPrometheusOperatorObjectNames: true

  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 7d
      retentionSize: 5GB
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      # Workaround: sidecar containers don't declare containerPort, so PodMonitor
      # can't match by port. Use raw scrape config with relabeling instead.
      additionalScrapeConfigs:
      - job_name: asya-actors
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - asya-demo
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_asya_sh_actor]
          action: keep
          regex: .+
        - source_labels: [__meta_kubernetes_pod_container_name]
          action: keep
          regex: asya-sidecar
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:8080
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_label_asya_sh_actor]
          target_label: actor
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_label_asya_sh_flow]
          target_label: flow
        - source_labels: [__meta_kubernetes_pod_label_asya_sh_role]
          target_label: role
        - source_labels: [__meta_kubernetes_pod_label_asya_sh_generated]
          target_label: generated
        scrape_interval: 15s
        metrics_path: /metrics

  grafana:
    adminPassword: admin
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  alertmanager:
    enabled: false
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

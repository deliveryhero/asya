{{- if .Values.persistence.enabled }}
{{- if and (ne .Values.persistence.backend "s3") (ne .Values.persistence.backend "gcs") }}
{{- fail "persistence.backend must be 's3' or 'gcs'" }}
{{- end }}
{{- if not .Values.persistence.config.bucket }}
{{- fail "persistence.config.bucket is required when persistence.enabled is true" }}
{{- end }}
{{- $connectorImage := printf "%s:%s" .Values.persistence.connector.image.repository (.Values.persistence.connector.image.tag | default .Chart.AppVersion) }}
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: {{ include "asya-crew.persistence.flavorName" . }}
  labels:
    {{- include "asya-crew.persistence.labels" . | nindent 4 }}
    asya.sh/flavor: {{ include "asya-crew.persistence.flavorName" . }}
data:
  stateProxy:
    - name: checkpoints
      mount:
        path: /state/checkpoints
      connector:
        image: {{ $connectorImage }}
        env:
          - name: ASYA_CONNECTOR
            value: {{ if eq .Values.persistence.backend "s3" }}s3_buffered_lww{{ else }}gcs_buffered_lww{{ end }}
          - name: STATE_BUCKET
            value: {{ .Values.persistence.config.bucket | quote }}
          {{- if eq .Values.persistence.backend "s3" }}
          {{- with .Values.persistence.config.endpoint }}
          - name: AWS_ENDPOINT_URL
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.region }}
          - name: AWS_REGION
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.accessKey }}
          - name: AWS_ACCESS_KEY_ID
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.secretKey }}
          - name: AWS_SECRET_ACCESS_KEY
            value: {{ . | quote }}
          {{- end }}
          {{- else if eq .Values.persistence.backend "gcs" }}
          {{- with .Values.persistence.config.project }}
          - name: GCS_PROJECT
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.emulatorHost }}
          - name: STORAGE_EMULATOR_HOST
            value: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- with .Values.persistence.config.query.maxFetchBytes }}
          - name: QUERY_MAX_FETCH_BYTES
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.query.maxFetchKeys }}
          - name: QUERY_MAX_FETCH_KEYS
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.query.maxKeys }}
          - name: QUERY_MAX_KEYS
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.persistence.config.query.maxResultRows }}
          - name: QUERY_MAX_RESULT_ROWS
            value: {{ . | quote }}
          {{- end }}
{{- end }}

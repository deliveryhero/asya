# ProviderConfig installation — requires provider CRDs to be registered first.
# On fresh installs, leave this false, wait for providers to become Healthy,
# then upgrade with providerConfigs.install=true.
providerConfigs:
  install: false
  # Skip CRD existence checks (for offline helm template / GitOps rendering)
  skipCRDCheck: false

# Crossplane provider configuration
providers:
  aws:
    # Enable AWS SQS provider
    enabled: false
    # SQS provider version
    sqsVersion: "v1.19.0"
  gcp:
    # Enable GCP Pub/Sub provider (set to false for non-GCP deployments)
    enabled: false
    # GCP Pub/Sub provider version
    pubsubVersion: "v2.5.0"
  kubernetes:
    # Kubernetes provider version
    version: "v0.17.0"

# Crossplane functions
functions:
  goTemplatingVersion: "v0.11.3"
  patchAndTransformVersion: "v0.8.2"
  autoReadyVersion: "v0.6.0"
  flavorsEnabled: true
  flavorsRepository: "ghcr.io/deliveryhero/function-asya-flavors"
  # flavorsVersion defaults to Chart.AppVersion (set at release time).
  # Override only for pinning to a specific version.
  flavorsVersion: ""
  flavorsPackagePullPolicy: IfNotPresent
  flavorsResources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# AWS ProviderConfig settings
awsProviderConfig:
  # Name of the ProviderConfig
  name: default
  # Credentials source: Secret, InjectedIdentity, or Upbound
  credentialsSource: Secret
  # Secret reference for credentials (when source is Secret)
  secretRef:
    namespace: crossplane-system
    name: aws-creds
    key: credentials
  # Custom endpoint configuration (for LocalStack or other AWS-compatible services)
  endpoint:
    enabled: false
    url: ""
    # Set to true for LocalStack
    hostnameImmutable: true
    # When true, auto-computes endpoint URL as http://localstack-sqs.{release_namespace}:4566
    # Takes precedence over url; implies endpoint.enabled
    localstackEnabled: false
  # Skip validation flags (useful for LocalStack)
  skipCredentialsValidation: false
  skipMetadataApiCheck: false
  skipRequestingAccountId: false
  skipRegionValidation: false
  s3UsePathStyle: false

# Kubernetes ProviderConfig settings
kubernetesProviderConfig:
  name: in-cluster
  credentialsSource: InjectedIdentity

# Default transport for AsyncActors (sets defaultCompositionRef on the XRD)
# Valid values: sqs, rabbitmq, pubsub
transport: sqs

# Default region for AWS resources
awsRegion: us-east-1

# AWS account ID (required for KEDA SQS trigger queue URL)
awsAccountId: "000000000000"

# Namespace where AsyncActors will be created
actorNamespace: "" # defaults to release namespace

# IRSA (IAM Roles for Service Accounts) configuration
irsa:
  # Enable ServiceAccount creation with IRSA annotation
  enabled: false
  # ServiceAccount name (shared per namespace)
  serviceAccountName: asya-actors
  # IAM role ARN pattern - {namespace} will be replaced with actual namespace
  # For production, set this to your actual IAM role ARN pattern
  roleArnPattern: "arn:aws:iam::ACCOUNT_ID:role/asya-actors-{namespace}"

# Runtime ConfigMap provisioning
runtime:
  # Create asya-runtime ConfigMap in actor namespace
  enabled: true

# Sidecar injection configuration for actor pods
sidecar:
  # Sidecar container image
  image: "ghcr.io/deliveryhero/asya-sidecar:latest"
  # Pull policy for the sidecar image
  imagePullPolicy: "IfNotPresent"
  # Unix socket directory shared between runtime and sidecar
  socketDir: "/var/run/asya"
  # Mount path for asya_runtime.py inside the runtime container
  runtimeMountPath: "/opt/asya/asya_runtime.py"
  # Name of the ConfigMap containing asya_runtime.py
  runtimeConfigMap: "asya-runtime"
  # AWS credentials secret name to inject into sidecar (for non-IRSA environments)
  awsCredsSecret: ""
  # Auto-compute SQS endpoint as http://localstack-sqs.{namespace}:4566
  sqsLocalstackEnabled: false
  # Custom SQS endpoint (for LocalStack or other AWS-compatible services)
  sqsEndpoint: ""
  # SQS long-polling wait time override (seconds)
  sqsWaitTimeSeconds: ""
  # RabbitMQ AMQP connection URL
  rabbitmqURL: ""
  # RabbitMQ credentials secret name (username and password for AMQP connection)
  rabbitmqCredsSecret: ""
  # Custom Pub/Sub endpoint (for emulator)
  pubsubEndpoint: ""
  # GCP credentials secret name (service account JSON key for Pub/Sub access)
  gcpCredsSecret: ""
  # AWS region for SQS queue access (cluster-wide)
  awsRegion: "us-east-1"
  # GCP project ID for Pub/Sub access (cluster-wide)
  gcpProjectId: ""
  # OTLP endpoint for distributed tracing (leave empty to disable)
  # grpc (default): host:port — e.g. tempo:4317
  # http:           full URL  — e.g. http://tempo:4318
  tracingEndpoint: ""
  # OTLP transport protocol. Leave empty for gRPC (default). Set "http" for HTTP/protobuf.
  tracingProtocol: ""

# KEDA authentication configuration (SQS)
keda:
  # TriggerAuthentication provider type: "podIdentity" or "secret"
  authProvider: podIdentity
  # For secret-based auth, specify the secret reference
  secretRef:
    name: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# AWS resource tags applied to all Crossplane-managed AWS resources (SQS queues).
# Required by DH AWS Organization SCP — resources without dh_app, dh_squad,
# dh_tribe tags are rejected with "explicit deny in service control policy".
awsResourceTags: {}
# dh_app: asya
# dh_squad: my-squad
# dh_tribe: my-tribe

# SQS configuration (used by composition-sqs)
sqs:
  receiveWaitTimeSeconds: 20
  dlq:
    # Max receive attempts before moving message to DLQ
    # Requires awsAccountId to be set and shared DLQ queue to exist (created by asya-crew chart)
    maxReceiveCount: 3

# RabbitMQ configuration (used by composition-rabbitmq)
rabbitmq:
  host: "rabbitmq.default.svc.cluster.local"
  port: 5672
  keda:
    secretRef:
      name: "rabbitmq-keda-secret"
      hostKey: "host"

# GCP ProviderConfig settings (for Pub/Sub)
gcpProviderConfig:
  # Name of the GCP ProviderConfig
  name: default
  # GCP project ID for Pub/Sub resources
  projectId: ""
  # Credentials source: Secret or InjectedIdentity
  credentialsSource: Secret
  # Secret reference for credentials (when source is Secret)
  secretRef:
    namespace: crossplane-system
    name: gcp-creds
    key: credentials.json
  # Pub/Sub emulator host (for testing with local emulator)
  # Set to "pubsub-emulator.asya-system.svc.cluster.local:8085" for emulator
  emulatorHost: ""

# Pub/Sub KEDA authentication configuration
pubsub:
  keda:
    secretRef:
      name: "gcp-keda-secret"
      credentialsKey: "credentials.json"
    # External scaler for Pub/Sub (bypasses Cloud Monitoring 2-4min lag)
    # When enabled, ScaledObjects use type: external instead of type: gcp-pubsub,
    # querying Pub/Sub subscription directly via Pull API for instant metric detection.
    scaler:
      enabled: false
      # gRPC address of the scaler service (host:port).
      # Auto-computed as asya-scaler-pubsub.{actorNamespace}.svc.cluster.local:6000 if empty.
      address: ""
      # Container image (temporarily uses asya-crew until asya-scalers image is published)
      image:
        repository: ghcr.io/deliveryhero/asya-crew
        tag: ""
        pullPolicy: IfNotPresent
      # K8s ServiceAccount for Workload Identity
      serviceAccountName: ""
      logLevel: "INFO"
      env: []
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi

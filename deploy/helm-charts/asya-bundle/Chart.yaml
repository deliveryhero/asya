apiVersion: v2
name: asya-bundle
description: Umbrella Helm chart for quick Asya🎭 installation with all components
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
- asya
- actor
- operator
- gateway
- bundle
- umbrella
maintainers:
- name: Asya Team

dependencies:
- name: asya-operator
  version: ">=0.1.0"
  repository: "file://../asya-operator"
  condition: operator.enabled
- name: asya-crew
  version: ">=0.4.0"
  repository: "file://../asya-crew"
  condition: crew.enabled
- name: asya-gateway
  version: ">=0.1.0"
  repository: "file://../asya-gateway"
  condition: gateway.enabled

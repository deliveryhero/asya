# Profile: SQS
#
# This configuration uses:
# - sqs for message transport
#
# Usage: docker compose -f profiles/sqs.yml up

include:
# Base infrastructure:
- path: ../../../shared/compose/sqs.yml
- path: ../../../shared/compose/minio.yml
- path: ../../../shared/compose/postgres.yml

- path: ../compose/testing-actors.yml
  env_file: .env.sqs

services:
  gateway:
    build:
      context: ../../../../src/asya-gateway
      dockerfile: Dockerfile
    env_file: .env.sqs
    command: ["./mesh-api"]
    environment:
      ASYA_MESH_EXTERNAL_PORT: "8080"
      ASYA_MESH_INTERNAL_PORT: "8081"
      ASYA_STATEPROXY_SOCKET: /tmp/stateproxy.sock
      ASYA_INTERNAL_URL: http://gateway:8081
      ASYA_NAMESPACE: test
      ASYA_QUEUE_TRANSPORT: sqs
      ASYA_SQS_ENDPOINT: http://sqs:9324
      ASYA_SQS_REGION: us-east-1
      ASYA_LOG_LEVEL: ${ASYA_LOG_LEVEL:-INFO}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
    - stateproxy-socket:/tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      pg-kv:
        condition: service_started
      sqs:
        condition: service_healthy

  pg-kv:
    build:
      context: ../../../../src/asya-state-proxy
      dockerfile: Dockerfile.go
      target: builder
    command: ["go", "run", "./cmd/pg-kv/"]
    environment:
      CONNECTOR_SOCKET: /tmp/stateproxy.sock
      STATE_PROXY_PG_URL: postgres://postgres:postgres@postgres:5432/asya_test?sslmode=disable
      STATE_PROXY_PG_INDEXES: "status"
    volumes:
    - stateproxy-socket:/tmp
    depends_on:
      postgres:
        condition: service_healthy

  tester:
    extends:
      file: ../compose/tester.yml
      service: tester
    env_file: .env.sqs
    environment:
      ASYA_TRANSPORT: sqs
    depends_on:
      storage-setup:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      test-actors-waiter:
        condition: service_completed_successfully

volumes:
  stateproxy-socket:

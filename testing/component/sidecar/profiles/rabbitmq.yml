# Profile: RabbitMQ
#
# This configuration uses:
# - RabbitMQ for message transport
#
# Usage: docker compose -f profiles/rabbitmq.yml up

include:
# Base infrastructure:
- path: ../../../shared/compose/rabbitmq.yml
- path: ../../../shared/compose/minio.yml
- path: ../../../shared/compose/postgres.yml

- path: ../compose/testing-actors.yml
  env_file: .env.rabbitmq

services:
  gateway:
    build:
      context: ../../../../src/asya-gateway
      dockerfile: Dockerfile
    env_file: .env.rabbitmq
    command: ["./mesh-api"]
    environment:
      ASYA_MESH_EXTERNAL_PORT: "8080"
      ASYA_MESH_INTERNAL_PORT: "8081"
      ASYA_STATEPROXY_SOCKET: /tmp/stateproxy.sock
      ASYA_INTERNAL_URL: http://gateway:8081
      ASYA_NAMESPACE: test
      ASYA_QUEUE_TRANSPORT: rabbitmq
      ASYA_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ASYA_RABBITMQ_EXCHANGE: asya
      ASYA_LOG_LEVEL: ${ASYA_LOG_LEVEL:-INFO}
    volumes:
    - stateproxy-socket:/tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      pg-kv:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  pg-kv:
    build:
      context: ../../../../src/asya-state-proxy
      dockerfile: Dockerfile.go
      target: builder
    command: ["go", "run", "./cmd/pg-kv/"]
    environment:
      CONNECTOR_SOCKET: /tmp/stateproxy.sock
      STATE_PROXY_PG_URL: postgres://postgres:postgres@postgres:5432/asya_test?sslmode=disable
      STATE_PROXY_PG_INDEXES: "status"
    volumes:
    - stateproxy-socket:/tmp
    depends_on:
      postgres:
        condition: service_healthy

  tester:
    extends:
      file: ../compose/tester.yml
      service: tester
    env_file: .env.rabbitmq
    environment:
      ASYA_TRANSPORT: rabbitmq
    depends_on:
      storage-setup:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      test-actors-waiter:
        condition: service_completed_successfully

volumes:
  stateproxy-socket:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

services:
  minio:
    image: minio/minio:latest
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    tmpfs:
    - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 15s
      retries: 10

  storage-setup:
    image: minio/mc:latest
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/asya-state &&
      echo '[+] bucket ready'
      "

  state-proxy-s3kv:
    build:
      context: ../../../src/asya-state-proxy
      dockerfile: Dockerfile.s3-kv
    logging: *default-logging
    environment:
      CONNECTOR_SOCKET: /var/run/asya/state/state-proxy.sock
      STATE_BUCKET: asya-state
      STATE_PREFIX: mesh/msg
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
    - state-sockets:/var/run/asya/state
    depends_on:
      storage-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/asya/state/state-proxy.sock"]
      interval: 1s
      timeout: 1s
      retries: 30

  tester:
    build:
      context: ../../../src/asya-testing
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      STATE_PROXY_SOCKET: /var/run/asya/state/state-proxy.sock
      COVERAGE_FILE: .coverage/cov.db
    volumes:
    - ${COVERAGE_DIR}:/app/.coverage:rw
    - state-sockets:/var/run/asya/state
    - ./tests:/app/tests:ro
    depends_on:
      state-proxy-s3kv:
        condition: service_healthy
    working_dir: /app
    entrypoint: /bin/bash
    command:
    - -c
    - |
      set -ex
      pytest tests/ ${PYTEST_OPTS}

volumes:
  state-sockets:

# Test profile: RabbitMQ + MinIO actor state + pg-kv gateway state
#
# RabbitMQ transport, MinIO object storage, pg-kv gateway state proxy (PostgreSQL).

namespace: asya-e2e

postgres:
  enabled: true

localstack:
  enabled: false

tracing:
  enabled: true
  endpoint: "tempo.asya-e2e.svc.cluster.local:4317"

observability:
  prometheus:
    enabled: true
  loki:
    enabled: true
  promtail:
    enabled: true

transport:
  rabbitmq:
    enabled: true
  sqs:
    enabled: false

storage:
  minio:
    enabled: true
  s3:
    enabled: false

actors:
  namespace: asya-e2e
  storage:
    type: minio
    endpoint: http://minio.asya-e2e.svc.cluster.local:9000
    bucket: asya-results
    resultsBucket: asya-results
    errorsBucket: asya-errors
    region: us-east-1
    accessKey: minioadmin
    secretKey: minioadmin

crew:
  image:
    pullPolicy: Never
  persistence:
    enabled: true
    backend: s3
    config:
      bucket: asya-results
      errorsBucket: asya-errors
      endpoint: http://minio.asya-e2e.svc.cluster.local:9000
      region: us-east-1
  x-sink:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/results"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
    scaling:
      enabled: true
      minReplicaCount: 1
  x-sump:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/errors"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
    scaling:
      enabled: true
      minReplicaCount: 1

gateway:
  meshApi:
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  mcp:
    enabled: true
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  a2a:
    enabled: true
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  stateProxy:
    mesh:
      image:
        repository: ghcr.io/deliveryhero/asya-state-proxy-go
        tag: dev
        pullPolicy: Never
  database:
    host: asya-gateway-postgresql.asya-e2e.svc.cluster.local
    port: 5432
    name: asya_gateway
    username: asya
    password: asya-db-password
  transports:
    rabbitmq:
      enabled: true
      config:
        url: amqp://guest:guest@asya-rabbitmq.asya-e2e.svc.cluster.local:5672/
        exchange: asya
        poolSize: 20
    sqs:
      enabled: false
  mcpTools:
  - name: test_echo
    description: "Echo test tool"
    actor: test-echo
    timeout: 120
  a2aAgents:
  - name: test-agent
    description: "Test A2A agent"
    actor: test-echo
    timeout: 120
    streaming: true
    skills:
    - id: test_echo
      name: Echo
      description: "Echo back input"
    inputModes: [text/plain, application/json]
    outputModes: [text/plain, application/json]

crossplane:
  transport: rabbitmq
  providers:
    aws:
      enabled: false
  sidecar:
    image: ghcr.io/deliveryhero/asya-sidecar:latest
    imagePullPolicy: Never
    rabbitmqURL: amqp://guest:guest@asya-rabbitmq.asya-e2e.svc.cluster.local:5672/
    tracingEndpoint: tempo.asya-e2e.svc.cluster.local:4317
  providerConfigs:
    install: false
  functions:
    flavorsEnabled: true
  kubernetesProviderConfig:
    name: in-cluster
    credentialsSource: InjectedIdentity
  actorNamespace: asya-e2e
  irsa:
    enabled: false
  rabbitmq:
    host: asya-rabbitmq.asya-e2e.svc.cluster.local
    port: 5672
    keda:
      secretRef:
        name: rabbitmq-secret
        hostKey: host

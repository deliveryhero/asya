# Test profile (values.yaml file): Pub/Sub + GCS
#
# Tests Google Cloud Pub/Sub message transport with GCS object storage
# (using gcloud Pub/Sub emulator and fake-gcs-server in E2E environment)

namespace: asya-e2e

tracing:
  enabled: true
  endpoint: "tempo.asya-e2e.svc.cluster.local:4317"

observability:
  prometheus:
    enabled: true
  loki:
    enabled: true
  promtail:
    enabled: true

# KEDA operator configuration for the pubsub-gcs profile.
# PUBSUB_EMULATOR_HOST routes the gcp-pubsub scaler to the in-cluster emulator,
# bypassing GCP OAuth (the emulator accepts requests without authentication).
# Without this, KEDA fails with Unauthenticated errors against pubsub.googleapis.com,
# causing ScaledObject Ready=False which blocks function-auto-ready from firing.
keda:
  env:
  - name: PUBSUB_EMULATOR_HOST
    value: "pubsub-emulator.asya-system.svc.cluster.local:8085"

transport:
  rabbitmq:
    enabled: false
  sqs:
    enabled: false
  pubsub:
    enabled: true

storage:
  minio:
    enabled: false
  s3:
    enabled: false
  gcs:
    enabled: true

actors:
  namespace: asya-e2e
  storage:
    type: gcs
    bucket: asya-results
    resultsBucket: asya-results
    errorsBucket: asya-errors
    project: test-project
    emulatorHost: "http://gcs-emulator.asya-system.svc.cluster.local:4443"

crew:
  image:
    tag: latest
    pullPolicy: Never
  persistence:
    enabled: true
    backend: gcs
    config:
      bucket: asya-results
      errorsBucket: asya-errors
      project: test-project
      emulatorHost: "http://gcs-emulator.asya-system.svc.cluster.local:4443"
    connector:
      image: ghcr.io/deliveryhero/asya-state-proxy-gcs-buffered-lww:dev
  x-sink:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/results"
      PUBSUB_EMULATOR_HOST: "pubsub-emulator.asya-system.svc.cluster.local:8085"
    scaling:
      enabled: true
      minReplicaCount: 1
  x-sump:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/errors"
      PUBSUB_EMULATOR_HOST: "pubsub-emulator.asya-system.svc.cluster.local:8085"
    scaling:
      enabled: true
      minReplicaCount: 1

gateway:
  meshApi:
    image:
      pullPolicy: Never
  mcp:
    enabled: true
    image:
      pullPolicy: Never
  a2a:
    enabled: true
    image:
      pullPolicy: Never
  stateProxy:
    mesh:
      image:
        pullPolicy: Never
  database:
    host: asya-gateway-postgresql.asya-e2e.svc.cluster.local
    port: 5432
    name: asya_gateway
    username: asya
    password: asya-db-password
  transports:
    rabbitmq:
      enabled: false
    sqs:
      enabled: false
    pubsub:
      enabled: true
      config:
        projectId: "test-project"
        endpoint: "pubsub-emulator.asya-system.svc.cluster.local:8085"
  mcpTools:
  - name: test_echo
    description: "Echo test tool"
    actor: test-echo
    timeout: 120
  a2aAgents:
  - name: test-agent
    description: "Test A2A agent"
    actor: test-echo
    timeout: 120
    streaming: true
    skills:
    - id: echo
      name: Echo
      description: "Echo back input"
    inputModes: [text/plain, application/json]
    outputModes: [text/plain, application/json]
  - name: ASYA_A2A_API_KEY
    value: "test-api-key-e2e"
  - name: ASYA_A2A_JWT_JWKS_URL
    value: "http://asya-jwks-server.asya-e2e.svc.cluster.local/jwks.json"
  - name: ASYA_A2A_JWT_ISSUER
    value: "https://test-issuer.e2e"
  - name: ASYA_A2A_JWT_AUDIENCE
    value: "asya-gateway-e2e"

crossplane:
  transport: pubsub
  providers:
    aws:
      enabled: false
    gcp:
      enabled: true
  sidecar:
    image: ghcr.io/deliveryhero/asya-sidecar:latest
    imagePullPolicy: Never
    tracingEndpoint: tempo.asya-e2e.svc.cluster.local:4317
    pubsubEndpoint: pubsub-emulator.asya-system.svc.cluster.local:8085
    gcpProjectId: test-project
  providerConfigs:
    install: false
  functions:
    flavorsEnabled: true
  gcpProviderConfig:
    name: gcp-emulator
    projectId: test-project
    emulatorHost: "pubsub-emulator.asya-system.svc.cluster.local:8085"
    credentialsSource: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: credentials.json
  pubsub:
    keda:
      secretRef:
        name: gcp-keda-secret
        credentialsKey: credentials.json
      scaler:
        enabled: true
        address: "asya-scaler-pubsub.asya-system.svc.cluster.local:6000"
        image:
          repository: ghcr.io/deliveryhero/asya-crew
          tag: latest
          pullPolicy: Never
        env:
        - name: PUBSUB_EMULATOR_HOST
          value: "pubsub-emulator.asya-system.svc.cluster.local:8085"
  actorNamespace: asya-e2e
  irsa:
    enabled: false

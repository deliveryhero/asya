# Test profile (values.yaml file): SQS + S3
#
# Tests SQS message transport with S3 object storage
# (using LocalStack for both SQS and S3 emulation in E2E environment)

namespace: asya-e2e

transport:
  rabbitmq:
    enabled: false
  sqs:
    enabled: true

storage:
  minio:
    enabled: false
  s3:
    enabled: true

actors:
  namespace: asya-e2e
  storage:
    type: s3
    endpoint: http://localstack-s3.asya-system.svc.cluster.local:4566
    bucket: asya-results
    resultsBucket: asya-results
    errorsBucket: asya-errors
    region: us-east-1
    accessKey: test
    secretKey: test

crew:
  image:
    tag: latest
    pullPolicy: Never
  sqs:
    dlq:
      enabled: true
      providerConfigRef: localstack
      region: us-east-1
  persistence:
    enabled: true
    backend: s3
    connector:
      image: ghcr.io/deliveryhero/asya-state-proxy-s3-buffered-lww:dev
    config:
      bucket: asya-results
      errorsBucket: asya-errors
      endpoint: http://localstack-s3.asya-system.svc.cluster.local:4566
      region: us-east-1
      accessKey: test
      secretKey: test
  x-sink:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/results"
      ASYA_SQS_WAIT_TIME_SECONDS: "2"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    scaling:
      enabled: true
      minReplicaCount: 1
  x-sump:
    env:
      ASYA_PERSISTENCE_MOUNT: "/state/checkpoints/errors"
      ASYA_SQS_WAIT_TIME_SECONDS: "2"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    scaling:
      enabled: true
      minReplicaCount: 1

gateway:
  meshApi:
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  mcp:
    enabled: true
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  a2a:
    enabled: true
    image:
      repository: ghcr.io/deliveryhero/asya-gateway
      tag: latest
      pullPolicy: Never
  stateProxy:
    mesh:
      image:
        repository: ghcr.io/deliveryhero/asya-state-proxy-pg-kv
        tag: dev
        pullPolicy: Never
  database:
    host: asya-gateway-postgresql.asya-e2e.svc.cluster.local
    port: 5432
    name: asya_gateway
    username: asya
    password: asya-db-password
  transports:
    rabbitmq:
      enabled: false
    sqs:
      enabled: true
      config:
        endpoint: "http://localstack-sqs.asya-system.svc.cluster.local:4566"
        region: "us-east-1"
        visibilityTimeout: 30
        waitTimeSeconds: 2
  mcpTools:
  - name: test_echo
    description: "Echo test tool"
    actor: test-echo
    timeout: 120
  a2aAgents:
  - name: test-agent
    description: "Test A2A agent"
    actor: test-echo
    timeout: 120
    streaming: true
    skills:
    - id: echo
      name: Echo
      description: "Echo back input"
    inputModes: [text/plain, application/json]
    outputModes: [text/plain, application/json]

crossplane:
  transport: sqs
  providers:
    aws:
      enabled: true
  sqs:
    receiveWaitTimeSeconds: 2
  sidecar:
    image: ghcr.io/deliveryhero/asya-sidecar:latest
    imagePullPolicy: Never
    sqsEndpoint: http://localstack-sqs.asya-system.svc.cluster.local:4566
    sqsWaitTimeSeconds: "2"
    awsCredsSecret: aws-creds
  providerConfigs:
    install: false
  functions:
    flavorsEnabled: true
  awsProviderConfig:
    name: localstack
    credentialsSource: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
    endpoint:
      enabled: true
      url: http://localstack-sqs.asya-system.svc.cluster.local:4566
      hostnameImmutable: true
    skipCredentialsValidation: true
    skipMetadataApiCheck: true
    skipRequestingAccountId: true
    skipRegionValidation: true
    s3UsePathStyle: true
  awsRegion: us-east-1
  awsAccountId: "000000000000"
  actorNamespace: asya-e2e
  irsa:
    enabled: false
  keda:
    authProvider: secret
    secretRef:
      name: aws-creds
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

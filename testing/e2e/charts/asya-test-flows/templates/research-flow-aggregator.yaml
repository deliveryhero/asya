---
# Fan-in aggregator for the research_flow E2E test.
#
# Runs the asya_crew S3 split-key aggregator, which:
# - Collects N+1 fan-in slices (1 parent payload + N sub-agent results)
# - Emits a merged message once all slices arrive
# - Uses the state proxy sidecar for durable S3-backed state storage
#
# The aggregator reads x-asya-fan-in header via ABI yield protocol
# for fan-in coordination.
#
# State proxy is configured inline (not via overlay) because the
# Crossplane composition does not yet propagate stateProxy from
# the overlay context to the XR spec where the injector reads it.
apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: research-flow-aggregator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asya-test-flows.labels" . | nindent 4 }}
    asya.sh/flow: research-flow
    asya.sh/actor-type: aggregator
spec:
  actor: research-flow-aggregator
  compositionSelector:
    matchLabels:
      asya.sh/transport: {{ .Values.transport }}
  transport: {{ .Values.transport }}

  stateProxy:
    - name: checkpoints
      mount:
        path: /state/checkpoints
      connector:
        image: {{ .Values.stateProxy.connector.image }}
        env:
          - name: STATE_BUCKET
            value: {{ .Values.stateProxy.config.bucket | quote }}
          {{- with .Values.stateProxy.config.endpoint }}
          - name: STATE_ENDPOINT
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.stateProxy.config.region }}
          - name: AWS_REGION
            value: {{ . | quote }}
          {{- end }}
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"

  scaling:
    enabled: {{ .Values.scaling.enabled }}
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: {{ .Values.scaling.pollingInterval }}
    cooldownPeriod: {{ .Values.scaling.cooldownPeriod }}
    queueLength: 5

  workload:
    kind: Deployment
    template:
      spec:
        containers:
        - name: asya-runtime
          image: {{ .Values.crewImage | default "ghcr.io/deliveryhero/asya-crew:latest" }}
          imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
          env:
          - name: ASYA_HANDLER
            value: asya_crew.fanin.s3_split_key.aggregator
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

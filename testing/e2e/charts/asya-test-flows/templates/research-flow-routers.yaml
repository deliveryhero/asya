---
apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: start-research-flow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asya-test-flows.labels" . | nindent 4 }}
    asya.sh/flow: research-flow
    asya.sh/actor-type: router
spec:
  actor: start-research-flow


  scaling:
    enabled: {{ .Values.scaling.enabled }}
    minReplicaCount: {{ .Values.scaling.minReplicaCount }}
    maxReplicaCount: {{ .Values.scaling.maxReplicaCount }}
    pollingInterval: {{ .Values.scaling.pollingInterval }}
    cooldownPeriod: {{ .Values.scaling.cooldownPeriod }}
    queueLength: {{ .Values.scaling.queueLength }}

  image: {{ .Values.workload.image }}
  imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
  handler: asya_testing.flows.research_flow.compiled.routers.start_research_flow
  env:
  {{- include "asya-test-flows.research-flow-handler-env" . | nindent 2 }}
---
apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: router-research-flow-line-7-fanout-1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asya-test-flows.labels" . | nindent 4 }}
    asya.sh/flow: research-flow
    asya.sh/actor-type: router
spec:
  actor: router-research-flow-line-7-fanout-1


  scaling:
    enabled: {{ .Values.scaling.enabled }}
    minReplicaCount: {{ .Values.scaling.minReplicaCount }}
    maxReplicaCount: {{ .Values.scaling.maxReplicaCount }}
    pollingInterval: {{ .Values.scaling.pollingInterval }}
    cooldownPeriod: {{ .Values.scaling.cooldownPeriod }}
    queueLength: {{ .Values.scaling.queueLength }}

  image: {{ .Values.workload.image }}
  imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
  handler: asya_testing.flows.research_flow.compiled.routers.router_research_flow_line_7_fanout_1
  env:
  {{- include "asya-test-flows.research-flow-handler-env" . | nindent 2 }}

apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: test-retry-nonretryable
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asya-test-actors.labels" . | nindent 4 }}
spec:
  actor: test-retry-nonretryable

  resiliency:
    actorTimeout: "30s"
    policies:
      default:
        maxAttempts: 5
        backoff: exponential
        initialDelay: "1s"
      nonretryable:
        maxAttempts: 1
    rules:
      - errors:
          - ValueError
        policy: nonretryable

  scaling:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 5
    pollingInterval: 5
    cooldownPeriod: 30
    queueLength: 5

  image: {{ .Values.workload.image }}
  imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
  handler: asya_testing.handlers.payload.error_handler

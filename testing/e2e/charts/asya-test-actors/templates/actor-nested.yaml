apiVersion: asya.sh/v1alpha1
kind: AsyncActor
metadata:
  name: test-nested
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asya-test-actors.labels" . | nindent 4 }}
spec:
  actor: test-nested
  flavors:
  - asya-test-actor

  scaling:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 5
    cooldownPeriod: 30
    queueLength: 5

  image: {{ .Values.workload.image }}
  imagePullPolicy: {{ .Values.workload.imagePullPolicy }}
  handler: asya_testing.handlers.payload.nested_data_handler

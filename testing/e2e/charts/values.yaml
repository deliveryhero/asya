crossplane:
  awsProviderConfig:
    name: default
    credentialsSource: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
    endpoint:
      enabled: false
      url: ""
      hostnameImmutable: true
    skipCredentialsValidation: false
    skipMetadataApiCheck: false
    skipRequestingAccountId: false
    skipRegionValidation: false
    s3UsePathStyle: false
  awsRegion: us-east-1
  awsAccountId: "000000000000"
  actorNamespace: asya-e2e
  irsa:
    enabled: false
  keda:
    authProvider: podIdentity
    secretRef:
      name: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  functions:
    flavorsPackagePullPolicy: Never

gateway:
  image:
    repository: ghcr.io/deliveryhero/asya-gateway
    tag: latest
    pullPolicy: Never

  tests:
    image: ghcr.io/deliveryhero/asya-testing:latest
    imagePullPolicy: Never

  replicaCount: 1

  service:
    type: NodePort
    port: 8080
    nodePort: 30080
    meshType: NodePort
    meshNodePort: 30081

  config:
    port: "8080"

  transports:
    rabbitmq:
      enabled: false
      config:
        url: "amqp://guest:guest@asya-rabbitmq.asya-e2e.svc.cluster.local:5672/"
        exchange: "asya"
        poolSize: 20
    sqs:
      enabled: false
      config:
        endpoint: ""
        region: "us-east-1"
        visibilityTimeout: 30
        waitTimeSeconds: 2
    pubsub:
      enabled: false
      config:
        projectId: ""
        endpoint: ""

  postgresql:
    host: postgres.asya-e2e.svc.cluster.local
    port: 5432
    database: asya
    username: asya
    passwordSecretRef:
      name: postgres-secret
      key: password

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

actors:
  namespace: asya-e2e
  storage:
    type: minio
    endpoint: http://minio.asya-e2e.svc.cluster.local:9000
    bucket: asya-results
    accessKey: minioadmin
    secretKey: minioadmin

crew:
  image:
    repository: ghcr.io/deliveryhero/asya-crew
    tag: latest
    pullPolicy: Never

  x-sink:
    enabled: true
    name: x-sink
    env:
      ASYA_GATEWAY_URL: "http://asya-gateway-mesh.asya-e2e.svc.cluster.local:8080"
      ASYA_PERSISTENCE_MOUNT: "/tmp/checkpoints/results"
      ASYA_SQS_WAIT_TIME_SECONDS: "2"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    scaling:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      pollingInterval: 5
      cooldownPeriod: 30
      queueLength: 5

  x-sump:
    enabled: true
    name: x-sump
    env:
      ASYA_GATEWAY_URL: "http://asya-gateway-mesh.asya-e2e.svc.cluster.local:8080"
      ASYA_PERSISTENCE_MOUNT: "/tmp/checkpoints/errors"
      ASYA_SQS_WAIT_TIME_SECONDS: "2"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    scaling:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      pollingInterval: 5
      cooldownPeriod: 30
      queueLength: 5

tracing:
  enabled: false
  endpoint: ""

observability:
  enabled: false

transport:
  rabbitmq:
    enabled: false
  sqs:
    enabled: false
  pubsub:
    enabled: false

storage:
  minio:
    enabled: false
  s3:
    enabled: false
  gcs:
    enabled: false

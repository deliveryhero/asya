[pytest]
testpaths = tests
python_files = test_*.py
markers =
    core: marks infrastructure and operator lifecycle tests
    fast: marks regular E2E tests (default for unmarked tests)
    slow: marks tests as slow (deselect with '-m "not slow"')
    chaos: marks tests that disrupt infrastructure (run serially)
    dlq: marks tests for dead-letter queue functionality
    comparison: marks tests that compare different behaviors
    smoke: marks quick syntax/validation tests
    flow: marks tests for flow DSL functionality
    docs: marks tests that validate documentation examples
    manual: marks tests requiring manual setup (clean cluster, specific environment)
timeout = 120
timeout_method = thread
